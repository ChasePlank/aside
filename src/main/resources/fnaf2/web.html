<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>you cannot block anything</title>
<style>
  :root{--bg:#05060A; --ink:#D8D8E4; --dim:#7A7A90; --red:#E94560; --gold:#FFD700;
        --panel:#0B0D14; --line:#1E2030}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:14px 14px 22px;min-height:100%;
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;letter-spacing:.10em;color:var(--red);margin:2px 0 0;text-transform:uppercase}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .nightrow{display:block;width:100%;text-align:left;padding:12px 14px;margin:0 0 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;cursor:pointer}
  .nightrow:active{background:#16171F}
  .nightrow .t{display:block;font-size:16px}
  .nightrow .n{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .help{color:var(--dim);font-size:12px;line-height:1.6}
  #band{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}
  #night{color:var(--red);letter-spacing:.06em}
  .meter{height:6px;background:#141620;border-radius:3px;overflow:hidden;width:62px}
  .meter i{display:block;height:100%;width:100%;background:#5A6A8A}
  .meter.low i{background:var(--red)}
  #stage{position:relative;background:#02030A;border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  #readout{font-size:13px;letter-spacing:.04em;color:var(--gold);min-height:20px}
  #readout small{color:var(--dim);letter-spacing:0}
  #strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  #strip button{padding:12px 6px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  #strip button:active{background:#16171F}
  #strip button.wide{grid-column:1 / -1}
  #strip button[disabled]{opacity:.35}
  #strip button.on{border-color:var(--red);color:var(--red)}
  #over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:6px;background:rgba(2,3,10,.86);text-align:center;padding:18px}
  #over h2{margin:0;font-size:22px;color:var(--red);letter-spacing:.06em}
  #over p{margin:0;color:var(--dim);font-size:13px}
  #over button{margin-top:10px;padding:10px 18px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <h1>Five Nights at Freddy's 2</h1>
  <p class="sub">Three openings, no doors, and a music box that is the only clock that matters.</p>

  <div id="select"></div>

  <div id="band" hidden>
    <span id="night"></span>
    <span id="clock"></span>
    <span>MUSIC BOX <span class="meter" id="mb"><i></i></span></span>
  </div>

  <div id="stage" hidden>
    <canvas id="cv" width="720" height="440"></canvas>
    <div id="over" hidden>
      <h2 id="overtitle"></h2>
      <p id="overtext"></p>
      <button id="again">Again</button>
    </div>
  </div>

  <div id="readout" hidden></div>

  <div id="strip" hidden>
    <button id="mon" class="wide">MONITOR UP</button>
    <button id="hl">HALL LIGHT</button>
    <button id="vl">VENT L</button>
    <button id="vr">VENT R</button>
    <button id="mask">MASK</button>
    <button id="wind">WIND</button>
    <button id="cam11">CAM 11</button>
  </div>

  <p class="help" id="help"></p>
</div>

<script>
/*__CONTENT__*/

/*__AUDIO__*/

/**
 * FNAF2's cue names, on the shared palette.
 *
 * This game's arrival cue is not decoration: the engine carries Chase's
 * own playtest note -- "I checked lights, went to wind the music box, and got
 * jumpscared. If the timer between entering and killing is 5 seconds, then
 * they arent visible." The grace is what makes an arrival survivable; the cue
 * is what makes it fair. A silent port is an unfair one.
 */
function sfx(cue) {
  switch (cue) {
    case "at_door": voice("knock"); break;
    case "camera_down": voice("click"); break;
    case "chime_6am": voice("chime"); break;
    case "door_close": voice("knock"); break;
    case "light_click": voice("click"); break;
    case "music_box": voice("down"); break;
    case "power_down": voice("down"); break;
    case "static": voice("static"); break;
    default: break;
  }
}

// --------------------------------------------------------------- the night
//
// A faithful port of aside.games.fnaf2.engine.Game. FNAF 2 cannot block
// anything: it hides behind a mask and rations attention. The office has
// three openings and no doors, the mask fools most of them and blocks the
// camera and every light while worn, and the music box drains in under a
// minute and is the real clock -- if it empties the Puppet comes and
// nothing stops it.
//
// java.util.Random is reproduced in BigInt so the same seed deals the same
// night in both builds. This engine seeds Random directly rather than
// through the splitmix64 finalizer the later games use.

function RNG(seed) {
  this.s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
}
RNG.prototype.next = function (bits) {
  this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
  return Number(this.s >> BigInt(48 - bits));
};
RNG.prototype.nextDouble = function () {
  return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
};
RNG.prototype.nextInt = function (bound) {
  let r = this.next(31);
  const m = bound - 1;
  if ((bound & m) === 0) return Number((BigInt(bound) * BigInt(r)) >> 31n);
  let u = r;
  for (;;) {
    r = u % bound;
    if (((u - r + m) | 0) >= 0) return r;
    u = this.next(31);
  }
};
RNG.prototype.nextBoolean = function () { return this.next(1) !== 0; };

// The art, as data URIs in the content. Loaded once, and the drawing waits
// for them rather than drawing a half-built frame.
const IMG = {};
let artReady = false;
{
  const keys = Object.keys(C.assets);
  let left = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) artReady = true; };
    im.src = C.assets[k];
    IMG[k] = im;
  }
}

const HOUR_SECONDS = C.hourSeconds, NIGHT_HOURS = C.nightHours;
const MUSIC_BOX_MAX = C.musicBoxMax, MUSIC_BOX_WIND = C.musicBoxWind;
const PUPPET_GRACE = C.puppetGrace;
const FOXY_HALL_WINDOW = C.foxyHallWindow, FOXY_REPEL_TIME = C.foxyRepelTime;
const OPENING_GRACE_MAX = C.openingGraceMax, OPENING_GRACE_MIN = C.openingGraceMin;
const OFFICE = 0, COVE_CAM = 3, MUSIC_BOX_CAM = 11, CAM_COUNT = 11;
const NONE = 0, HALL = 1, VENT_L = 2, VENT_R = 3;

function Animatronic(name, path, opening, answer, lethal, aiLevel, moveInterval, game) {
  this.name = name; this.path = path; this.opening = opening; this.answer = answer;
  this.lethal = lethal; this.aiLevel = aiLevel; this.moveInterval = moveInterval;
  this.game = game;
  this.pathIndex = 0; this.moveTimer = 0;
  this.staged = false; this.stages = 0; this.hallWindow = 0; this.repelTimer = 0;
  this.arrivalAnnounced = false;
  this.resolved = false; this.officeTimer = 0;
}
Animatronic.prototype.currentRoom = function () {
  return this.pathIndex < this.path.length ? this.path[this.pathIndex] : OFFICE;
};
Animatronic.prototype.atOpening = function () {
  return !this.staged && this.pathIndex >= this.path.length;
};
Animatronic.prototype.retreat = function () {
  this.pathIndex = Math.max(0, this.pathIndex - 2);
  this.resolved = false; this.officeTimer = 0;
};
Animatronic.prototype.update = function (dt) {
  const g = this.game;
  if (g.status !== "PLAYING") return;
  if (this.aiLevel <= 0) return;
  if (this.staged) { this.updateStaged(dt); return; }
  if (this.atOpening()) return;
  this.moveTimer += dt;
  if (this.moveTimer < this.moveInterval) return;
  this.moveTimer = 0;
  if (g.rng.nextInt(20) < this.aiLevel) {
    this.pathIndex++;
    if (this.atOpening()) {
      this.officeTimer = 0; this.resolved = false;
      g.cue("at_door");
    }
  }
};
Animatronic.prototype.updateStaged = function (dt) {
  const g = this.game;
  if (this.stages >= 3) {
    if (!this.arrivalAnnounced) {
      this.arrivalAnnounced = true; this.hallWindow = FOXY_HALL_WINDOW; this.repelTimer = 0;
      g.cue("at_door");
    }
    if (g.hallLightOn) {
      this.repelTimer += dt;
      if (this.repelTimer >= FOXY_REPEL_TIME) { this.repelled(); return; }
    }
    this.hallWindow -= dt;
    if (this.hallWindow <= 0) g.jumpscare(this);
    return;
  }
  if (g.cameraUp && g.currentCam === COVE_CAM) return;
  this.moveTimer += dt;
  if (this.moveTimer < this.moveInterval) return;
  this.moveTimer = 0;
  if (g.rng.nextInt(20) < this.aiLevel) {
    this.stages++;
    if (this.stages >= 3) {
      this.arrivalAnnounced = false; this.hallWindow = FOXY_HALL_WINDOW; this.repelTimer = 0;
    }
  }
};
Animatronic.prototype.repelled = function () {
  this.stages = 0; this.arrivalAnnounced = false; this.hallWindow = 0;
  this.repelTimer = 0; this.moveTimer = 0;
  this.game.cue("door_close");
};

function Game(night, seed) {
  this.night = night;
  this.rng = new RNG(seed);
  this.time = 0; this.hour = 0;
  this.hallLightOn = false; this.ventLLightOn = false; this.ventRLightOn = false;
  this.maskOn = false; this.cameraUp = false; this.currentCam = 1;
  this.lightsDisabled = false; this.winding = false;
  this.musicBox = MUSIC_BOX_MAX; this.puppetTimer = 0; this.puppetComing = false;
  this.status = "PLAYING"; this.jumpscareBy = null;
  this.cues = [];
  const lv = C.aiLevel[Math.min(night - 1, 5)];
  const A = Animatronic;
  this.toyFreddy = new A("Toy Freddy", [1, 2, 4], "HALL", "MASK", true, lv, 5.02, this);
  this.toyBonnie = new A("Toy Bonnie", [1, 2, 5, 7], "VENT_R", "MASK", true, lv, 4.96, this);
  this.toyChica = new A("Toy Chica", [1, 2, 6, 7], "VENT_R", "MASK", true, lv, 4.99, this);
  this.mangle = new A("Mangle", [1, 2, 5, 7], "VENT_R", "MASK", true, lv, 5.04, this);
  this.witheredBonnie = new A("Withered Bonnie", [1, 2, 9, 10], "VENT_L", "MASK", true, lv, 5.01, this);
  this.balloonBoy = new A("Balloon Boy", [1, 2, 9, 10], "VENT_L", "MASK", false, lv, 4.94, this);
  this.witheredFoxy = new A("Withered Foxy", [COVE_CAM], "HALL", "LIGHT", true, lv, 5.03, this);
  this.witheredFoxy.staged = true;
  this.puppet = new A("The Puppet", [MUSIC_BOX_CAM], "HALL", "NONE", true, 20, 1.0, this);
}
Game.prototype.aiLevel = function () { return C.aiLevel[Math.min(this.night - 1, 5)]; };
Game.prototype.openingGrace = function () {
  const t = Math.min(1, this.aiLevel() / 20);
  return OPENING_GRACE_MAX - t * (OPENING_GRACE_MAX - OPENING_GRACE_MIN);
};
Game.prototype.drainRate = function () {
  return C.musicBoxDrain * C.drainMult[Math.min(this.night - 1, 5)];
};
Game.prototype.clock = function () {
  const h = Math.min(this.hour, 6);
  return h === 0 ? "12 AM" : (h < 6 ? h + " AM" : "6 AM");
};
Game.prototype.cue = function (n) { this.cues.push(n); };
Game.prototype.drain = function () { const c = this.cues; this.cues = []; return c; };
Game.prototype.visitors = function () {
  return [this.toyFreddy, this.toyBonnie, this.toyChica, this.mangle,
          this.witheredBonnie, this.balloonBoy];
};
Game.prototype.cast = function () {
  return [this.toyFreddy, this.witheredFoxy, this.toyBonnie, this.toyChica,
          this.mangle, this.witheredBonnie, this.balloonBoy];
};
Game.prototype.someoneAtTheOffice = function () {
  if (this.witheredFoxy.stages >= 3) return true;
  for (const a of this.visitors()) if (a.atOpening() && !a.resolved) return true;
  return false;
};
Game.prototype.jumpscare = function (a) {
  this.status = "JUMPSCARED"; this.jumpscareBy = a;
  this.cue("scare_" + a.name.toLowerCase().replace(/ /g, ""));
};

Game.prototype.update = function (dt) {
  if (this.status !== "PLAYING") return;
  this.time += dt;
  this.hour = Math.floor(this.time / HOUR_SECONDS);
  if (this.hour >= NIGHT_HOURS) { this.status = "SURVIVED"; this.cue("chime_6am"); return; }

  if (this.winding && this.cameraUp && this.currentCam === MUSIC_BOX_CAM && !this.maskOn) {
    this.musicBox = Math.min(MUSIC_BOX_MAX, this.musicBox + MUSIC_BOX_WIND * dt);
  } else {
    this.musicBox -= this.drainRate() * dt;
  }
  if (this.musicBox <= 0) {
    this.musicBox = 0;
    if (!this.puppetComing) { this.puppetComing = true; this.puppetTimer = 0; this.cue("music_box"); }
  }
  if (this.puppetComing) {
    this.puppetTimer += dt;
    if (this.puppetTimer >= PUPPET_GRACE) { this.jumpscare(this.puppet); return; }
  }

  this.toyFreddy.update(dt);
  this.toyBonnie.update(dt);
  this.toyChica.update(dt);
  this.mangle.update(dt);
  this.witheredBonnie.update(dt);
  this.balloonBoy.update(dt);
  this.witheredFoxy.update(dt);

  this.answerOpenings(dt);
};

Game.prototype.answerOpenings = function (dt) {
  for (const a of this.visitors()) {
    if (!a.atOpening() || a.resolved) continue;
    // 1. The mask answers first. It is the defensive state change, and the
    //    order is load-bearing: with Balloon Boy's lights taken first, a
    //    player already wearing the mask still lost them.
    if (a.answer === "MASK" && this.maskOn) {
      a.resolved = true; a.retreat(); this.cue("door_close");
      continue;
    }
    // 2. Then anything the visitor does to the office.
    a.officeTimer += dt;
    if (a.officeTimer < this.openingGrace()) continue;
    if (a.answer === "NONE" || !a.lethal) {
      if (!this.lightsDisabled) {
        this.lightsDisabled = true; this.setLight(NONE); this.cue("power_down");
      }
      a.resolved = true; a.retreat();
      continue;
    }
    this.jumpscare(a);
    return;
  }
};

Game.prototype.lightsBlocked = function () {
  return this.status !== "PLAYING" || this.lightsDisabled || this.maskOn;
};
Game.prototype.setLight = function (which) {
  this.hallLightOn = which === HALL;
  this.ventLLightOn = which === VENT_L;
  this.ventRLightOn = which === VENT_R;
};
Game.prototype.toggleHallLight = function () {
  if (this.lightsBlocked()) return;
  this.setLight(this.hallLightOn ? NONE : HALL); this.cue("light_click");
};
Game.prototype.toggleVentLLight = function () {
  if (this.lightsBlocked()) return;
  this.setLight(this.ventLLightOn ? NONE : VENT_L); this.cue("light_click");
};
Game.prototype.toggleVentRLight = function () {
  if (this.lightsBlocked()) return;
  this.setLight(this.ventRLightOn ? NONE : VENT_R); this.cue("light_click");
};
Game.prototype.toggleMask = function () {
  if (this.status !== "PLAYING") return;
  this.maskOn = !this.maskOn;
  if (this.maskOn) { this.cameraUp = false; this.setLight(NONE); this.winding = false; }
  this.cue("camera_down");
};
Game.prototype.toggleCamera = function () {
  if (this.status !== "PLAYING" || this.maskOn) return;
  this.cameraUp = !this.cameraUp;
  if (!this.cameraUp) this.winding = false;
  this.cue(this.cameraUp ? "camera_up" : "camera_down");
};
Game.prototype.setCam = function (cam) {
  if (cam < 1 || cam > CAM_COUNT) return;
  this.currentCam = cam;
};
Game.prototype.setWinding = function (on) { this.winding = on; };

// --------------------------------------------------------------- the office

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const OPEN = {
  VENT_L: [30, 70, 200, 250],
  HALL:   [260, 70, 200, 250],
  VENT_R: [490, 70, 200, 250]
};
const GRID = (() => {
  const out = {};
  for (let c = 1; c <= CAM_COUNT; c++) {
    const col = (c - 1) % 4, row = Math.floor((c - 1) / 4);
    out[c] = [24 + col * 172, 56 + row * 118, 160, 104];
  }
  return out;
})();

function drawOffice(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  const lit = { VENT_L: g.ventLLightOn, HALL: g.hallLightOn, VENT_R: g.ventRLightOn };
  // The office, in whichever light is on. There is one view per light state
  // and no view with two lights on, which is the game's own rule about your
  // hands stated as four photographs.
  const which = g.hallLightOn ? "office.hall"
              : g.ventLLightOn ? "office.ventL"
              : g.ventRLightOn ? "office.ventR" : "office";
  const om = IMG[which];
  if (om && om.complete && om.naturalWidth) cx.drawImage(om, 0, 0, W, H);
  for (const k of Object.keys(OPEN)) {
    const b = OPEN[k];
    // Translucent, so the office photograph reads through the openings. The
    // first version filled them solid and the room disappeared behind three
    // black rectangles.
    cx.fillStyle = "rgba(2,3,10,0.45)"; cx.fillRect(b[0], b[1], b[2], b[3]);
    cx.strokeStyle = lit[k] ? "#6A5A3A" : "#1E2030";
    cx.lineWidth = lit[k] ? 3 : 2;
    cx.strokeRect(b[0], b[1], b[2], b[3]);
    if (lit[k]) {
      cx.fillStyle = "rgba(255,220,150,0.10)";
      cx.fillRect(b[0] + 4, b[1] + 4, b[2] - 8, b[3] - 8);
    }
    cx.fillStyle = "#556070"; cx.font = "13px Arial"; cx.textAlign = "center";
    cx.fillText(k.replace("_", " "), b[0] + b[2] / 2, b[1] - 10);

    // Who is standing there. A light shows the opening; the mask shows it
    // too, because the mask is what answers it.
    if (lit[k] || g.maskOn) {
      for (const a of g.visitors()) {
        if (a.opening !== k || !a.atOpening() || a.resolved) continue;
        const x = b[0] + b[2] / 2, y = b[1] + b[3] / 2;
        const u = IMG["unit:" + a.key];
        if (u && u.complete && u.naturalWidth) {
          const h = b[3] * 0.86;
          const w = h * (u.naturalWidth / u.naturalHeight);
          cx.drawImage(u, x - w / 2, y - h / 2, w, h);
        } else {
          cx.fillStyle = "rgba(233,69,96,0.85)";
          cx.beginPath(); cx.ellipse(x, y, 34, 54, 0, 0, Math.PI * 2); cx.fill();
        }
        const left = Math.max(0, 1 - a.officeTimer / g.openingGrace());
        cx.fillStyle = "#141620"; cx.fillRect(b[0] + 16, b[1] + b[3] - 18, b[2] - 32, 6);
        cx.fillStyle = left < 0.35 ? "#E94560" : "#5A6A8A";
        cx.fillRect(b[0] + 16, b[1] + b[3] - 18, (b[2] - 32) * left, 6);
        cx.fillStyle = "#FFD700"; cx.font = "12px Arial";
        cx.fillText(a.name, x, b[1] + b[3] + 20);
      }
    }
    // Foxy in the hall is a stage, not a path.
    if (k === "HALL" && g.witheredFoxy.stages >= 3) {
      const x = b[0] + b[2] / 2, y = b[1] + b[3] / 2;
      const fu = IMG["unit:witheredfoxy"];
      if (fu && fu.complete && fu.naturalWidth) {
        const h = b[3] * 0.86;
        const w = h * (fu.naturalWidth / fu.naturalHeight);
        cx.drawImage(fu, x - w / 2, y - h / 2, w, h);
      } else {
        cx.fillStyle = "rgba(233,69,96,0.85)";
        cx.beginPath(); cx.ellipse(x, y, 34, 54, 0, 0, Math.PI * 2); cx.fill();
      }
      const left = Math.max(0, g.witheredFoxy.hallWindow / FOXY_HALL_WINDOW);
      cx.fillStyle = "#141620"; cx.fillRect(b[0] + 16, b[1] + b[3] - 18, b[2] - 32, 6);
      cx.fillStyle = left < 0.35 ? "#E94560" : "#5A6A8A";
      cx.fillRect(b[0] + 16, b[1] + b[3] - 18, (b[2] - 32) * left, 6);
      cx.fillStyle = "#FFD700"; cx.font = "12px Arial";
      cx.fillText("Withered Foxy", x, b[1] + b[3] + 20);
    }
  }
  // The mask, when it is up. It is a photograph of the mask, drawn over the
  // office -- which is what wearing it is.
  if (g.maskOn) {
    const mk = IMG.mask;
    if (mk && mk.complete && mk.naturalWidth) {
      cx.drawImage(mk, 0, 0, W, H);
    } else {
      cx.fillStyle = "rgba(2,3,10,0.55)"; cx.fillRect(0, 0, W, H);
    }
  }
}

function drawMonitor(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  for (let c = 1; c <= CAM_COUNT; c++) {
    const b = GRID[c];
    const here = c === g.currentCam;
    // The room itself, in the tile. It is a heavy downscale -- the phone
    // shows eleven cameras at once and the desktop shows one -- but it is
    // the room, and the alternative was a dark rectangle.
    const rm = IMG["room" + c];
    if (rm && rm.complete && rm.naturalWidth) {
      const sc = Math.max(b[2] / rm.naturalWidth, b[3] / rm.naturalHeight);
      const w = rm.naturalWidth * sc, h = rm.naturalHeight * sc;
      cx.save();
      cx.beginPath(); cx.rect(b[0], b[1], b[2], b[3]); cx.clip();
      cx.drawImage(rm, b[0] + (b[2] - w) / 2, b[1] + (b[3] - h) / 2, w, h);
      cx.restore();
      cx.fillStyle = "rgba(2,3,10,0.30)"; cx.fillRect(b[0], b[1], b[2], b[3]);
    } else {
      cx.fillStyle = "#070910"; cx.fillRect(b[0], b[1], b[2], b[3]);
    }
    cx.strokeStyle = here ? "#E94560" : "#1E2030";
    cx.lineWidth = here ? 3 : 2;
    cx.strokeRect(b[0], b[1], b[2], b[3]);
    cx.fillStyle = "#556070"; cx.font = "11px Arial"; cx.textAlign = "center";
    cx.fillText("CAM " + c, b[0] + b[2] / 2, b[1] + 16);
    if (c === MUSIC_BOX_CAM) {
      cx.fillStyle = "#FFD700"; cx.font = "11px Arial";
      cx.fillText("MUSIC BOX", b[0] + b[2] / 2, b[1] + 30);
      cx.fillStyle = "#141620"; cx.fillRect(b[0] + 12, b[1] + b[3] - 14, b[2] - 24, 5);
      cx.fillStyle = g.musicBox < MUSIC_BOX_MAX * 0.3 ? "#E94560" : "#5A6A8A";
      cx.fillRect(b[0] + 12, b[1] + b[3] - 14, (b[2] - 24) * (g.musicBox / MUSIC_BOX_MAX), 5);
    }
    // Who is on this camera. The monitor is the only place you can see them
    // coming, and looking at it is not looking at the openings.
    let n = 0;
    for (const a of g.cast()) {
      if (a.currentRoom() !== c) continue;
      if (a === g.witheredFoxy && a.stages >= 3) continue;
      n++;
      cx.fillStyle = "rgba(233,69,96,0.85)";
      cx.beginPath();
      cx.ellipse(b[0] + 30 + n * 34, b[1] + b[3] / 2 + 10, 14, 22, 0, 0, Math.PI * 2);
      cx.fill();
    }
  }
}

/** The face, filling the screen. The one frame the art is for. */
function drawScare(g) {
  const who = g.jumpscareBy;
  const key = who ? who.key : "toyfreddy";
  const im = IMG["scare:" + key] || IMG["scare:toyfreddy"];
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  if (im && im.complete && im.naturalWidth) {
    const s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * 1.08;
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    cx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
}

// --------------------------------------------------------------- the page

let g = null, raf = 0, last = 0, heard = "";

function start(night) {
  g = new Game(night, Date.now() & 0xffff);
  heard = "";
  document.getElementById("select").hidden = true;
  document.getElementById("band").hidden = false;
  document.getElementById("stage").hidden = false;
  document.getElementById("readout").hidden = false;
  document.getElementById("strip").hidden = false;
  document.getElementById("over").hidden = true;
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (g) { g.update(dt); cues(); paint(); }
  raf = requestAnimationFrame(loop);
}

function cues() {
  for (const c of g.drain()) {
    sfx(c);
    if (c === "at_door") heard = "SOMETHING IS AT AN OPENING <small>&mdash; the mask answers it, and the mask costs you the box</small>";
    else if (c === "door_close") heard = "IT WENT AWAY";
    else if (c === "music_box") heard = "THE BOX IS EMPTY <small>&mdash; the Puppet is coming and nothing stops it</small>";
    else if (c === "power_down") heard = "THE LIGHTS ARE GONE <small>&mdash; Balloon Boy took them</small>";
  }
}

function paint() {
  const st = g.status;
  if (st === "JUMPSCARED") drawScare(g);
  else if (g.cameraUp) drawMonitor(g);
  else drawOffice(g);

  document.getElementById("night").textContent = "NIGHT " + g.night;
  document.getElementById("clock").textContent = g.clock();
  const mb = document.getElementById("mb");
  mb.firstElementChild.style.width = Math.round((g.musicBox / MUSIC_BOX_MAX) * 100) + "%";
  mb.className = "meter" + (g.musicBox < MUSIC_BOX_MAX * 0.3 ? " low" : "");

  let line = heard;
  if (g.puppetComing) {
    line = "THE PUPPET <small>&mdash; " + (PUPPET_GRACE - g.puppetTimer).toFixed(1) + "s</small>";
  } else if (g.maskOn) {
    line = "MASK ON <small>&mdash; nothing can see you, and you cannot see anything</small>";
  } else if (g.cameraUp) {
    line = "CAM " + g.currentCam + (g.someoneAtTheOffice() ? " <small>&mdash; SOMETHING IS AT AN OPENING</small>" : "")
      + (g.currentCam === MUSIC_BOX_CAM && g.winding ? " <small>&mdash; winding</small>" : "");
  } else if (g.lightsDisabled) {
    line = "THE LIGHTS ARE GONE";
  } else if (g.hallLightOn || g.ventLLightOn || g.ventRLightOn) {
    line = "ONE LIGHT AT A TIME <small>&mdash; looking at one opening is not looking at the other two</small>";
  }
  document.getElementById("readout").innerHTML = line;

  const on = st === "PLAYING";
  document.getElementById("mon").disabled = !on || g.maskOn;
  document.getElementById("mon").textContent = g.cameraUp ? "MONITOR DOWN" : "MONITOR UP";
  document.getElementById("mon").className = g.cameraUp ? "wide on" : "wide";
  document.getElementById("hl").disabled = !on || g.lightsBlocked();
  document.getElementById("vl").disabled = !on || g.lightsBlocked();
  document.getElementById("vr").disabled = !on || g.lightsBlocked();
  document.getElementById("hl").className = g.hallLightOn ? "on" : "";
  document.getElementById("vl").className = g.ventLLightOn ? "on" : "";
  document.getElementById("vr").className = g.ventRLightOn ? "on" : "";
  document.getElementById("mask").disabled = !on;
  document.getElementById("mask").className = g.maskOn ? "on" : "";
  document.getElementById("wind").disabled = !on || !g.cameraUp || g.currentCam !== MUSIC_BOX_CAM;
  document.getElementById("wind").className = g.winding ? "on" : "";
  document.getElementById("cam11").disabled = !on || g.maskOn;
  document.getElementById("cam11").className = g.currentCam === MUSIC_BOX_CAM ? "on" : "";

  if (st !== "PLAYING" && document.getElementById("over").hidden) {
    document.getElementById("over").hidden = false;
    document.getElementById("overtitle").textContent = st === "SURVIVED" ? "6 AM" : "IT GOT IN";
    document.getElementById("overtext").textContent =
      st === "SURVIVED" ? "Nothing was at an opening at six."
                        : g.jumpscareBy.name + " was at an opening and nothing answered it.";
  }
}

cv.onclick = (e) => {
  if (!g || !g.cameraUp) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  for (let c = 1; c <= CAM_COUNT; c++) {
    const b = GRID[c];
    if (x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3]) { g.setCam(c); return; }
  }
};

document.getElementById("mon").onclick = () => g && g.toggleCamera();
document.getElementById("hl").onclick = () => g && g.toggleHallLight();
document.getElementById("vl").onclick = () => g && g.toggleVentLLight();
document.getElementById("vr").onclick = () => g && g.toggleVentRLight();
document.getElementById("mask").onclick = () => g && g.toggleMask();
document.getElementById("cam11").onclick = () => g && g.setCam(MUSIC_BOX_CAM);
// Holding the button is holding W. A tap winds for as long as it is held.
const wb = document.getElementById("wind");
const windOn = (e) => { e.preventDefault(); if (g) g.setWinding(true); };
const windOff = () => { if (g) g.setWinding(false); };
wb.addEventListener("pointerdown", windOn);
wb.addEventListener("pointerup", windOff);
wb.addEventListener("pointercancel", windOff);
wb.addEventListener("pointerleave", windOff);
document.getElementById("again").onclick = () => { const n = g.night; start(n); };

(function build() {
  const sel = document.getElementById("select");
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.className = "nightrow";
    b.innerHTML = '<span class="t">Night ' + n + "</span>"
      + '<span class="n">' + C.notes[n - 1] + "</span>";
    b.onclick = () => start(n);
    sel.appendChild(b);
  }
  document.getElementById("help").textContent = C.help;
})();
</script>
