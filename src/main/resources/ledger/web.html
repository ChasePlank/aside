<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A11">
<title>ledger</title>
<style>
  :root{
    --bg:#0A0A11; --ink:#E8E8EF; --dim:#9A9AAE; --faint:#6E6E86;
    --gold:#F2C14E; --edge:#22222E; --card:#14141C;
    --red:#E94560; --green:#7FD1AE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink)}
  body{
    font:17px/1.55 Georgia,'Times New Roman',serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:620px; margin:0 auto; padding:22px 18px 24px}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font-size:26px; font-weight:normal; color:var(--gold); margin:0; letter-spacing:.01em}
  .where{font:12px/1.4 Consolas,Menlo,monospace; color:var(--faint)}
  .label{font:11px/1.4 Arial,Helvetica,sans-serif; letter-spacing:.14em; color:var(--faint);
         margin:28px 0 10px}
  .nighthead{font:12px/1.5 Arial,Helvetica,sans-serif; letter-spacing:.14em; color:var(--faint);
             margin:26px 0 4px}
  .nighttitle{font-size:21px; color:var(--gold); margin:0 0 12px}
  .scene{font-size:17px; color:var(--dim); margin:0}
  .det{border:1px solid transparent; border-radius:10px; padding:11px 13px; margin:0 0 7px;
       background:var(--card); cursor:pointer; color:var(--dim); font-size:17px}
  .det.sel{background:#1E1E2A; border-color:#3E3E54; box-shadow:inset 3px 0 0 var(--gold)}
  .det.held{color:var(--ink)}
  .det .mark{color:var(--gold); font:13px/1.6 Consolas,Menlo,monospace; margin-right:8px}
  .det .mark.off{color:var(--faint)}
  .q{font-size:20px; margin:0 0 12px}
  .note{font:13px/1.6 Arial,Helvetica,sans-serif; color:var(--faint); margin:14px 0 0}
  .opt{border:1px solid transparent; border-radius:10px; padding:11px 13px; margin:0 0 7px;
       background:var(--card); cursor:pointer; color:var(--dim); font-size:16px}
  .opt.sel{background:#1E1E2A; border-color:#3E3E54; box-shadow:inset 3px 0 0 var(--gold); color:var(--ink)}
  .opt.none{font-style:italic; color:var(--faint)}
  .head{font-size:22px; margin:26px 0 12px}
  .head.good{color:var(--green)} .head.bad{color:var(--red)}
  .said{color:var(--dim); font-size:16px; margin:0 0 14px}
  .expl{font-size:17px; margin:0}
  .count{font-size:17px; color:var(--dim); margin:0 0 14px}
  .closing{font-size:17px; color:var(--dim); margin:0}
  .list{margin:0}
  .list .row{display:flex; gap:9px; padding:5px 0; border-bottom:1px solid #17171F; font-size:15px}
  .list .row:last-child{border-bottom:0}
  .list .row .mk{color:var(--gold); font:12px/1.7 Consolas,Menlo,monospace}
  .list .row .tx{color:var(--dim)}
  .list.gone .row .mk{color:var(--faint)}
  .list.gone .row .tx{color:var(--faint)}
  /* The ledger is the game, so it stays on screen while the hotel keeps
     offering more. On the desktop that is a second column; here it is a fixed
     strip under the thumb, which is the same idea in one dimension. */
  .bar{position:fixed; left:0; right:0; bottom:0; background:#0A0A11f2;
       border-top:1px solid var(--edge); padding:9px 18px calc(9px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:620px; margin:0 auto}
  .led{font:12px/1.6 Consolas,Menlo,monospace; color:var(--dim); margin:0 0 8px}
  .led .h{color:var(--faint); letter-spacing:.1em}
  .led .l{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .led .l .mk{color:var(--gold)}
  .led .l.old .mk{color:var(--red)}
  .led .l.old{color:#D9A0A0}
  .led .cost{color:var(--red); font-size:11px}
  .led .none{color:var(--faint)}
  .btns{display:flex; gap:9px}
  button{flex:1; font:16px/1.2 Georgia,serif; padding:14px 10px; border-radius:10px;
         background:var(--card); color:var(--ink); border:1px solid var(--edge); cursor:pointer}
  button.go{background:var(--gold); color:#171410; border-color:var(--gold)}
  button.ghost{background:transparent; color:var(--faint); border-color:transparent;
               flex:0 0 auto; padding-left:8px; padding-right:8px}
  .warn{font:13px/1.6 Arial,Helvetica,sans-serif; color:var(--red); margin:16px 0 0}
  .spacer{height:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>
<script>
const C = /*__CONTENT__*/;

// ---------------------------------------------------------------- the clerk
// A port of aside.games.ledger.Ledger. The content above is generated from the
// Java model, so the writing cannot drift; this logic is the same rules written
// a second time in a language a phone can run.

const KEY = 'aside.ledger.clerk';

const detailById = id => {
  for (const n of C.nights) for (const d of n.details) if (d.id === id) return d;
  return null;
};
const words = id => { const d = detailById(id); return d ? d.text : id; };
const int = (s, d) => { const n = parseInt(s, 10); return isNaN(n) ? d : n; };

function fresh() { return { night: 0, reck: 0, correct: 0, finished: false, seen: [], lines: [] }; }

const holds = (l, id) => l.lines.indexOf(id) >= 0;
function record(l, id) {
  if (!id || holds(l, id)) return;
  if (l.lines.length >= C.capacity) l.lines.shift();
  l.lines.push(id);
}
function erase(l, id) { const i = l.lines.indexOf(id); if (i >= 0) l.lines.splice(i, 1); }
function toggle(l, id) { if (holds(l, id)) erase(l, id); else record(l, id); }
const nextOut = l => l.lines.length >= C.capacity ? l.lines[0] : null;
const currentNight = l => l.night < C.nights.length ? C.nights[l.night] : null;
const reckoning = l => l.reck < C.reckonings.length ? C.reckonings[l.reck] : null;

function reckoningDue(l) {
  for (let i = 0; i < C.reckoningAfter.length; i++) {
    if (C.reckoningAfter[i] === l.night && i === l.reck) return true;
  }
  return false;
}

function closeNight(l) {
  const n = currentNight(l);
  if (n) for (const d of n.details) if (l.seen.indexOf(d.id) < 0) l.seen.push(d.id);
}
function advanceNight(l) { l.night++; if (l.night >= C.nights.length) l.finished = true; }

function answer(l, lineId) {
  const r = reckoning(l);
  if (!r) return false;
  const ok = r.answerId === lineId;
  if (ok) l.correct++;
  l.reck++;
  return ok;
}

const lost = l => l.seen.filter(id => l.lines.indexOf(id) < 0);

// ------------------------------------------------------------- the save file
// Ledger.serialize() writes a small plain-text ledger and Ledger.deserialize()
// reads it. This is that exact format, kept in localStorage, so a clerk can be
// carried between the desktop and the phone by copying a few lines of text.

function serialize(l) {
  let s = '# ledger v1\n';
  s += 'night\t' + l.night + '\n';
  s += 'reck\t' + l.reck + '\n';
  s += 'correct\t' + l.correct + '\n';
  s += 'finished\t' + (l.finished ? 1 : 0) + '\n';
  for (const id of l.seen) s += 'seen\t' + id + '\n';
  for (const id of l.lines) s += 'line\t' + id + '\n';
  return s;
}

function deserialize(text) {
  const l = fresh();
  for (const raw of String(text).split(/\r?\n/)) {
    if (!raw || raw.charAt(0) === '#') continue;
    const p = raw.split('\t');
    if (p[0] === 'night') l.night = int(p[1], 0);
    else if (p[0] === 'reck') l.reck = int(p[1], 0);
    else if (p[0] === 'correct') l.correct = int(p[1], 0);
    else if (p[0] === 'finished') l.finished = int(p[1], 0) === 1;
    else if (p[0] === 'seen') { if (detailById(p[1])) l.seen.push(p[1]); }
    else if (p[0] === 'line') { if (detailById(p[1])) l.lines.push(p[1]); }
  }
  if (l.night > C.nights.length) l.night = C.nights.length;
  if (l.reck > C.reckonings.length) l.reck = C.reckonings.length;
  return l;
}

const CAN_STORE = (() => {
  try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); return true; }
  catch (e) { return false; }
})();

function load() {
  if (!CAN_STORE) return fresh();
  let text = null;
  try { text = localStorage.getItem(KEY); } catch (e) { text = null; }
  return text === null ? fresh() : deserialize(text);
}

function save(l) {
  if (!CAN_STORE) return false;
  try { localStorage.setItem(KEY, serialize(l)); return true; } catch (e) { return false; }
}

// ---------------------------------------------------------------- the screen

let L = load();
let phase = L.finished ? 'end' : 'night';
let sel = 0;
let lastCorrect = false;
let lastAnswer = null;
let kept = true;

const app = document.getElementById('app');
const bar = document.getElementById('bar');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function header() {
  const where = L.finished ? 'closed'
    : 'night ' + Math.min(L.night + 1, C.nights.length) + ' of ' + C.nights.length;
  return '<header><h1>ledger</h1><div class="where">' + where + '</div></header>';
}

/** The ledger strip. It is on every screen that has a ledger. */
function ledgerStrip() {
  let h = '<div class="led"><span class="h">THE LEDGER</span> '
        + L.lines.length + ' of ' + C.capacity;
  if (L.lines.length === 0) {
    h += '<div class="l none">' + esc(C.voice.nothing) + '</div>';
  } else {
    const out = nextOut(L);
    for (const id of L.lines) {
      h += '<div class="l' + (id === out ? ' old' : '') + '">'
         + '<span class="mk">\u2713</span> ' + esc(words(id)) + '</div>';
    }
    if (out) h += '<div class="cost">' + esc(C.costWarning[out]) + '</div>';
  }
  return h + '</div>';
}

function drawNight() {
  const n = currentNight(L);
  if (!n) { phase = 'end'; draw(); return; }
  let h = header()
    + '<div class="nighthead">' + esc(n.heading.toUpperCase()) + '</div>'
    + '<div class="nighttitle">' + esc(n.title) + '</div>'
    + '<p class="scene">' + esc(n.scene) + '</p>'
    + '<div class="label">YOU COULD WRITE DOWN</div>';
  n.details.forEach((d, i) => {
    const held = holds(L, d.id);
    h += '<div class="det' + (i === sel ? ' sel' : '') + (held ? ' held' : '') + '" data-i="' + i + '">'
       + '<span class="mark' + (held ? '' : ' off') + '">' + (held ? '\u2713' : '\u00b7') + '</span>'
       + esc(d.text) + '</div>';
  });
  h += '<div class="spacer"></div>';
  if (!CAN_STORE) h += '<p class="warn">This browser will not keep the ledger. '
    + 'It will be gone when you close the page.</p>';
  app.innerHTML = h;
  app.querySelectorAll('.det').forEach(el => {
    el.onclick = () => { sel = +el.dataset.i; draw(); };
  });
  bar.innerHTML = '<div class="inner">' + ledgerStrip()
    + '<div class="btns"><button class="go" id="n">End the night</button></div></div>';
  document.getElementById('n').onclick = () => {
    closeNight(L);
    kept = save(L);
    if (reckoningDue(L)) { phase = 'reckoning'; sel = 0; }
    else { advanceNight(L); phase = L.finished ? 'end' : 'night'; sel = 0; }
    draw();
  };
}

function drawReckoning() {
  const r = reckoning(L);
  if (!r) { phase = 'end'; draw(); return; }
  let h = header()
    + '<div class="label">THE INSPECTOR</div>'
    + '<p class="q">' + esc(r.question) + '</p>'
    + '<p class="note">' + esc(C.voice.inspectorNote) + '</p>'
    + '<div class="label">ANSWER FROM THE LEDGER</div>';
  L.lines.forEach((id, i) => {
    h += '<div class="opt' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">'
       + esc(words(id)) + '</div>';
  });
  const noneIdx = L.lines.length;
  h += '<div class="opt none' + (sel === noneIdx ? ' sel' : '') + '" data-i="' + noneIdx + '">'
     + esc(C.voice.iDoNotKnow) + '</div>';
  h += '<div class="spacer"></div>';
  app.innerHTML = h;
  app.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => { sel = +el.dataset.i; draw(); };
  });
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="a">Answer</button></div></div>';
  document.getElementById('a').onclick = () => {
    lastAnswer = sel >= L.lines.length ? null : L.lines[sel];
    lastCorrect = answer(L, lastAnswer);
    kept = save(L);
    phase = 'verdict';
    draw();
  };
}

function drawVerdict() {
  const r = C.reckonings[L.reck - 1];
  let h = header()
    + '<div class="head ' + (lastCorrect ? 'good' : 'bad') + '">'
    + esc(lastCorrect ? C.voice.hadIt : C.voice.didNotHaveIt) + '</div>';
  if (!lastCorrect) {
    h += '<p class="said">' + esc(lastAnswer === null ? C.answered['__none'] : C.answered[lastAnswer]) + '</p>';
  }
  if (r) h += '<p class="expl">' + esc(r.explanation) + '</p>';
  h += '<div class="spacer"></div>';
  if (!kept) h += '<p class="warn">The ledger could not be written down, so it will not be '
    + 'here next time. Everything above is still true.</p>';
  app.innerHTML = h;
  bar.innerHTML = '<div class="inner">' + ledgerStrip()
    + '<div class="btns"><button class="go" id="n">The next night</button></div></div>';
  document.getElementById('n').onclick = () => {
    advanceNight(L);
    kept = save(L);
    phase = L.finished ? 'end' : 'night';
    sel = 0;
    draw();
  };
}

function drawEnd() {
  let h = header()
    + '<div class="head">' + esc(C.voice.closes) + '</div>'
    + '<p class="count">' + esc(C.answeredCount[L.correct]) + '</p>'
    + '<p class="closing">' + esc(C.endNotes[L.correct]) + '</p>'
    + '<div class="label">STILL IN THE LEDGER</div><div class="list">';
  if (L.lines.length === 0) {
    h += '<div class="row"><span class="mk">\u00b7</span><span class="tx">'
       + esc(C.voice.nothing) + '</span></div>';
  } else {
    for (const id of L.lines) {
      h += '<div class="row"><span class="mk">\u2713</span><span class="tx">' + esc(words(id)) + '</span></div>';
    }
  }
  h += '</div><div class="label">EVERYTHING YOU LET GO</div><div class="list gone">';
  const gone = lost(L);
  if (gone.length === 0) {
    h += '<div class="row"><span class="mk">\u00b7</span><span class="tx">'
       + esc(C.voice.nothing) + '</span></div>';
  } else {
    for (const id of gone) {
      h += '<div class="row"><span class="mk">\u00b7</span><span class="tx">' + esc(words(id)) + '</span></div>';
    }
  }
  h += '</div><div class="spacer"></div>';
  app.innerHTML = h;
  // One button. The finished ledger is kept until the player says otherwise,
  // the way the desktop keeps it until R -- and leaving is the shelf's job,
  // not this game's, so there is nothing for a second button to do.
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="r">Start again</button></div></div>';
  document.getElementById('r').onclick = () => {
    L = fresh();
    kept = save(L);
    phase = 'night';
    sel = 0;
    draw();
  };
}

function draw() {
  if (phase === 'night') drawNight();
  else if (phase === 'reckoning') drawReckoning();
  else if (phase === 'verdict') drawVerdict();
  else drawEnd();
  // The bar is fixed, so the content needs exactly its height of clearance and
  // no more. A fixed band was 210px, which is right for a full ledger and a
  // hundred pixels of dead air for an empty one.
  const sp = app.querySelector('.spacer');
  if (sp) sp.style.height = (bar.offsetHeight + 16) + 'px';
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  const k = e.key;
  const rows = phase === 'night' ? (currentNight(L) ? currentNight(L).details.length : 0)
             : phase === 'reckoning' ? L.lines.length + 1 : 0;
  if (rows > 0) {
    if (k === 'ArrowDown') { sel = (sel + 1) % rows; draw(); }
    else if (k === 'ArrowUp') { sel = (sel - 1 + rows) % rows; draw(); }
    else if (k >= '1' && k <= '9') { const i = +k - 1; if (i < rows) { sel = i; draw(); } }
  }
  if (k === 'Enter') {
    const b = bar.querySelector('button.go') || bar.querySelector('button');
    if (b) b.click();
  }
});

draw();
</script>
</body>
</html>
