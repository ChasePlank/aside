<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07070B">
<title>handoff</title>
<style>
  :root{
    --bg:#07070B; --ink:#E8E8EF; --dim:#B9B9C6; --faint:#6E6E86;
    --gold:#F2C14E; --edge:#22222E; --card:#12121A;
    --red:#C86B5A; --green:#7FD1AE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink)}
  body{
    font:17px/1.55 Georgia,'Times New Roman',serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:620px; margin:0 auto; padding:22px 18px 24px}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font-size:26px; font-weight:normal; color:var(--gold); margin:0; letter-spacing:.01em}
  .sub{font:12px/1.4 Consolas,Menlo,monospace; color:var(--faint)}
  .label{font:11px/1.4 Arial,Helvetica,sans-serif; letter-spacing:.14em; color:var(--faint);
         margin:26px 0 10px}
  .watchhead{font:12px/1.5 Arial,Helvetica,sans-serif; letter-spacing:.14em; color:var(--faint);
             margin:26px 0 4px}
  .watchtitle{font-size:21px; color:var(--gold); margin:0 0 12px}
  .scene{font-size:17px; color:var(--dim); margin:0 0 4px}
  .para{font-size:17px; color:var(--dim); margin:0 0 16px}
  .seen{margin:0; padding:0; list-style:none}
  .seen li{color:var(--dim); font-size:16px; padding:3px 0}
  .seen li .mk{color:var(--faint); margin-right:8px}
  .note{font:11px/1.5 Arial,Helvetica,sans-serif; color:var(--faint); margin:8px 0 0}
  /* The orders are a panel and not prose, on the desktop and here, because the
     whole game is a written thing sitting next to a situation that has moved.
     The panel does not change across the five watches. Only the night does. */
  .panel{background:var(--card); border:1px solid var(--edge); border-radius:12px;
         padding:14px 16px; margin:0}
  .panel .ph{font:12px/1.4 Consolas,Menlo,monospace; color:var(--gold); margin:0 0 10px}
  .order{border-left:3px solid transparent; padding:8px 10px; margin:0 0 6px;
         font-size:15px; color:#8E8EA2; border-radius:0 8px 8px 0}
  .order.on{background:#1C1A12; border-left-color:var(--gold); color:var(--gold)}
  .order .applies{display:block; font:11px/1.5 Arial,Helvetica,sans-serif;
                  color:#F2C14Ecc; margin-top:5px}
  .opt{border:1px solid transparent; border-radius:10px; padding:11px 13px; margin:0 0 7px;
       background:var(--card); cursor:pointer; color:var(--dim); font-size:17px}
  .opt.sel{background:#1E1E2A; border-color:#3E3E54; box-shadow:inset 3px 0 0 var(--gold)}
  .opt .mark{color:var(--gold); font:13px/1.6 Consolas,Menlo,monospace; margin-right:8px}
  /* nowrap, or "as written" breaks across two lines on a 360px phone and the
     second half lands outside the card it belongs to. */
  .opt .tag{font:11px/1.5 Arial,Helvetica,sans-serif; color:var(--faint); margin-left:8px;
            white-space:nowrap}
  .opt.sel .tag{color:#F2C14Eaa}
  .head{font-size:22px; margin:26px 0 12px}
  .head.good{color:var(--green)} .head.bad{color:var(--red)}
  .said{color:var(--faint); font-size:16px; margin:0 0 14px}
  .line{border:1px solid var(--edge); border-radius:10px; padding:11px 13px; margin:0 0 8px;
        background:var(--card); font-size:15px; color:var(--dim); cursor:pointer}
  .line.held{background:#1C1A12; border-color:#4A3F1C; color:var(--gold)}
  .line .origin{display:block; font:11px/1.5 Arial,Helvetica,sans-serif;
                color:var(--faint); margin-top:6px}
  .line .heldmk{display:block; font:11px/1.5 Arial,Helvetica,sans-serif;
                color:var(--gold); margin-top:6px}
  .slot{border:1px dashed var(--edge); border-radius:10px; padding:11px 13px; margin:0 0 8px;
        background:#0C0C12}
  .slot.filled{border-style:solid; border-color:#4A3F1C; background:#1C1A12}
  .slot .sn{font:11px/1.5 Arial,Helvetica,sans-serif; color:var(--faint); display:block;
            margin-bottom:5px}
  .slot .sx{font-size:15px; color:var(--gold)}
  .slot .sx.empty{color:#6E6E86}
  .ev{margin:0 0 14px; font-size:16px; color:var(--dim)}
  .ev.good{color:var(--ink)} .ev.bad{color:var(--red)} .ev.unmet{color:#8E8EA2}
  .ev .mk{font:13px/1.6 Consolas,Menlo,monospace; margin-right:7px}
  .ev .by{display:block; font:11px/1.5 Arial,Helvetica,sans-serif; color:var(--faint);
          margin-top:5px}
  .verdict{font-size:17px; color:var(--dim); margin:18px 0 0}
  .verdict.warn{color:var(--red)}
  .closing{font-size:17px; color:var(--ink); margin:14px 0 0}
  .goldline{font-size:15px; color:var(--gold); margin:22px 0 0}
  .warn{font:13px/1.6 Arial,Helvetica,sans-serif; color:var(--red); margin:16px 0 0}
  .bar{position:fixed; left:0; right:0; bottom:0; background:#07070Bf2;
       border-top:1px solid var(--edge); padding:9px 18px calc(9px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:620px; margin:0 auto}
  .bar .hint{font:11px/1.5 Arial,Helvetica,sans-serif; color:var(--faint); margin:0 0 8px}
  .btns{display:flex; gap:9px}
  button{flex:1; font:16px/1.2 Georgia,serif; padding:14px 10px; border-radius:10px;
         background:var(--card); color:var(--ink); border:1px solid var(--edge); cursor:pointer}
  button.go{background:var(--gold); color:#171410; border-color:var(--gold)}
  button:disabled{opacity:.4; cursor:default}
  .spacer{height:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>
<script>
const C = /*__CONTENT__*/
/*__AUDIO__*/

// Every tap is a click. The desktop distinguishes a move from a select --
// choice_move and choice_select -- and on a phone the distinction is not worth
// the bookkeeping: what the player needs to hear is that the tap landed,
// because this page is a canvas and nothing else moves.
document.addEventListener("pointerdown", () => voice("click"));
;

// --------------------------------------------------------------- the station
// A port of aside.games.handoff.Handoff. The content above is generated from
// the Java model, so the writing cannot drift.
//
// THE RULE THAT IS NOT HERE. What happens on the successor's night -- he reads
// the orders in the order you wrote them, takes the first line that applies to
// each part of the station, and does it -- is not written in this file. Every
// set of orders a player can leave was played out at build time and written
// into C.table: nine lines, three slots, ordered, 504 outcomes. This build
// looks the night up. It cannot disagree with the desktop, because there is
// nothing here to disagree with.

const KEY = 'aside.handoff.orders';
const N = C.lineIds.length;
const STRIDE = N * N;

const orderById = id => C.orders.filter(o => o.id === id)[0] || null;
const int = (s, d) => { const n = parseInt(s, 10); return isNaN(n) ? d : n; };

function fresh() {
  return { phase: 'WATCH', watch: 0, taken: [], unlocked: [], written: [], lastOption: -1 };
}

/** Bell's four, which is what you are keeping the watch under. */
const bell = () => C.orders.filter(o => o.bell);

/** The line of Bell's that applies to the current watch. */
function applying() {
  const w = C.watches[Math.min(S.watch, C.watches.length - 1)];
  for (const o of bell()) if (o.requires.every(r => w.signals.indexOf(r) >= 0)) return o;
  return null;
}

/** Everything you may write, Bell's first, then what you earned. */
function pool() { return bell().concat(S.unlocked.map(orderById).filter(Boolean)); }

function choose(i) {
  if (S.phase !== 'WATCH') return;
  const w = C.watches[S.watch];
  if (i < 0 || i >= w.options.length) return;
  const opt = w.options[i];
  S.lastOption = i;
  S.taken.push(i);
  if (opt.unlock && S.unlocked.indexOf(opt.unlock) < 0) S.unlocked.push(opt.unlock);
  S.phase = 'OUTCOME';
}

function advance() {
  if (S.phase !== 'OUTCOME') return;
  S.lastOption = -1;
  if (S.watch + 1 < C.watches.length) { S.watch++; S.phase = 'WATCH'; }
  else S.phase = 'WRITING';
}

function write(id) {
  if (S.phase !== 'WRITING') return false;
  if (S.written.length >= C.ordersHeld) return false;
  if (S.written.indexOf(id) >= 0) return false;
  S.written.push(id);
  return true;
}

function unwrite() {
  if (S.phase !== 'WRITING' || S.written.length === 0) return;
  S.written.pop();
}

function seal() {
  if (S.phase !== 'WRITING' || S.written.length !== C.ordersHeld) return false;
  S.phase = 'SUCCESSION';
  return true;
}

// ------------------------------------------------------------- the night
// One lookup. See the note at the top of this block for why there is no rule
// here to go wrong.

function night() {
  const i = C.lineIds.indexOf(S.written[0]);
  const j = C.lineIds.indexOf(S.written[1]);
  const k = C.lineIds.indexOf(S.written[2]);
  if (i < 0 || j < 0 || k < 0) return null;
  const parts = C.table[i * STRIDE + j * N + k].split('|');
  const events = parts[3] ? parts[3].split(';').map(p => {
    const bits = p.split(',');
    const concern = bits[0], id = bits[1];
    if (id === '-') return { concern: concern, by: null, text: C.unmet[concern], good: false };
    const o = orderById(id);
    const act = C.acts[o.action];
    return { concern: concern, by: id, text: act.text, good: act.good };
  }) : [];
  return { good: int(parts[0], 0), closing: C.closings[int(parts[1], 0)],
           raised: int(parts[2], 0), events: events };
}

// ------------------------------------------------------------- the save file
// Handoff.toText() writes the orders as plain text and Handoff.load() reads
// them. This is that exact format, kept in localStorage, so a watch can be
// carried between the desktop and the phone by copying a few lines.

function serialize() {
  let s = 'phase ' + S.phase + '\n';
  s += 'watch ' + S.watch + '\n';
  for (let i = 0; i < S.taken.length; i++) s += 'took ' + i + ' ' + S.taken[i] + '\n';
  for (const id of S.unlocked) s += 'unlocked ' + id + '\n';
  for (const id of S.written) s += 'wrote ' + id + '\n';
  return s;
}

function deserialize(text) {
  const s = fresh();
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const p = line.split(/\s+/);
    try {
      if (p[0] === 'phase') { if (['WATCH','OUTCOME','WRITING','SUCCESSION','DONE'].indexOf(p[1]) >= 0) s.phase = p[1]; }
      else if (p[0] === 'watch') s.watch = Math.max(0, Math.min(C.watches.length - 1, int(p[1], 0)));
      else if (p[0] === 'took') {
        const idx = int(p[1], 0), opt = int(p[2], 0);
        while (s.taken.length <= idx) s.taken.push(0);
        s.taken[idx] = opt;
      }
      else if (p[0] === 'unlocked') {
        const o = orderById(p[1]);
        if (o && !o.bell && s.unlocked.indexOf(o.id) < 0) s.unlocked.push(o.id);
      }
      else if (p[0] === 'wrote') {
        const o = orderById(p[1]);
        if (o && s.written.indexOf(o.id) < 0 && s.written.length < C.ordersHeld) s.written.push(o.id);
      }
    } catch (e) { /* a corrupt record is skipped; the rest of the file still stands */ }
  }
  // An interrupted outcome beat goes back to the watch it belongs to.
  if (s.phase === 'OUTCOME') s.phase = 'WATCH';
  // A game that says it is writing but already holds three lines is really at
  // the night after you.
  if (s.phase === 'WRITING' && s.written.length >= C.ordersHeld) s.phase = 'SUCCESSION';
  return s;
}

const CAN_STORE = (() => {
  try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); return true; }
  catch (e) { return false; }
})();

function load() {
  if (!CAN_STORE) return fresh();
  let text = null;
  try { text = localStorage.getItem(KEY); } catch (e) { text = null; }
  return text === null ? fresh() : deserialize(text);
}

function save() {
  if (!CAN_STORE) return false;
  try { localStorage.setItem(KEY, serialize()); return true; } catch (e) { return false; }
}

// --------------------------------------------------------------- the screen

let S = load();
let sel = 0;
let revealed = false;   // on the succession beat: has his night been played out?
let kept = true;

const app = document.getElementById('app');
const bar = document.getElementById('bar');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const lowerFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';

function header() {
  const right = S.phase === 'WATCH' || S.phase === 'OUTCOME'
    ? (S.watch + 1) + ' of ' + C.watches.length
    : S.phase === 'WRITING' ? 'what you leave him'
    : S.phase === 'SUCCESSION' ? 'his first night' : 'the orders you left';
  return '<header><h1>' + esc(C.wordmark) + '</h1><div class="sub">' + esc(right) + '</div></header>';
}

/** Bell's four, fixed, with the one that applies to tonight marked. */
function ordersPanel() {
  const on = applying();
  let h = '<div class="panel"><div class="ph">' + esc(C.voice.theOrders) + '</div>'
        + '<div class="note" style="margin:0 0 10px">' + esc(C.voice.keptBefore) + '</div>';
  for (const o of bell()) {
    const live = on && on.id === o.id;
    h += '<div class="order' + (live ? ' on' : '') + '">' + esc(o.text)
       + (live ? '<span class="applies">' + esc(C.voice.appliesTonight) + '</span>' : '')
       + '</div>';
  }
  return h + '</div>';
}

function drawWatch() {
  const w = C.watches[S.watch];
  let h = header()
    + '<div class="watchhead">' + esc(w.heading.toUpperCase()) + '</div>'
    + '<div class="watchtitle">' + esc(w.title) + '</div>'
    + '<p class="scene">' + esc(w.scene) + '</p>'
    + '<div class="label">' + esc(C.voice.whatYouCanSee) + '</div><ul class="seen">';
  for (const s of w.signals) h += '<li><span class="mk">\u00b7</span>' + esc(C.signals[s]) + '</li>';
  h += '</ul>' + ordersPanel()
    + '<div class="label">' + esc(C.voice.whatYouDo) + '</div>';
  w.options.forEach((o, i) => {
    h += '<div class="opt' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">'
       + '<span class="mark">' + (i + 1) + '.</span>' + esc(o.text)
       + '<span class="tag">' + esc(C.voice.tags[o.kind]) + '</span></div>';
  });
  h += '<div class="spacer"></div>';
  if (!CAN_STORE) h += '<p class="warn">This browser will not keep the orders. '
    + 'They will be gone when you close the page.</p>';
  app.innerHTML = h;
  app.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => { sel = +el.dataset.i; draw(); };
  });
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="do">Do it</button></div></div>';
  document.getElementById('do').onclick = () => {
    choose(sel); sel = 0; kept = save(); draw();
  };
}

function drawOutcome() {
  const w = C.watches[S.watch];
  const opt = w.options[Math.max(0, S.lastOption)];
  let h = header()
    + '<div class="head">' + esc(w.heading) + ' \u2014 ' + esc(w.title) + '</div>'
    + '<p class="said">You ' + esc(lowerFirst(opt.text)) + '</p>'
    + '<p class="para">' + esc(opt.outcome) + '</p>';
  if (opt.unlock) {
    const o = orderById(opt.unlock);
    h += '<div class="panel"><div class="ph">' + esc(C.voice.youLearned) + '</div>'
       + '<div class="order on" style="margin:0">' + esc(o.text) + '</div></div>';
  } else if (opt.kind === 'FOLLOW') {
    h += '<p class="said">' + esc(C.voice.learnedNothingFollow) + '<br>'
       + esc(C.voice.learnedNothingFollow2) + '</p>';
  } else {
    h += '<p class="said">' + esc(C.voice.learnedNothingHold) + '</p>';
  }
  h += '<div class="spacer"></div>';
  app.innerHTML = h;
  const last = S.watch + 1 >= C.watches.length;
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="n">' + (last ? 'Write the orders' : 'On to the next watch')
    + '</button></div></div>';
  document.getElementById('n').onclick = () => { advance(); sel = 0; kept = save(); draw(); };
}

function drawWriting() {
  let h = header()
    + '<div class="head">' + esc(C.voice.writingHeading) + '</div>'
    + '<p class="para">' + esc(C.voice.writingIntro) + '</p>'
    + '<div class="label">' + esc(C.voice.whatYouLeave) + '</div>';
  for (let i = 0; i < C.ordersHeld; i++) {
    const id = S.written[i];
    h += '<div class="slot' + (id ? ' filled' : '') + '">'
       + '<span class="sn">' + esc(C.voice.lineLabel[i + 1]) + '</span>'
       + (id ? '<span class="sx">' + esc(orderById(id).text) + '</span>'
             : '<span class="sx empty">\u2014</span>') + '</div>';
  }
  h += '<div class="label">' + esc(C.voice.bellsFour) + '</div>';
  h += poolCards(bell());
  h += '<div class="label">' + esc(C.voice.whatYouLearned) + '</div>';
  if (S.unlocked.length === 0) {
    h += '<p class="said">' + esc(C.voice.learnedNothingEmpty) + '</p>';
  } else {
    h += poolCards(S.unlocked.map(orderById).filter(Boolean));
  }
  h += '<div class="spacer"></div>';
  if (!kept) h += '<p class="warn">The orders could not be written down, so they will '
    + 'not be here next time. Everything above is still true.</p>';
  app.innerHTML = h;
  app.querySelectorAll('.line').forEach(el => {
    el.onclick = () => { if (write(el.dataset.id)) { kept = save(); draw(); } };
  });
  const full = S.written.length >= C.ordersHeld;
  bar.innerHTML = '<div class="inner">'
    + '<div class="hint">' + esc(S.written.length + ' of ' + C.ordersHeld + ' written'
      + (full ? ' \u2014 he reads them in this order' : '')) + '</div>'
    + '<div class="btns">'
    + (S.written.length > 0 ? '<button id="back">Take one back</button>' : '')
    + '<button class="go" id="seal"' + (full ? '' : ' disabled') + '>Seal the orders</button>'
    + '</div></div>';
  const back = document.getElementById('back');
  if (back) back.onclick = () => { unwrite(); kept = save(); draw(); };
  document.getElementById('seal').onclick = () => {
    if (seal()) { revealed = false; kept = save(); draw(); }
  };
}

/** The lines you may write, with the ones already written marked. */
function poolCards(list) {
  let h = '';
  for (const o of list) {
    const held = S.written.indexOf(o.id) >= 0;
    h += '<div class="line' + (held ? ' held' : '') + '" data-id="' + esc(o.id) + '">'
       + esc(o.text)
       + (held ? '<span class="heldmk">' + esc(C.voice.written) + '</span>'
               : '<span class="origin">' + esc(o.origin) + '</span>')
       + '</div>';
  }
  return h;
}

function drawSuccession() {
  const sc = C.succession;
  let h = header()
    + '<div class="head">' + esc(sc.heading) + ' \u2014 ' + esc(sc.title) + '</div>'
    + '<p class="scene">' + esc(sc.scene) + '</p>'
    + '<div class="label">' + esc(C.voice.whatYouLeftHim) + '</div>'
    + '<div class="note" style="margin:0 0 10px">' + esc(C.voice.readInThisOrder) + '</div>';
  S.written.forEach((id, i) => {
    const o = orderById(id);
    h += '<div class="line' + (o.bell ? '' : ' held') + '">' + esc(o.text)
       + '<span class="origin">' + (i + 1) + '. ' + esc(o.origin) + '</span></div>';
  });

  // The reveal replaces the column rather than adding to it. What he could see
  // and what he did are the same beat, one moment apart.
  if (!revealed) {
    h += '<div class="label">' + esc(C.voice.whatHeCouldSee) + '</div><ul class="seen">';
    for (const s of sc.signals) h += '<li><span class="mk">\u00b7</span>' + esc(C.signals[s]) + '</li>';
    h += '</ul><div class="spacer"></div>';
    app.innerHTML = h;
    bar.innerHTML = '<div class="inner"><div class="btns">'
      + '<button class="go" id="r">Let his night happen</button></div></div>';
    document.getElementById('r').onclick = () => { revealed = true; draw(); };
    return;
  }

  const n = night();
  h += '<div class="label">' + esc(C.voice.whatHeDid) + '</div>';
  for (const ev of n.events) {
    const cls = ev.by === null ? 'unmet' : (ev.good ? 'good' : 'bad');
    const mk = ev.by === null ? '&nbsp;&nbsp;' : (ev.good ? '\u2713 ' : '\u2717 ');
    h += '<div class="ev ' + cls + '"><span class="mk">' + mk + '</span>' + esc(ev.text)
       + (ev.by === null ? '' : '<span class="by">' + esc(C.voice.becauseYouWrote + ev.by)
          + '</span>') + '</div>';
  }
  h += '<div class="spacer"></div>';
  app.innerHTML = h;
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="n">What your orders did</button></div></div>';
  document.getElementById('n').onclick = () => { S.phase = 'DONE'; kept = save(); draw(); };
}

function drawDone() {
  const n = night();
  let h = header() + '<div class="head">' + esc(C.voice.theOrdersYouLeft) + '</div>';
  S.written.forEach((id, i) => {
    const o = orderById(id);
    h += '<div class="line' + (o.bell ? '' : ' held') + '">' + esc(o.text)
       + '<span class="origin">' + (i + 1) + '. ' + esc(o.origin) + '</span></div>';
  });
  // The count is not a failure by itself. It only reads red when the night
  // raised something nothing answered.
  h += '<p class="verdict' + (n.good >= n.raised ? '' : ' warn') + '">'
     + esc(C.voice.verdict.replace('%good%', n.good).replace('%raised%', n.raised)) + '</p>'
     + '<p class="closing">' + esc(n.closing) + '</p>'
     + '<p class="goldline">' + esc(C.voice.standingOrder) + '</p>'
     + '<div class="spacer"></div>';
  app.innerHTML = h;
  bar.innerHTML = '<div class="inner"><div class="btns">'
    + '<button class="go" id="again">Keep the watch again</button></div></div>';
  document.getElementById('again').onclick = () => {
    S = fresh(); revealed = false; sel = 0; kept = save(); draw();
  };
}

function draw() {
  if (S.phase === 'WATCH') drawWatch();
  else if (S.phase === 'OUTCOME') drawOutcome();
  else if (S.phase === 'WRITING') drawWriting();
  else if (S.phase === 'SUCCESSION') drawSuccession();
  else drawDone();
  // The bar is fixed, so the content needs exactly its height of clearance and
  // no more. It is measured rather than guessed, the way the others are.
  const sp = app.querySelector('.spacer');
  if (sp) sp.style.height = (bar.offsetHeight + 16) + 'px';
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (S.phase === 'WATCH') {
    const n = C.watches[S.watch].options.length;
    if (k === 'ArrowDown') { sel = (sel + 1) % n; draw(); }
    else if (k === 'ArrowUp') { sel = (sel - 1 + n) % n; draw(); }
    else if (k >= '1' && k <= '9') { const i = +k - 1; if (i < n) { sel = i; draw(); } }
  }
  if (k === 'Enter') {
    const b = bar.querySelector('button.go') || bar.querySelector('button');
    if (b && !b.disabled) b.click();
  }
});

draw();
</script>
</body>
</html>
