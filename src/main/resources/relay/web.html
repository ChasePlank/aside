<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay</title>
<style>
  :root {
    --bg: #0B0C10;
    --ink: #E9E9F2;
    --dim: #9C9CB0;
    --faint: #6B6B82;
    --gold: #E8B44A;
    --bad: #E05A6B;
    --good: #6FCF97;
    --paper: #1A1B26;
    --edge: #2C2D3E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 0px) 0;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }
  h1 { font-family: Georgia, serif; font-size: 34px; color: var(--gold); margin: 18px 0 2px; font-weight: 400; }
  .sub { color: var(--faint); font-size: 12px; margin-bottom: 18px; }
  p { margin: 0 0 14px; }
  .scene { font-family: Georgia, serif; font-size: 17px; color: var(--ink); }
  .card { background: var(--paper); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .card h2 { font-size: 12px; letter-spacing: .08em; color: var(--faint); margin: 0 0 12px; font-weight: 600; }
  .rule { margin-bottom: 14px; }
  .rule .k { color: var(--gold); font-size: 14px; }
  .rule .t { color: var(--dim); font-size: 13px; }
  button {
    font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 13px 18px;
    background: var(--gold); color: #14141C; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--edge); font-weight: 400; }
  .who { font-family: Georgia, serif; font-size: 24px; color: var(--gold); margin: 6px 0 2px; }
  .sit { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--paper); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 12px; padding: 15px 16px; margin: 0 0 12px;
    font: 17px/1.45 Georgia, serif; font-weight: 400; cursor: pointer;
  }
  .opt:active { border-color: var(--gold); background: #232433; }
  .opt .mark { color: var(--gold); font-size: 12px; display: block; margin-bottom: 6px; font-family: -apple-system, sans-serif; letter-spacing: .08em; }
  .big { font-family: Georgia, serif; font-size: 26px; color: var(--gold); margin: 4px 0 10px; }
  .big.win { color: var(--good); }
  .stat { font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  .stat.bad { color: var(--bad); }
  .stat.good { color: var(--good); }
  .row { padding: 12px 0; border-bottom: 1px solid var(--edge); }
  .row .top { display: flex; gap: 10px; align-items: baseline; }
  .row .n { color: var(--faint); font-size: 12px; width: 18px; flex: 0 0 18px; }
  .row .who2 { color: var(--ink); font-size: 14px; flex: 1; }
  .row .w { font-size: 13px; }
  .row .w.both { color: var(--good); }
  .row .w.half { color: var(--gold); }
  .row .w.broke { color: var(--bad); }
  .row .lbl { color: var(--faint); font-size: 11px; letter-spacing: .07em; }
  .row .txt { color: var(--dim); font-size: 13px; }
  .row .txt.gone { color: var(--faint); }
  .closing { font-family: Georgia, serif; font-size: 16px; color: var(--ink); margin: 18px 0; }
  .note { color: var(--faint); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const C = /*__CONTENT__*/;

//__MODEL_BEGIN__
// The rule, ported. A message is worth the smaller of what it carries, not the
// total -- and the phone has to compute that itself, because the report depends
// on it. There is no deal here and no seed: the six messages are the six
// messages, so the whole model is the content and the two builds cannot diverge
// on anything but arithmetic. tools/relay-trace.mjs compares every message,
// every option, every count and every score line against the Java model.
function worth(m, o) {
  const opt = C.messages[m].options[o];
  return Math.min(opt.facts.length, opt.points.length);
}
function total(m, o) {
  const opt = C.messages[m].options[o];
  return opt.facts.length + opt.points.length;
}
function carried(m, o, which) {
  const msg = C.messages[m], opt = msg.options[o];
  return msg[which].filter(el => opt[which].indexOf(el.id) >= 0).map(el => el.label);
}
function kept(m, o) { return carried(m, o, 'facts').concat(carried(m, o, 'points')); }
function lost(m, o) {
  const msg = C.messages[m], opt = msg.options[o];
  return msg.facts.filter(el => opt.facts.indexOf(el.id) < 0).map(el => el.label)
    .concat(msg.points.filter(el => opt.points.indexOf(el.id) < 0).map(el => el.label));
}
function score() {
  let s = 0;
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] >= 0) s += worth(m, state.choices[m]);
  return s;
}
function breaks() {
  let n = 0;
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] >= 0 && worth(m, state.choices[m]) === 0) n++;
  return n;
}
function nextUnchosen() {
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] < 0) return m;
  return -1;
}
//__MODEL_END__

const KEY = 'aside.relay.night';
let state = { choices: [], reported: false };
let screen = 'open';
let at = 0;
let canStore = true;
try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); }
catch (e) { canStore = false; }

function fresh() {
  state.choices = new Array(C.messages.length).fill(-1);
  state.reported = false;
  at = 0;
}

// The desktop's own save format, so a night carried on one can be finished on
// the other. Same three lines, same shape.
function serialize() {
  return 'relay 1\nchoices ' + state.choices.map(c => (c < 0 ? '-' : c)).join(' ') + '\n'
    + 'reported ' + (state.reported ? 1 : 0) + '\n';
}

function deserialize(text) {
  const lines = String(text).split('\n');
  if (!lines.length || lines[0].trim().split(/\s+/)[0] !== 'relay') return false;
  for (const line of lines) {
    const p = line.trim().split(/\s+/);
    if (p[0] === 'choices') {
      for (let i = 0; i < C.messages.length && i + 1 < p.length; i++) {
        state.choices[i] = p[i + 1] === '-' ? -1 : Number(p[i + 1]);
      }
    } else if (p[0] === 'reported' && p.length > 1) {
      state.reported = p[1] === '1';
    }
  }
  return true;
}

function load() {
  if (!canStore) return false;
  let t = null;
  try { t = localStorage.getItem(KEY); } catch (e) { return false; }
  if (!t) return false;
  fresh();
  if (!deserialize(t)) return false;
  at = Math.max(0, nextUnchosen());
  return true;
}

function save() {
  if (!canStore) return false;
  try { localStorage.setItem(KEY, serialize()); return true; }
  catch (e) { return false; }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const app = document.getElementById('app');

function render() {
  if (screen === 'open') renderOpen();
  else if (screen === 'read') renderRead();
  else renderReport();
}

function renderOpen() {
  let h = '<h1>' + esc(C.openTitle) + '</h1><div class="sub">' + esc(C.openSub) + '</div>';
  for (const p of C.openSituation) h += '<p class="scene">' + esc(p) + '</p>';
  h += '<div class="card"><h2>' + esc(C.rulesHeading) + '</h2>';
  for (const r of C.rules) {
    h += '<div class="rule"><div class="k">' + esc(r.key) + '</div><div class="t">' + esc(r.text) + '</div></div>';
  }
  h += '</div><button id="go">' + esc(C.startButton) + '</button>';
  if (!canStore) h += '<div class="note">This browser will not keep the night. The report will be lost when you close the tab.</div>';
  app.innerHTML = h;
  document.getElementById('go').onclick = () => { screen = 'read'; render(); };
}

function renderRead() {
  const msg = C.messages[at];
  let h = '<h1>' + esc(C.wordmark) + '</h1><div class="sub">' + esc(C.progress[at]) + '</div>';
  h += '<div class="who">' + esc(msg.from) + ' ' + esc(C.arrow) + ' ' + esc(msg.to) + '</div>';
  h += '<div class="sit">' + esc(msg.situation) + '</div>';
  for (let o = 0; o < msg.options.length; o++) {
    h += '<button class="opt" data-o="' + o + '">' + esc(msg.options[o].text) + '</button>';
  }
  h += '<div class="note">' + esc(C.carryNote) + '</div>';
  app.innerHTML = h;
  for (const el of document.querySelectorAll('.opt')) {
    el.onclick = () => {
      state.choices[at] = Number(el.dataset.o);
      const n = nextUnchosen();
      if (n < 0) { state.reported = true; screen = 'report'; }
      else { at = n; }
      save();
      render();
    };
  }
}

function renderReport() {
  const s = score(), b = breaks();
  let h = '<h1>' + esc(C.wordmark) + '</h1><div class="sub">' + esc(C.reportHead) + '</div>';
  h += '<div class="big' + (s === C.max ? ' win' : '') + '">' + esc(C.worthLine[s]) + '</div>';
  h += '<div class="stat ' + (b === 0 ? 'good' : 'bad') + '">' + esc(C.breaksLine[b]) + '</div>';

  for (let m = 0; m < C.messages.length; m++) {
    const o = state.choices[m], w = worth(m, o), msg = C.messages[m];
    const word = C.worthWord[w];
    const gone = lost(m, o);
    h += '<div class="row">'
       + '<div class="top"><div class="n">' + (m + 1) + '</div>'
       + '<div class="who2">' + esc(msg.from) + ' ' + esc(C.arrow) + ' ' + esc(msg.to) + '</div>'
       + '<div class="w ' + esc(word) + '">' + esc(word) + '</div></div>'
       + '<div class="lbl">' + esc(C.keptHead) + '</div><div class="txt">' + esc(kept(m, o).join(' \u00b7 ')) + '</div>'
       + '<div class="lbl">' + esc(C.lostHead) + '</div><div class="txt gone">'
       + esc(gone.length ? gone.join(' \u00b7 ') : C.nothingLost) + '</div>'
       + '</div>';
  }

  h += '<div class="closing">' + esc(C.closing[s]) + '</div>';
  h += '<button id="again">' + esc(C.again) + '</button>';
  app.innerHTML = h;
  document.getElementById('again').onclick = () => {
    fresh();
    save();
    screen = 'open';
    render();
  };
}

if (load()) screen = state.reported ? 'report' : 'read';
else { fresh(); save(); screen = 'open'; }
render();
</script>
</body>
</html>
