<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Last Crossing</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

rate","text":"hanging over water doing nothing at all."},{"type":"jump","to":"jetty_two"}],"quiet":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"You let it ring. Three times, then a pause, then nothing."},{"type":"narrate","text":"Whoever it was has walked back up the lane, and you did not see their face, and you will not think about"},{"type":"narrate","text":"that until later, which is a thing you know about yourself."},{"type":"flag","name":"refused_once","delta":"true"},{"type":"jump","to":"jetty_two"}],"jetty_two":[{"type":"narrate","text":"The water goes past the way it always goes past, and you stand on your own jetty with the pole in your hand"},{"type":"narrate","text":"like a man holding a stick he has forgotten the reason for."},{"type":"choice","text":"Go home. It is nearly midnight and the bridge opens Monday.","to":"go_home"},{"type":"choice","text":"Take the pole out of its rest and put it back. Twice.","to":"fidgit","cond":"looked"},{"type":"choice","text":"Answer it, if it goes again.","to":"passenger_two","cond":"refused_once"}],"fidgit":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"You take the pole out of its rest and put it back, and then do it again, because the rest is worn"},{"type":"narrate","text":"and the pole has a place it likes, and after nineteen years a man is allowed a superstition"},{"type":"narrate","text":"or two about a piece of wood."},{"type":"jump","to":"jetty_two"}],"go_home":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"You go home. The jetty stays where it is, which is the arrangement you have had for nineteen years"},{"type":"narrate","text":"and which ends on Monday whether anyone winds it up or not."},{"type":"jump","to":"dawn_bridge"}],"passenger":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"A woman with a holdall and a coat that is not a coat for this weather."},{"type":"say","who":"ferry","text":"It is midnight."},{"type":"say","who":"passenger","text":"I know what time it is."},{"type":"say","who":"passenger","text":"I need the other side."},{"type":"say","who":"ferry","text":"There is a bridge. It opens Monday."},{"type":"say","who":"passenger","text":"It is not Monday."},{"type":"narrate","text":"She is right about that, which is the difficulty with most people who come down the lane at this hour."},{"type":"choice","text":"Pole her across.","to":"cross_now"},{"type":"choice","text":"Ask her what is on the other side.","to":"ask"},{"type":"choice","text":"Tell her to come back Monday.","to":"defer"}],"ask":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"passenger","text":"My sister. She is not well and she is not going to get better, and the bus"},{"type":"say","who":"passenger","text":"does not run the lane at night."},{"type":"say","who":"passenger","text":"You are the last person on this river who can do anything about that."},{"type":"flag","name":"asked","delta":"true"},{"type":"jump","to":"passenger_choice"}],"passenger_choice":[{"type":"narrate","text":"The holdall is heavy. She has not put it down, which tells you she expects to be told no."},{"type":"choice","text":"Pole her across.","to":"cross_now"},{"type":"choice","text":"Tell her to come back Monday.","to":"defer"}],"cross_now":[{"type":"bg","name":"far_bank"},{"type":"narrate","text":"You pole her across. It takes four minutes, which it has taken four minutes for nineteen years."},{"type":"narrate","text":"She steps off onto the far stones and does not thank you, and then does, and then goes,"},{"type":"narrate","text":"and the last thing you hear is the holdall knocking against the lane wall going up."},{"type":"narrate","text":"You pole back. The river is exactly as wide going back."},{"type":"jump","to":"far_bank"}],"far_bank":[{"type":"bg","name":"far_bank"},{"type":"narrate","text":"Nineteen years, and the thing you will remember is not the crossing."},{"type":"narrate","text":"It is that she did not put the holdall down until she was on the far stones,"},{"type":"narrate","text":"which is what being braced looks like when nobody has been kind to you for a while."}],"defer":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"ferry","text":"Come back Monday. The bridge will be open and it will cost you nothing."},{"type":"say","who":"passenger","text":"And tonight it costs you four minutes."},{"type":"narrate","text":"She goes back up the lane. You listen to the holdall the whole way, which is a long way."},{"type":"flag","name":"deferred_once","delta":"true"},{"type":"jump","to":"night_two"}],"night_two":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"The next night. Same bell, same water, and you are early because you told yourself you would be."},{"type":"narrate","text":"The bell goes at half eleven, which is earlier than last night, which means she has been walking"},{"type":"narrate","text":"around the lane for an hour deciding whether to come back."},{"type":"choice","text":"Answer it.","to":"passenger_two"},{"type":"choice","text":"Sit down on the jetty and wait for the bell to stop.","to":"wait_two"}],"wait_two":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"You sit on the planks. The bell goes three times and stops, and then goes once more, which is either"},{"type":"narrate","text":"her making sure or her giving up, and you will never know which, and that is the part you keep."},{"type":"flag","name":"deferred_twice","delta":"true"},{"type":"jump","to":"night_three"}],"passenger_two":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"ferry","text":"It is midnight again."},{"type":"say","who":"passenger","text":"It was always going to be midnight."},{"type":"say","who":"passenger","text":"Are you poling or are you standing?"},{"type":"choice","text":"Pole her across.","to":"cross_late"},{"type":"choice","text":"Say not tonight.","to":"not_tonight"}],"not_tonight":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"ferry","text":"Not tonight."},{"type":"say","who":"passenger","text":"Monday, then. And you will be on the jetty watching the bridge, and I will be on it,"},{"type":"say","who":"passenger","text":"and neither of us will say anything about tonight, because there will not be a tonight."},{"type":"flag","name":"deferred_twice","delta":"true"},{"type":"jump","to":"night_three"}],"cross_late":[{"type":"bg","name":"far_bank"},{"type":"narrate","text":"You pole her across. It takes four minutes and then the second four minutes coming back,"},{"type":"narrate","text":"and you are in bed by one, and nobody will ever know, and that is what makes it a job"},{"type":"narrate","text":"rather than a favour."},{"type":"flag","name":"crossed","delta":"true"},{"type":"jump","to":"dawn_river"}],"night_three":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"Sunday. The last night the jetty is anything."},{"type":"narrate","text":"She is already on the jetty when you get there, sitting on the planks with the holdall on her knees"},{"type":"narrate","text":"and a ticket in her coat pocket that says Monday, because the bridge does not need you to be brave,"},{"type":"narrate","text":"it only needs you to be patient."},{"type":"say","who":"ferry","text":"You have a ticket."},{"type":"say","who":"passenger","text":"It was cheaper than the fare a person would have charged me."},{"type":"say","who":"passenger","text":"I came down to give you the last night."},{"type":"choice","text":"Pole her across tonight.","to":"cross_final"},{"type":"choice","text":"Sit down beside her and do not pole anybody anywhere.","to":"sit_final"},{"type":"choice","text":"Tell her you heard the bell. Both times.","to":"confess","cond":"!deferred_once"},{"type":"choice","text":"Tell her you stood on the planks and let it ring.","to":"confess","cond":"deferred_twice"}],"confess":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"ferry","text":"I heard it. I stood on these planks and let it ring."},{"type":"say","who":"passenger","text":"I know. I watched you not answer it."},{"type":"say","who":"passenger","text":"That is why I got the ticket."},{"type":"flag","name":"confessed","delta":"true"},{"type":"jump","to":"night_three_choice"}],"night_three_choice":[{"type":"narrate","text":"The water goes past. She has put the holdall down on the planks, which is new."},{"type":"choice","text":"Pole her across.","to":"cross_final"},{"type":"choice","text":"Sit down beside her.","to":"sit_final"},{"type":"choice","text":"Ask her what she told her sister.","to":"sister","cond":"asked"}],"sister":[{"type":"bg","name":"river_jetty"},{"type":"say","who":"passenger","text":"I told her I had a way of getting there."},{"type":"say","who":"passenger","text":"I did not tell her that it was a man on a jetty at midnight who keeps saying not yet."},{"type":"say","who":"passenger","text":"She would have asked me what he was like, and I would have had to say kind,"},{"type":"say","who":"passenger","text":"and then she would have wanted to meet you, and you are not somebody anybody meets."},{"type":"jump","to":"night_three_choice"}],"sit_final":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"You sit down. The planks are cold and the river goes past and neither of you says much,"},{"type":"narrate","text":"and after a while she says the thing that you will end up telling whoever asks you about it."},{"type":"say","who":"passenger","text":"It was never the crossing."},{"type":"say","who":"passenger","text":"It was that there was a person down here at midnight with a pole."},{"type":"jump","to":"dawn_river"}],"cross_final":[{"type":"bg","name":"far_bank"},{"type":"narrate","text":"You pole her across on the last night. It takes four minutes. It takes four minutes every time."},{"type":"narrate","text":"She steps off onto the far stones and puts the holdall down and turns round, which is a thing"},{"type":"narrate","text":"she has not done any of the other nights."},{"type":"say","who":"passenger","text":"Thank you. I would have understood if you had not."},{"type":"say","who":"ferry","text":"I know."},{"type":"flag","name":"crossed","delta":"true"},{"type":"jump","to":"dawn_river"}],"dawn_river":[{"type":"bg","name":"dawn_river"},{"type":"narrate","text":"The morning comes the way mornings do: without ceremony and slightly early, and the crane has moved."},{"type":"narrate","text":"The bridge opens at nine. It is a good bridge. It will do the job for sixty years"},{"type":"narrate","text":"and nobody will ever be down here at midnight because of it."},{"type":"narrate","text":"You pole across once more with nothing to carry, because the jetty is yours until Monday"},{"type":"narrate","text":"and a man is allowed to finish the thing he started."},{"type":"choice","text":"Say it out loud.","to":"last_word","cond":"confessed"},{"type":"choice","text":"Say it out loud anyway.","to":"last_word","cond":"!confessed"},{"type":"choice","text":"Think about the four minutes.","to":"four_minutes","cond":"crossed"},{"type":"choice","text":"Let the water say it.","to":"END"}],"last_word":[{"type":"say","who":"ferry","text":"That is the last crossing."},{"type":"say","who":"ferry","text":"Somebody should say it out loud."}],"four_minutes":[{"type":"bg","name":"dawn_river"},{"type":"narrate","text":"Four minutes each way. It has taken four minutes for nineteen years and it will take four minutes"},{"type":"narrate","text":"exactly once more, with nothing to carry."},{"type":"narrate","text":"Nobody will ever ask you what you did on the last night the jetty was anything."},{"type":"narrate","text":"You will answer it anyway, in your own head, for years: I poled her across."},{"type":"say","who":"ferry","text":"That is the last crossing."}],"dawn_bridge":[{"type":"bg","name":"dawn_bridge"},{"type":"narrate","text":"The morning comes the way mornings do: without ceremony and slightly early."},{"type":"narrate","text":"The bridge opens at nine, and people walk across it the way people walk across new things,"},{"type":"narrate","text":"which is quickly, and looking at their feet."},{"type":"narrate","text":"You did not pole anybody anywhere on any of the last three nights. Nobody will ever know that either."},{"type":"narrate","text":"There is a bell on the jetty and it still rings, and it will ring for a while, and then it will be"},{"type":"narrate","text":"an old bell over water that nobody hears."},{"type":"say","who":"ferry","text":"Monday."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
