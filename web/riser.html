<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Riser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

:"coat off, because that is the order you do it in: stop it, then go and look."},{"type":"narrate","text":"Under the door of 4C the carpet is dark in a strip about a hand wide."},{"type":"jump","to":"the_landing"}],"the_landing":[{"type":"narrate","text":"The block is six floors of the same plan. You have been here eleven times in"},{"type":"say","who":"four years","text":"a burst on three, a blocked stack on five, and twice for the same"},{"type":"narrate","text":"flat, which is a thing you notice and do not write down."},{"type":"narrate","text":"The caretaker's name is on a card by the lift: D. Whyte. The card is older than"},{"type":"narrate","text":"the lift."},{"type":"say","who":"whyte","text":"It's coming through the ceiling of 3C as well. That's why they rang."},{"type":"say","who":"whyte","text":"4C is the one that's awake. He's been up. He's been up a while, actually."},{"type":"choice","text":"Knock on 4C.","to":"four_c"},{"type":"choice","text":"Find the riser for this stack first.","to":"the_riser"}],"the_riser":[{"type":"bg","name":"closet"},{"type":"narrate","text":"The riser cupboard is at the end of the landing, painted the same as the wall so"},{"type":"narrate","text":"that nobody opens it by accident. Inside: four risers, a stopcock, a meter that"},{"type":"narrate","text":"has not been read since it was installed, and a smell of wet plaster that is not"},{"type":"narrate","text":"from tonight."},{"type":"narrate","text":"You put your hand on the pipe for 4C and it is wet from the floor up to about"},{"type":"narrate","text":"your shoulder, and the paint has gone the way paint goes when it has been wet"},{"type":"narrate","text":"and dried and wet again. There is a tide line. There are four tide lines."},{"type":"narrate","text":"You take a photograph of that, because you are thorough, and then you stand"},{"type":"narrate","text":"there for a moment in a small room with a torch, doing arithmetic about how long"},{"type":"narrate","text":"a pipe has to be seeping for the plaster to look like that."},{"type":"choice","text":"Knock on 4C now.","to":"four_c"},{"type":"choice","text":"Write the tide lines down while you are looking at them.","to":"write_it_down"}],"write_it_down":[{"type":"narrate","text":"You write it in your notebook: *4C riser, wet to shoulder, four tide lines,"},{"type":"narrate","text":"plaster blown.* Not for anybody - you write the same way you photograph, so that"},{"type":"narrate","text":"in a week you are not guessing."},{"type":"narrate","text":"Then you go and knock on 4C, because he is awake and awake is a gift at this"},{"type":"narrate","text":"hour."},{"type":"jump","to":"four_c"}],"four_c":[{"type":"bg","name":"east_hall"},{"type":"narrate","text":"The man at 4C is about seventy and dressed, at two in the morning, in a"},{"type":"narrate","text":"cardigan, which tells you he was up before the water came through and the water"},{"type":"narrate","text":"is not why he is awake."},{"type":"say","who":"tenant","text":"It's the wall in the bathroom. It's been damp since the spring. I rang"},{"type":"narrate","text":"about it in April."},{"type":"say","who":"you","text":"Who did you ring?"},{"type":"say","who":"tenant","text":"The managing agent. Twice. They sent somebody, he looked at the ceiling"},{"type":"narrate","text":"in 3C and said it was condensation."},{"type":"narrate","text":"He stands back to let you in, and then says the thing that is actually on his"},{"type":"narrate","text":"mind, and says it fast, the way people do."},{"type":"say","who":"tenant","text":"If you write that it's been there since April, they'll say it's the"},{"type":"narrate","text":"wear and tear and it's mine to pay for. If you write tonight, it's theirs."},{"type":"choice","text":"Ask what he wants you to write.","to":"ask_him"},{"type":"choice","text":"Look at the wall first, and decide after.","to":"the_wall"},{"type":"choice","text":"Tell him what you are going to write and why.","to":"the_truth"}],"ask_him":[{"type":"say","who":"you","text":"What do you want me to put on the sheet."},{"type":"say","who":"tenant","text":"I want you to put the truth."},{"type":"say","who":"you","text":"The truth is a number, and the number is April."},{"type":"say","who":"tenant","text":"Then put April."},{"type":"narrate","text":"He says it without hesitating, which you were not expecting, and you have been"},{"type":"narrate","text":"doing this job for nineteen years and you know exactly what happens to people"},{"type":"narrate","text":"who put April in a box on a form. The managing agent's process has a step in it"},{"type":"narrate","text":"for this, and the step costs four hundred pounds and it is called chargeable."},{"type":"say","who":"you","text":"That'll be a survey. At your cost, initially. Then they'll decide."},{"type":"say","who":"tenant","text":"Then they'll decide."},{"type":"flag","name":"told_the_truth","delta":"+1"},{"type":"jump","to":"the_report"}],"the_wall":[{"type":"bg","name":"restrooms"},{"type":"narrate","text":"The bathroom is a small room that has been repainted, and repainted again, and"},{"type":"narrate","text":"the paper is the kind that is meant to hide things. You peel a corner back with"},{"type":"narrate","text":"your thumb, which you are not supposed to do, and the plaster underneath is"},{"type":"narrate","text":"black and soft and cold."},{"type":"narrate","text":"The leak is above the bath, at the joint where the riser goes through the floor,"},{"type":"narrate","text":"and it is a two-hour repair in daylight and a nine-hour one now, and it has been"},{"type":"narrate","text":"dripping long enough that the floorboards under the bath have gone."},{"type":"narrate","text":"You put the paper back down. From the doorway it looks the way it looked when"},{"type":"narrate","text":"you came in."},{"type":"choice","text":"Write tonight, and say nothing about the paper.","to":"ending_quiet"},{"type":"choice","text":"Write April, and let the survey happen.","to":"ending_april"},{"type":"choice","text":"Write tonight, and tell the man what you actually found.","to":"the_report"},{"type":"flag","name":"wrote_the_truth","delta":"+1"}],"the_truth":[{"type":"say","who":"you","text":"I'm going to write what I found, which is tonight's leak at the joint and"},{"type":"narrate","text":"plaster that has been wet for a long time. I'm going to date the tide lines."},{"type":"say","who":"you","text":"I'm not going to say whose fault it is, because that's not my box on the"},{"type":"narrate","text":"form either. Somebody will decide."},{"type":"say","who":"tenant","text":"And if they decide it's mine."},{"type":"say","who":"you","text":"Then they'll have to decide that out loud, to you, in writing."},{"type":"narrate","text":"He looks at you for a moment, and then goes to put the kettle on, which is what"},{"type":"narrate","text":"people do when they have decided to trust somebody."},{"type":"say","who":"tenant","text":"It's a shared riser. It always was."},{"type":"flag","name":"wrote_the_truth","delta":"+1"},{"type":"jump","to":"the_report"}],"the_report":[{"type":"narrate","text":"You fill the sheet in at the van with the interior light on, because it is"},{"type":"narrate","text":"half past three and you are not going to do this twice."},{"type":"say","who":"Three boxes matter","text":"DATE OF FAULT, which is a date and not a time; ACCESS, which"},{"type":"narrate","text":"is who has to be in; and DESCRIPTION, which is four lines and has been the same"},{"type":"narrate","text":"four lines on every one of these for nineteen years, because the process wants a"},{"type":"narrate","text":"description of the pipe and not of the last eleven months."},{"type":"narrate","text":"Tonight the description runs over into the margin."},{"type":"jump","to":"the_choice"}],"the_choice":[{"type":"narrate","text":"The pen is a cheap one and the paper is thin, and above the margin it says,"},{"type":"narrate","text":"in eight-point type, that a deliberately misleading report is a disciplinary"},{"type":"narrate","text":"matter."},{"type":"jump","to":"ending_named","cond":"wrote_the_truth \u003e= 1"},{"type":"jump","to":"ending_april","cond":"told_the_truth \u003e= 1"},{"type":"jump","to":"ending_quiet"}],"ending_named":[{"type":"narrate","text":"You write the tide lines down as lines, with dates against them where you can"},{"type":"narrate","text":"read the dates, and you write that the joint failed tonight. You do not write"},{"type":"narrate","text":"whose fault it is, because there is no box for that and there never was."},{"type":"narrate","text":"It goes in on Thursday. The managing agent asks for a survey, and the survey"},{"type":"narrate","text":"says what your sheet said, because you were careful and there is nothing in it"},{"type":"narrate","text":"to argue with."},{"type":"narrate","text":"The man at 4C rings the office in November to say the wall has been done. He says"},{"type":"narrate","text":"thank you the way people say it when they have been right about something for"},{"type":"narrate","text":"eight months."}],"ending_april":[{"type":"narrate","text":"You put April in the box, because he asked you to and because it is true, and the"},{"type":"narrate","text":"rest of the sheet is tonight, and the two do not fit on one form, so the form"},{"type":"narrate","text":"takes the date you gave it and the process does what the process does."},{"type":"narrate","text":"It comes back as chargeable. There is a survey, and the survey is his, and the"},{"type":"narrate","text":"letter that arrives in October has a reference number on it and a payment slip."},{"type":"narrate","text":"He does not ring the office. You look the job up in December to see how it ended,"},{"type":"narrate","text":"which is a thing you do, and it ended the way the form said it would."}],"ending_quiet":[{"type":"narrate","text":"You put tonight in the box and you put a new joint in the description, and the"},{"type":"narrate","text":"form is exactly the form it was always going to be, and nobody argues with it."},{"type":"narrate","text":"The repair is authorised in a week. The wall is done. The man at 4C says thank"},{"type":"narrate","text":"you at the door in the way people do when they have decided not to say the rest."},{"type":"narrate","text":"You put the photograph of the tide lines in the folder with the others, which is"},{"type":"narrate","text":"not evidence of anything and not yours to send, and nineteen years is a long time"},{"type":"narrate","text":"and you have got very good at the four lines."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
