<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>the only verb is a noise</title>
<style>
  :root{--bg:#05060A; --ink:#D8D8E4; --dim:#7A7A90; --red:#E94560; --gold:#FFD700;
        --panel:#0B0D14; --line:#1E2030}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:14px 14px 22px;min-height:100%;
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;letter-spacing:.10em;color:var(--red);margin:2px 0 0;text-transform:uppercase}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .nightrow{display:block;width:100%;text-align:left;padding:12px 14px;margin:0 0 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;cursor:pointer}
  .nightrow:active{background:#16171F}
  .nightrow .t{display:block;font-size:16px}
  .nightrow .n{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .help{color:var(--dim);font-size:12px;line-height:1.6}
  #band{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}
  #night{color:var(--red);letter-spacing:.06em}
  .meter{height:6px;background:#141620;border-radius:3px;overflow:hidden;width:62px}
  .meter i{display:block;height:100%;width:100%;background:#5A6A8A}
  .meter.low i{background:var(--red)}
  .sys{font-size:11px;letter-spacing:.04em}
  .sys.down{color:var(--red)}
  #stage{position:relative;background:#02030A;border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  #readout{font-size:13px;letter-spacing:.04em;color:var(--gold);min-height:20px}
  #readout small{color:var(--dim);letter-spacing:0}
  #strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  #strip button{padding:12px 6px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  #strip button:active{background:#16171F}
  #strip button.wide{grid-column:1 / -1}
  #strip button[disabled]{opacity:.35}
  #over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:6px;background:rgba(2,3,10,.86);text-align:center;padding:18px}
  #over h2{margin:0;font-size:22px;color:var(--red);letter-spacing:.06em}
  #over p{margin:0;color:var(--dim);font-size:13px}
  #over button{margin-top:10px;padding:10px 18px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <h1>Five Nights at Freddy's 3</h1>
  <p class="sub">One animatronic, no doors, no mask -- and the only verb you have is a noise.</p>

  <div id="select"></div>

  <div id="band" hidden>
    <span id="night"></span>
    <span id="clock"></span>
    <span>AIR <span class="meter" id="air"><i></i></span></span>
    <span class="sys" id="sys"></span>
  </div>

  <div id="stage" hidden>
    <canvas id="cv" width="720" height="440"></canvas>
    <div id="over" hidden>
      <h2 id="overtitle"></h2>
      <p id="overtext"></p>
      <button id="again">Again</button>
    </div>
  </div>

  <div id="readout" hidden></div>

  <div id="strip" hidden>
    <button id="mon" class="wide">MONITOR UP</button>
    <button id="lure" class="wide">PLAY THE LURE</button>
    <button id="rc">REBOOT CAM</button>
    <button id="ra">REBOOT AUDIO</button>
    <button id="rv">REBOOT AIR</button>
  </div>

  <p class="help" id="help"></p>
</div>

<script>
const C = {
  adj: [
    [],
    [2, 7],
    [1, 3, 6],
    [2, 4, 5],
    [3],
    [3],
    [2],
    [1, 8, 9],
    [7],
    [7, 10],
    [9]
  ],
  toOffice: [0, 1, 2, 3, 4, 4, 3, 2, 3, 3, 4],
  roomName: ["Office", "Entrance", "Hall", "Main Hall", "Arcade", "Kitchen", "Restrooms", "Hall", "Hall", "Prize Corner", "Vent"],
  aiLevel: [4, 8, 12, 16, 20],
  drainMult: [1, 1.3, 1.55, 1.75, 2.1],
  notes: ["The air lasts a hundred seconds. Learn the lure. Air drains at 1.00 a second.", "The air goes faster. So does he. Air drains at 1.30 a second.", "Two panels a night, and both of them cost you the lure. Air drains at 1.55 a second.", "The air is the night now. Everything else is what you do between reboots. Air drains at 1.75 a second.", "He moves every 3.0 seconds and stands in the office for 2.6. Air drains at 2.10 a second."],
  phantomNames: ["Phantom Freddy", "Phantom Chica", "Phantom Foxy", "Phantom Mangle", "Phantom Puppet", "Phantom Balloon Boy"],
  phantomTakes: ["CAMERAS", "AUDIO"],
  phantomSlots: ["WINDOW", "DESK", "VENT", "CORNER", "WINDOW", "DESK"],
  hourSeconds: 45,
  nightHours: 6,
  rebootTime: 4,
  ventMax: 100,
  ventDrain: 1,
  lureDuration: 5,
  lureCooldown: 7.5,
  moveMax: 5.4,
  moveMin: 3,
  graceMax: 3.5,
  graceMin: 2.6,
  ventFailSpeedup: 0.6,
  phantomLife: 3,
  phantomRateCalm: 0.008,
  phantomRateFailing: 0.12,
  phantomMax: 2,
  help: "One animatronic, no doors, no mask. He cannot be blocked and he cannot be made to leave the building -- the only thing you can do to him is make a noise somewhere else, and the lure has a duration and a cooldown, so it buys distance rather than removing him. The ventilation drains and has to be rebooted, and a reboot takes both hands. And the phantoms cannot hurt you: they take a system on the way out, chosen for you."
};


// --------------------------------------------------------------- the night
//
// A faithful port of aside.games.fnaf3.engine.Game. There is one
// animatronic, he cannot be blocked, and the only thing you can do to him
// is make a noise somewhere else. Three clocks want the same two hands:
// Springtrap walking a graph toward the office, the ventilation draining
// and needing a reboot, and the phantoms, which cannot hurt you and take a
// system on the way out.
//
// java.util.Random is reproduced in BigInt so the same seed deals the same
// night in both builds. This engine seeds Random directly rather than
// through the splitmix64 finalizer the later games use.

function RNG(seed) {
  this.s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
}
RNG.prototype.next = function (bits) {
  this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
  return Number(this.s >> BigInt(48 - bits));
};
RNG.prototype.nextDouble = function () {
  return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
};
RNG.prototype.nextInt = function (bound) {
  let r = this.next(31);
  const m = bound - 1;
  if ((bound & m) === 0) return Number((BigInt(bound) * BigInt(r)) >> 31n);
  let u = r;
  for (;;) {
    r = u % bound;
    if (((u - r + m) | 0) >= 0) return r;
    u = this.next(31);
  }
};
RNG.prototype.nextBoolean = function () { return this.next(1) !== 0; };

const HOUR_SECONDS = C.hourSeconds, NIGHT_HOURS = C.nightHours;
const REBOOT_TIME = C.rebootTime, VENT_MAX = C.ventMax, VENT_DRAIN = C.ventDrain;
const LURE_DURATION = C.lureDuration, LURE_COOLDOWN = C.lureCooldown;
const MOVE_MAX = C.moveMax, MOVE_MIN = C.moveMin;
const GRACE_MAX = C.graceMax, GRACE_MIN = C.graceMin;
const VENT_FAIL_SPEEDUP = C.ventFailSpeedup;
const PHANTOM_LIFE = C.phantomLife;
const PHANTOM_RATE_CALM = C.phantomRateCalm, PHANTOM_RATE_FAILING = C.phantomRateFailing;
const PHANTOM_MAX = C.phantomMax;
const ROOMS = 10;
const SYSTEM = ["CAMERAS", "AUDIO", "VENTILATION"];

function distance(from, to) {
  if (from === to) return 0;
  const dist = new Array(ROOMS + 1).fill(-1);
  const q = [from];
  dist[from] = 0;
  while (q.length) {
    const r = q.shift();
    for (const n of C.adj[r]) {
      if (dist[n] !== -1) continue;
      dist[n] = dist[r] + 1;
      if (n === to) return dist[n];
      q.push(n);
    }
  }
  return -1;
}

function closerTo(from, to) {
  let best = Infinity, out = [];
  for (const cand of C.adj[from]) {
    const d = distance(cand, to);
    if (d < 0) continue;
    if (d < best) { best = d; out = []; }
    if (d === best) out.push(cand);
  }
  return out;
}

function Springtrap(startRoom) {
  this.room = startRoom; this.atOffice = false; this.atWindow = false;
  this.moveTimer = 0; this.officeTimer = 0;
}
Springtrap.prototype.update = function (dt, g) {
  if (g.status !== "PLAYING") return;
  if (this.atOffice) {
    if (g.lureRoom > 0) { this.leave(g); return; }
    this.officeTimer += dt;
    if (this.officeTimer >= g.officeGrace()) g.jumpscare();
    return;
  }
  this.moveTimer += dt;
  if (this.moveTimer < g.moveInterval()) return;
  this.moveTimer = 0;
  this.step(g);
};
Springtrap.prototype.step = function (g) {
  const lure = g.lureRoom;
  const target = lure > 0 ? lure : 1;
  if (this.room === 1 && lure === 0) {
    if (g.rng.nextDouble() < g.enterChance()) this.enter(g);
    return;
  }
  if (this.room === target) return;
  const cands = closerTo(this.room, target);
  if (cands.length === 0) return;
  this.room = cands[g.rng.nextInt(cands.length)];
  g.cue("footstep");
  if (this.room === 1 && lure === 0 && g.rng.nextDouble() < g.enterChance()) this.enter(g);
};
Springtrap.prototype.enter = function (g) {
  this.atOffice = true; this.atWindow = g.rng.nextBoolean(); this.officeTimer = 0;
  g.cue("at_door");
};
Springtrap.prototype.leave = function (g) {
  this.atOffice = false; this.room = 1; this.moveTimer = 0; this.officeTimer = 0;
  g.cue("door_close");
};
Springtrap.prototype.distanceToOffice = function () {
  return this.atOffice ? 0 : C.toOffice[this.room];
};
Springtrap.prototype.where = function () {
  return this.atOffice ? "Office" : C.roomName[this.room];
};

function Phantom(name, slot, takes, life) {
  this.name = name; this.slot = slot; this.takes = takes; this.life = life; this.spent = false;
}
Phantom.prototype.update = function (dt) {
  if (this.spent) return false;
  this.life -= dt;
  if (this.life > 0) return false;
  this.spent = true;
  return true;
};

function Game(night, seed) {
  this.night = night;
  this.rng = new RNG(seed);
  this.time = 0; this.hour = 0;
  this.cameraUp = false; this.currentCam = 1;
  this.online = [true, true, true];
  this.rebooting = -1; this.rebootTimer = 0;
  this.ventilation = VENT_MAX;
  this.lureRoom = 0; this.lureTimer = 0; this.lureCooldown = 0;
  this.status = "PLAYING";
  this.springtrap = new Springtrap(5 + this.rng.nextInt(6));
  this.phantoms = []; this.lastPhantom = null; this.lastTaken = null;
  this.phantomsSpawned = 0;
  this.cues = [];
}
Game.prototype.aiLevel = function () { return C.aiLevel[Math.min(this.night - 1, 4)]; };
Game.prototype.moveInterval = function () {
  const t = Math.min(1, this.aiLevel() / 20);
  const base = MOVE_MAX - t * (MOVE_MAX - MOVE_MIN);
  return this.ventilationOnline() ? base : base * VENT_FAIL_SPEEDUP;
};
Game.prototype.officeGrace = function () {
  const t = Math.min(1, this.aiLevel() / 20);
  return GRACE_MAX - t * (GRACE_MAX - GRACE_MIN);
};
Game.prototype.enterChance = function () {
  const t = Math.min(1, this.aiLevel() / 20);
  return 0.30 + t * 0.45;
};
Game.prototype.drainRate = function () {
  return VENT_DRAIN * C.drainMult[Math.min(this.night - 1, 4)];
};
Game.prototype.phantomRate = function () {
  return this.ventilationOnline() ? PHANTOM_RATE_CALM : PHANTOM_RATE_FAILING;
};
Game.prototype.ventilationOnline = function () { return this.online[2]; };
Game.prototype.audioOnline = function () { return this.online[1]; };
Game.prototype.camerasOnline = function () { return this.online[0]; };
Game.prototype.clock = function () {
  const h = Math.min(this.hour, 6);
  return h === 0 ? "12 AM" : (h < 6 ? h + " AM" : "6 AM");
};
Game.prototype.cue = function (n) { this.cues.push(n); };
Game.prototype.drain = function () { const c = this.cues; this.cues = []; return c; };
Game.prototype.jumpscare = function () { this.status = "JUMPSCARED"; this.cue("scare_sprint"); };

Game.prototype.update = function (dt) {
  if (this.status !== "PLAYING") return;
  this.time += dt;
  this.hour = Math.floor(this.time / HOUR_SECONDS);
  if (this.hour >= NIGHT_HOURS) { this.status = "SURVIVED"; this.cue("chime_6am"); return; }

  if (this.lureRoom > 0) {
    this.lureTimer -= dt;
    if (this.lureTimer <= 0) { this.lureRoom = 0; this.lureTimer = 0; }
  }
  if (this.lureCooldown > 0) this.lureCooldown = Math.max(0, this.lureCooldown - dt);

  if (this.ventilationOnline()) {
    this.ventilation -= this.drainRate() * dt;
    if (this.ventilation <= 0) {
      this.ventilation = 0; this.online[2] = false; this.cue("power_down");
    }
  }

  if (this.rebooting >= 0) {
    this.rebootTimer += dt;
    if (this.rebootTimer >= REBOOT_TIME) {
      this.online[this.rebooting] = true;
      if (this.rebooting === 2) this.ventilation = VENT_MAX;
      this.rebooting = -1; this.rebootTimer = 0; this.cue("power_up");
    }
  }

  this.springtrap.update(dt, this);
  if (this.status !== "PLAYING") return;
  this.updatePhantoms(dt);
};

Game.prototype.updatePhantoms = function (dt) {
  for (const p of this.phantoms) {
    if (p.update(dt)) {
      this.online[SYSTEM.indexOf(p.takes)] = false;
      this.lastTaken = p.takes;
      this.cue("static");
    }
  }
  this.phantoms = this.phantoms.filter((p) => !p.spent);
  if (this.phantoms.length < PHANTOM_MAX && this.rng.nextDouble() < this.phantomRate() * dt) {
    this.spawnPhantom();
  }
};

Game.prototype.spawnPhantom = function () {
  const i = this.rng.nextInt(C.phantomNames.length);
  const takes = C.phantomTakes[this.rng.nextInt(C.phantomTakes.length)];
  const p = new Phantom(C.phantomNames[i], C.phantomSlots[i], takes, PHANTOM_LIFE);
  this.phantoms.push(p); this.lastPhantom = p; this.phantomsSpawned++;
  this.cue("static");
};

Game.prototype.toggleCamera = function () {
  if (this.status !== "PLAYING") return;
  this.cameraUp = !this.cameraUp;
  this.cue(this.cameraUp ? "camera_up" : "camera_down");
};
Game.prototype.setCam = function (cam) {
  if (cam < 1 || cam > ROOMS) return;
  this.currentCam = cam;
};
Game.prototype.playLure = function (room) {
  if (this.status !== "PLAYING") return false;
  if (!this.audioOnline()) return false;
  if (this.rebooting >= 0) return false;
  if (this.lureCooldown > 0) return false;
  if (room < 1 || room > ROOMS) return false;
  this.lureRoom = room; this.lureTimer = LURE_DURATION; this.lureCooldown = LURE_COOLDOWN;
  this.cue("pot_clank");
  return true;
};
Game.prototype.lureReady = function () {
  return this.status === "PLAYING" && this.audioOnline()
    && this.rebooting < 0 && this.lureCooldown <= 0;
};
Game.prototype.startReboot = function (s) {
  if (this.status !== "PLAYING") return false;
  if (this.rebooting >= 0) return false;
  const i = SYSTEM.indexOf(s);
  if (this.online[i]) return false;
  this.rebooting = i; this.rebootTimer = 0;
  return true;
};
Game.prototype.canReboot = function (s) {
  const i = SYSTEM.indexOf(s);
  return this.status === "PLAYING" && this.rebooting < 0 && !this.online[i];
};

// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


/**
 * FNAF 3's cue names, on the shared palette.
 *
 * This mapping is the game's own business, and for this game it is close to
 * the whole game: the only verb the player has is a noise, and the only
 * channel that says where Springtrap is, is a footstep. The desktop plays a
 * different recording for each of these; what has to survive the port is the
 * *distinction* -- a step somewhere in the building against a step one room
 * away against something arriving at the door -- because that gradient is
 * the information model. A silent port of this game is a port of a different,
 * easier game: without the footsteps the graph is invisible and the lure is
 * a guess.
 */
function sfx(cue) {
  switch (cue) {
    case "footstep": voice("footstep"); break;
    case "at_door": voice("knock"); break;
    case "door_close": voice("knock"); break;
    case "static": voice("static"); break;
    case "pot_clank": voice("clank"); break;
    case "power_down": voice("down"); break;
    case "power_up": voice("up"); break;
    case "light_click": voice("click"); break;
    case "chime_6am": voice("chime"); break;
    case "scare_sprint": voice("scream"); break;
    default: break;
  }
}

// --------------------------------------------------------------- the office

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const SLOT = {
  WINDOW: [40, 60, 190, 150],
  VENT:   [265, 60, 190, 150],
  DESK:   [490, 60, 190, 150],
  CORNER: [265, 250, 190, 150]
};
const GRID = (() => {
  const out = {};
  for (let r = 1; r <= ROOMS; r++) {
    const c = (r - 1) % 5, row = Math.floor((r - 1) / 5);
    out[r] = [30 + c * 134, 60 + row * 150, 122, 132];
  }
  return out;
})();

function drawOffice(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  for (const k of Object.keys(SLOT)) {
    const b = SLOT[k];
    cx.fillStyle = "#070910"; cx.fillRect(b[0], b[1], b[2], b[3]);
    cx.strokeStyle = "#1E2030"; cx.lineWidth = 2; cx.strokeRect(b[0], b[1], b[2], b[3]);
    cx.fillStyle = "#556070"; cx.font = "13px Arial"; cx.textAlign = "center";
    cx.fillText(k, b[0] + b[2] / 2, b[1] - 10);
  }
  // He is in the office: at the window or at the vent, and nowhere else.
  if (g.springtrap.atOffice) {
    const b = SLOT[g.springtrap.atWindow ? "WINDOW" : "VENT"];
    const x = b[0] + b[2] / 2, y = b[1] + b[3] / 2;
    cx.fillStyle = "rgba(233,69,96,0.85)";
    cx.beginPath(); cx.ellipse(x, y, 30, 46, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = "#FFD700";
    cx.beginPath(); cx.arc(x - 10, y - 20, 5, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.arc(x + 10, y - 20, 5, 0, Math.PI * 2); cx.fill();
    const left = Math.max(0, 1 - g.springtrap.officeTimer / g.officeGrace());
    cx.fillStyle = "#141620"; cx.fillRect(b[0] + 14, b[1] + b[3] - 16, b[2] - 28, 6);
    cx.fillStyle = left < 0.35 ? "#E94560" : "#5A6A8A";
    cx.fillRect(b[0] + 14, b[1] + b[3] - 16, (b[2] - 28) * left, 6);
  }
  // Phantoms, in their slots. They cannot hurt you and they take something.
  for (const p of g.phantoms) {
    const b = SLOT[p.slot];
    cx.fillStyle = "rgba(120,140,190,0.35)";
    cx.beginPath();
    cx.ellipse(b[0] + b[2] / 2, b[1] + b[3] / 2, 26, 40, 0, 0, Math.PI * 2);
    cx.fill();
  }
}

function drawMonitor(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  for (let r = 1; r <= ROOMS; r++) {
    const b = GRID[r];
    const here = g.springtrap.room === r && !g.springtrap.atOffice;
    const lure = g.lureRoom === r;
    cx.fillStyle = "#070910"; cx.fillRect(b[0], b[1], b[2], b[3]);
    cx.strokeStyle = lure ? "#FFD700" : (here ? "#E94560" : (r === g.currentCam ? "#6A5A3A" : "#1E2030"));
    cx.lineWidth = (lure || here) ? 3 : 2;
    cx.strokeRect(b[0], b[1], b[2], b[3]);
    cx.fillStyle = "#556070"; cx.font = "12px Arial"; cx.textAlign = "center";
    cx.fillText(r + " " + C.roomName[r], b[0] + b[2] / 2, b[1] + 20);
    if (here) {
      cx.fillStyle = "rgba(233,69,96,0.85)";
      cx.beginPath(); cx.ellipse(b[0] + b[2] / 2, b[1] + b[3] / 2 + 12, 22, 32, 0, 0, Math.PI * 2); cx.fill();
    }
    if (lure) {
      cx.fillStyle = "#FFD700"; cx.font = "12px Arial";
      cx.fillText("SOUND", b[0] + b[2] / 2, b[1] + b[3] - 14);
    }
  }
}

function drawDead(g, text) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  cx.fillStyle = "#3A3A4E"; cx.font = "20px Arial"; cx.textAlign = "center";
  cx.fillText(text, W / 2, H / 2);
}

// --------------------------------------------------------------- the page

let g = null, raf = 0, last = 0, heard = "";

function start(night) {
  g = new Game(night, Date.now() & 0xffff);
  heard = "";
  document.getElementById("select").hidden = true;
  document.getElementById("band").hidden = false;
  document.getElementById("stage").hidden = false;
  document.getElementById("readout").hidden = false;
  document.getElementById("strip").hidden = false;
  document.getElementById("over").hidden = true;
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (g) { g.update(dt); cues(); paint(); }
  raf = requestAnimationFrame(loop);
}

function cues() {
  for (const c of g.drain()) {
    sfx(c);
    if (c === "footstep") heard = "A FOOTSTEP <small>&mdash; he is walking</small>";
    else if (c === "at_door") heard = "HE IS IN THE OFFICE <small>&mdash; the lure is the only thing that reaches him</small>";
    else if (c === "door_close") heard = "HE LEFT <small>&mdash; back to the hall</small>";
    else if (c === "power_down") heard = "THE AIR IS DOWN <small>&mdash; and the phantoms come</small>";
    else if (c === "power_up") heard = "A SYSTEM IS BACK";
    else if (c === "static") heard = "STATIC <small>&mdash; a phantom</small>";
    else if (c === "pot_clank") heard = "THE LURE IS PLAYING";
    else if (c === "scare_sprint") heard = "";
  }
}

function paint() {
  const st = g.status;
  if (!g.camerasOnline()) drawDead(g, "NO CAMERAS");
  else if (g.cameraUp) drawMonitor(g);
  else drawOffice(g);

  document.getElementById("night").textContent = "NIGHT " + g.night;
  document.getElementById("clock").textContent = g.clock();
  const air = document.getElementById("air");
  air.firstElementChild.style.width = Math.round((g.ventilation / VENT_MAX) * 100) + "%";
  air.className = "meter" + (g.ventilation < VENT_MAX * 0.3 ? " low" : "");
  document.getElementById("sys").textContent =
    "CAM " + (g.online[0] ? "OK" : "DOWN") + "  AUD " + (g.online[1] ? "OK" : "DOWN");

  let line = heard;
  if (g.rebooting >= 0) {
    line = "REBOOTING " + SYSTEM[g.rebooting] + " <small>&mdash; "
      + (REBOOT_TIME - g.rebootTimer).toFixed(1) + "s, and both hands are on the panel</small>";
  } else if (g.lureCooldown > 0 && g.lureRoom === 0) {
    line = "THE LURE IS COOLING <small>&mdash; " + g.lureCooldown.toFixed(1) + "s</small>";
  } else if (g.cameraUp) {
    line = "CAM " + g.currentCam + " &mdash; " + C.roomName[g.currentCam]
      + " <small>&mdash; tap a room, then play the lure there</small>";
  }
  document.getElementById("readout").innerHTML = line;

  const on = st === "PLAYING";
  document.getElementById("mon").disabled = !on;
  document.getElementById("mon").textContent = g.cameraUp ? "MONITOR DOWN" : "MONITOR UP";
  document.getElementById("lure").disabled = !on || !g.lureReady();
  document.getElementById("rc").disabled = !on || !g.canReboot("CAMERAS");
  document.getElementById("ra").disabled = !on || !g.canReboot("AUDIO");
  document.getElementById("rv").disabled = !on || !g.canReboot("VENTILATION");

  if (st !== "PLAYING" && document.getElementById("over").hidden) {
    document.getElementById("over").hidden = false;
    document.getElementById("overtitle").textContent = st === "SURVIVED" ? "6 AM" : "HE GOT IN";
    document.getElementById("overtext").textContent =
      st === "SURVIVED" ? "Nothing was in the office at six."
                        : "He was standing in the office and the lure was not ready.";
  }
}

cv.onclick = (e) => {
  if (!g || !g.cameraUp || !g.camerasOnline()) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  for (let room = 1; room <= ROOMS; room++) {
    const b = GRID[room];
    if (x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3]) { g.setCam(room); return; }
  }
};

document.getElementById("mon").onclick = () => g && g.toggleCamera();
document.getElementById("lure").onclick = () => g && g.playLure(g.currentCam);
document.getElementById("rc").onclick = () => g && g.startReboot("CAMERAS");
document.getElementById("ra").onclick = () => g && g.startReboot("AUDIO");
document.getElementById("rv").onclick = () => g && g.startReboot("VENTILATION");
document.getElementById("again").onclick = () => { const n = g.night; start(n); };

(function build() {
  const sel = document.getElementById("select");
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.className = "nightrow";
    b.innerHTML = '<span class="t">Night ' + n + "</span>"
      + '<span class="n">' + C.notes[n - 1] + "</span>";
    b.onclick = () => start(n);
    sel.appendChild(b);
  }
  document.getElementById("help").textContent = C.help;
})();
</script>
</body>
</html>
