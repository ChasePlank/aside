<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Up the Entry</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

aTaVtWi0BRj0CYJgTQRQIZv8AmjMFRBnH0UO4Ew0squo2kSnPg3AtqCNRqBTccysYulqiZKwRLVsgu24oB3Lixg89TceAVjo3cTHlMsTkr4hFtlLblhwxri7adUDS4gQNxnbiDKEMJ6nQi00y6VNBiBzEhrcOLYGZUr2Qh6IbC3BKjO4WLNXMnTmKpLdvMsOUEY0XiByKt5jXnyl/g2leQcsug+obp/NXMwJf1XFxFWBnNBK7l04EledtvEw8JljdwKbcaEF+IJ1H4imCZn4IykjllANpUP8AsMIrZWJUA5gXaBt1LpYU5iCjmBd1G9It8qTqmuYAxIQziiPhAVivqQkKxEIE2+U5jpTYyvcCUtPDLOlAlMGxi2DxmK/qDQRbP5k2QIB19RGHE2C+ACbMxBUlaOIUw/RxOb5jnEZ7GEAZjicMFIiFzBVLzDiYE4iHaygGLLyTgmyARJLly/wjuyGjG4CgwKKy1Ey1Zj3iYAcQAtlxLULOEHIeyEtkgoNNRCJTmK1KwI2cQ4ibxUqlpZRlWRlXPBZ8xRkio4my9xMVxEn/2Q=="},"missing":[],"passages":{"start":[{"type":"bg","name":"east_corner"},{"type":"narrate","text":"The yard is four hundredweight of house coal and a hundred of smokeless, which is a light load"},{"type":"narrate","text":"for the week before Christmas, because everybody who was going to order has ordered."},{"type":"narrate","text":"You have the cart, which is a flatbed Transit with a rotten tailgate, and you have Ray, who is"},{"type":"narrate","text":"nineteen and on his second winter and who loads from the wrong end unless he is told."},{"type":"jump","to":"the_loading"}],"the_loading":[{"type":"narrate","text":"The book for today is six drops and the two that matter are at opposite ends of the round: the"},{"type":"narrate","text":"Hall, which wants four hundredweight and is seven miles out past the reservoir, and then four"},{"type":"narrate","text":"small ones in the town, two hundredweight between them."},{"type":"narrate","text":"The light goes at twenty past four. The Hall's housekeeper has already rung once."},{"type":"choice","text":"Do the Hall first and the town on the way back.","to":"big_first"},{"type":"choice","text":"Do the four small ones first and the Hall last.","to":"small_first"},{"type":"choice","text":"Split it: Ray takes the town in the car, you take the Hall.","to":"split_it"}],"big_first":[{"type":"narrate","text":"You go out first, seven miles on roads that have not been gritted, and the gate to the Hall is"},{"type":"narrate","text":"half a mile up a track with a slope on it that the Transit does not like in the wet."},{"type":"narrate","text":"The housekeeper meets you at the yard door in an apron with flour on it and counts the sacks"},{"type":"narrate","text":"while Ray stacks them, which is the arrangement she has had with this round for eleven years."},{"type":"jump","to":"the_town"}],"small_first":[{"type":"narrate","text":"The four small drops take an hour and forty minutes, which is twenty minutes longer than you"},{"type":"narrate","text":"thought, because the third one is an old woman who wants the sacks put in the outhouse and the"},{"type":"narrate","text":"outhouse has a step."},{"type":"narrate","text":"It is ten past three when you turn for the reservoir, and the light is going, and the Hall's"},{"type":"narrate","text":"housekeeper rings the yard while you are on the road and nobody is in the office to answer it."},{"type":"jump","to":"the_hall_late"}],"the_hall_late":[{"type":"narrate","text":"You get to the Hall at twenty past four with the light gone and the track slippery and the"},{"type":"narrate","text":"housekeeper standing in the yard door with her coat on over the apron."},{"type":"narrate","text":"She takes it. She is not pleased and she takes it, and she says one sentence about next year while"},{"type":"narrate","text":"Ray stacks, and the sentence is fair and you accept it, and you are back on the reservoir road at"},{"type":"narrate","text":"five and home at twenty past, which is the latest this round has finished in four years."}],"split_it":[{"type":"narrate","text":"You split it, which you have only done twice before, and Ray takes the car and the town list and"},{"type":"narrate","text":"goes, and you take four hundredweight and the hill."},{"type":"narrate","text":"It works better than it has any right to. He is back at the yard by four with the sheet signed"},{"type":"narrate","text":"and the money in the tin, and you are at the Hall by half past three, and when you come down the"},{"type":"narrate","text":"track the two of you pass on the reservoir road and he flashes his lights, which is not something"},{"type":"narrate","text":"he has ever done before and which you think about for the rest of the evening."},{"type":"jump","to":"the_town"}],"the_town":[{"type":"narrate","text":"The town drops are all on the same estate and the estate is one-way with a barrier that gives"},{"type":"narrate","text":"trouble, and at the second house the old man wants the coal in the bunker rather than on the"},{"type":"narrate","text":"path, and the bunker is through the kitchen."},{"type":"narrate","text":"At the fourth house nobody is in, which happens, and you leave the sacks stacked by the door with"},{"type":"narrate","text":"the ticket under the top one, and as you are getting back in the van Ray says the thing he has"},{"type":"narrate","text":"been saving up."},{"type":"say","who":"ray","text":"That's all right, that, in't it. Leaving it."},{"type":"jump","to":"the_question"}],"the_question":[{"type":"narrate","text":"Two hundredweight of coal left in a doorway and a ticket under the sack and a house that has been"},{"type":"narrate","text":"on the round since before you had it, and the money has been paid by standing order since 1998."},{"type":"narrate","text":"It is twenty past four and there is one drop left, and it is the one up the entry."},{"type":"choice","text":"Agree with him. It is the arrangement and it has always been the arrangement.","to":"the_arrangement"},{"type":"choice","text":"Tell him the arrangement exists for the houses that pay and this one does.","to":"the_paying"},{"type":"choice","text":"Leave it, and say nothing, because he will find out in eleven years.","to":"the_silence"}],"the_arrangement":[{"type":"say","who":"ray","text":"Right. I just thought I'd ask."},{"type":"say","who":"you","text":"Ask in eleven years."},{"type":"narrate","text":"He laughs at that and gets in and slams the door the way he slams everything, and the two of you"},{"type":"narrate","text":"go up to Fell Street in the dark and the traffic, and it occurs to you, in the way things occur"},{"type":"narrate","text":"while you are driving, that he asked because somebody had told him it was not all right, and that"},{"type":"narrate","text":"somebody was probably his mother, and that he had asked you to settle an argument he had at home."},{"type":"jump","to":"the_entry"}],"the_paying":[{"type":"say","who":"you","text":"It's not for the ones that pay. It's for the ones that aren't in and have paid anyway."},{"type":"say","who":"ray","text":"Aye, well. You'd know."},{"type":"narrate","text":"He says it without any edge and he is quiet for a mile, and then he asks the other thing, which is"},{"type":"narrate","text":"whether he can do the February on his own when you have your knee done, and you say yes before you"},{"type":"narrate","text":"have thought about it, and the two of you drive up to Fell Street with that between you instead."},{"type":"jump","to":"the_entry"}],"the_silence":[{"type":"narrate","text":"You say nothing, which is what you have done with every other nineteen-year-old who has worked"},{"type":"narrate","text":"this round, because the eleven-year answer is the true one and it does not fit in a van."},{"type":"narrate","text":"He watches you not answer, and he does not ask again, and over the following fortnight the two of"},{"type":"narrate","text":"you settle into a shape where he copies you rather than asks you, which is better for the coal and"},{"type":"narrate","text":"worse for him and you know both of those things."},{"type":"jump","to":"the_entry"}],"the_entry":[{"type":"narrate","text":"Fell Street is a terrace with a passage up the side of number 9, and the passage is what everybody"},{"type":"narrate","text":"in the trade calls an entry, and it is thirty-one inches wide and it goes up eleven steps and turns"},{"type":"narrate","text":"twice, and the coal house is at the top of it."},{"type":"narrate","text":"There are two hundredweight for number 9 and the entry has been the arrangement since the coal"},{"type":"narrate","text":"house was built. The cart cannot get near it. Your shoulder is what you have."},{"type":"jump","to":"the_entry_two"}],"the_entry_two":[{"type":"narrate","text":"It is ten to five and dark and the fog is coming down off the park, and you have done this entry"},{"type":"narrate","text":"about a thousand times and there are two ways to do it."},{"type":"choice","text":"Bag it small and take it up four trips, the way you always have.","to":"four_trips"},{"type":"choice","text":"Take a hundredweight a trip and do it in two, and mind the turn.","to":"two_trips"},{"type":"choice","text":"Leave it at the mouth of the entry and knock, and let her say what she wants.","to":"the_knock"}],"four_trips":[{"type":"narrate","text":"Four trips of fifty pounds with the sack on your shoulder and your hand on the wall at the turn,"},{"type":"narrate","text":"and it takes eleven minutes, and the coal house at the top is dry and there is a light on in the"},{"type":"narrate","text":"kitchen and she has put a cup of tea on the step for when you come down, which she has done since"},{"type":"narrate","text":"you took the round over."},{"type":"narrate","text":"On the fourth trip you put the last sack in and stand up straight, and your shoulder says the"},{"type":"narrate","text":"thing it says every December, and you are fifty-one and you have eleven more years of this to"},{"type":"narrate","text":"get through if you are lucky, and the tea is still hot."},{"type":"jump","to":"ending_the_cup"}],"ending_the_cup":[{"type":"narrate","text":"Four trips, eleven minutes, tea on the step, and the last sack in the coal house, and number 9"},{"type":"narrate","text":"written off the sheet in the van and the money in the tin."},{"type":"narrate","text":"The fog comes down properly while you are driving home and you do the last two miles at twenty,"},{"type":"narrate","text":"and you are in the house by half five and your knee is fine and the shoulder is not, and eleven"},{"type":"narrate","text":"more years of this is what you have told yourself you want, and on a December evening with a hot"},{"type":"narrate","text":"cup behind you it is the truth and you know it."}],"two_trips":[{"type":"narrate","text":"Two trips of a hundredweight with the sack on your shoulder and your hand on the wall, and on the"},{"type":"narrate","text":"second one at the turn you catch the sack on the corner and it splits along the seam, and about"},{"type":"narrate","text":"twenty pounds of coal goes down eleven steps in the dark and you spend a quarter of an hour on"},{"type":"narrate","text":"your knees in it."},{"type":"narrate","text":"She comes out at the noise with a torch and does not say anything about the coal at all, and asks"},{"type":"narrate","text":"you whether you are all right, and then sweeps it up herself while you are still apologising,"},{"type":"narrate","text":"which is the part of the evening you will remember."},{"type":"jump","to":"the_split"}],"the_split":[{"type":"narrate","text":"You offered to make up the twenty pounds from tomorrow's load and she would not have it, and she"},{"type":"narrate","text":"stood at the top of the entry with the torch while you stacked the last of it and she said the"},{"type":"narrate","text":"sentence that everybody in the trade gets from somebody once or twice a decade."},{"type":"say","who":"her","text":"You've done that entry when it was worse than this."},{"type":"jump","to":"ending_the_torch"}],"ending_the_torch":[{"type":"narrate","text":"She sweeps it up herself because she has had that entry longer than you have had the round, and"},{"type":"narrate","text":"the twenty pounds is neither made up nor mentioned again, and the two of you stand at the top of"},{"type":"narrate","text":"it in the fog with the torch between you and talk about the weather for four minutes, which is"},{"type":"narrate","text":"what people in this town do instead of saying the other thing."},{"type":"narrate","text":"On the way down you count the steps, which you have never done, and there are eleven, and at the"},{"type":"narrate","text":"bottom Ray is leaning on the van with his hands in his pockets and he does not laugh, which is"},{"type":"narrate","text":"the first time all day that he has not laughed at something he could have."}],"the_knock":[{"type":"narrate","text":"You leave the two sacks at the mouth of the entry on the pavement and knock, which is not the"},{"type":"narrate","text":"arrangement and which is the thing you have been talking to Ray about all afternoon without"},{"type":"narrate","text":"saying so."},{"type":"narrate","text":"She opens the door in her cardigan, looks at the sacks, and looks at you, and then says the"},{"type":"narrate","text":"thing that settles the whole day, which is not about the coal."},{"type":"say","who":"her","text":"Are you not stopping for a cup, then."},{"type":"jump","to":"ending_the_door"}],"ending_the_door":[{"type":"narrate","text":"She leaves the sacks where they are and takes you through to the kitchen instead, and there is a"},{"type":"narrate","text":"cup and there is a chair, and the coal gets carried up the entry an hour later by the two of you"},{"type":"narrate","text":"together with her holding the torch and calling the turns."},{"type":"narrate","text":"Which is not the arrangement. The arrangement is thirty-one inches and eleven steps and a man on"},{"type":"narrate","text":"his own, and it exists because the coal house was built at the top of the entry in 1903 and"},{"type":"narrate","text":"somebody has to get the coal up there, and none of that is a reason to refuse a cup of tea from"},{"type":"narrate","text":"a woman who has been on this round since before you had it."},{"type":"narrate","text":"The van is at the mouth of the entry with the tailgate down and the fog on it, and the street is"},{"type":"narrate","text":"quiet, and you are in a kitchen at ten past five on a Thursday in December being asked about"},{"type":"narrate","text":"your knee."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
