<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Water Line</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

higher than it was in March."},{"type":"narrate","text":"You drew it yourself, the first year, at knee height because knee height seemed like a lot. It is at your chest"},{"type":"narrate","text":"now. The room is twenty metres of shelving and eleven of it is above the line."},{"type":"narrate","text":"The rule is simple and everyone knows it: what is above the line goes up, what is below it stays, and the water"},{"type":"narrate","text":"is not sentimental."},{"type":"choice","text":"Start at the far end. Work backwards, the way you always do.","to":"far_end"},{"type":"choice","text":"Start at the near end, where the reading room ledgers are.","to":"near_end"},{"type":"choice","text":"Stand still a moment and look at the line.","to":"look"}],"look":[{"type":"narrate","text":"It is only chalk. You know that. You drew it with a piece of chalk you took from the reading room and never"},{"type":"narrate","text":"returned, and it has been redrawn by you every spring for nineteen years, and the shelf it was first drawn"},{"type":"narrate","text":"against was moved up a floor in 2009."},{"type":"narrate","text":"You are the only person left who has seen every version of it."},{"type":"choice","text":"Start at the far end.","to":"far_end"},{"type":"choice","text":"Start at the near end.","to":"near_end"}],"far_end":[{"type":"narrate","text":"The far end is the municipal record: rate books, deeds, the planning minutes. Heavy, dull, irreplaceable in the"},{"type":"narrate","text":"way that a foundation is irreplaceable."},{"type":"narrate","text":"The first three shelves are below the line. You take the rate books down and stack them on the trolley, and it"},{"type":"narrate","text":"takes an hour, and your back says something about it that you do not repeat."},{"type":"narrate","text":"There is a box at the back that is not municipal. It has no call number. It has your handwriting on it."},{"type":"choice","text":"Open it.","to":"box"},{"type":"choice","text":"Leave it. It is not on the list, and the list is how you have kept this place dry for nineteen years.","to":"leave_box"}],"near_end":[{"type":"narrate","text":"The near end is the reading room ledgers: who came in, what they asked for, what they found. Nineteen years of"},{"type":"narrate","text":"other people's curiosity in nineteen volumes."},{"type":"narrate","text":"They are all below the line."},{"type":"narrate","text":"Nobody has asked for a reading room ledger in eleven years. The last entry in the last volume is a woman asking"},{"type":"narrate","text":"for a map of the harbour and writing, at the bottom, *thank you, this is the one my father used*."},{"type":"choice","text":"Take the ledgers. They are the only record of anyone having wanted anything.","to":"ledgers"},{"type":"choice","text":"Leave them and go to the far end, where the records are.","to":"far_end"}],"box":[{"type":"narrate","text":"The box is light. Inside is a card index, handwritten, one card per person who has ever used the reading room,"},{"type":"narrate","text":"with a line under each name: what they were looking for."},{"type":"narrate","text":"Your own card is in it. The line under your name says: *the water line. How far it has come.*"},{"type":"narrate","text":"You do not remember writing that. You do remember the first year, and the chalk, and thinking that knee height"},{"type":"narrate","text":"seemed like a lot."},{"type":"choice","text":"Put the box on the trolley.","to":"box_up"},{"type":"choice","text":"Put it back and take the rate books.","to":"far_end"}],"box_up":[{"type":"flag","name":"saved_personal","delta":"true"},{"type":"narrate","text":"The box goes on top of the rate books, which is the wrong order by every rule you have, and the right one by the"},{"type":"narrate","text":"only rule that is going to matter tonight."},{"type":"narrate","text":"You take it up the stairs and set it on the new shelf and go back down for the next load."},{"type":"jump","to":"flood"}],"leave_box":[{"type":"narrate","text":"You put the box back where it was. It is not on the list. The list is how you have kept this place dry."},{"type":"narrate","text":"You take the rate books up instead, and the box stays below the line, and you tell yourself the water will not"},{"type":"narrate","text":"come that far this year."},{"type":"jump","to":"flood"}],"ledgers":[{"type":"flag","name":"saved_personal","delta":"true"},{"type":"narrate","text":"You take the ledgers. All nineteen, which is two trips, and on the second trip the water is already at the bottom"},{"type":"narrate","text":"step and the chalk line is behind you."},{"type":"jump","to":"flood"}],"flood":[{"type":"narrate","text":"The pump in the sub-basement fails at 4:10, which you know because the light changes when it does."},{"type":"narrate","text":"The water comes up the room the way water does: without hurry, and without any interest in what it is covering."},{"type":"choice","text":"Go back down. There is time for one more shelf.","to":"one_more"},{"type":"choice","text":"Stay at the top of the stairs and let it finish.","to":"watch"}],"one_more":[{"type":"narrate","text":"The water is at your knees on the bottom flight and it is cold in a way that makes the decision for you about"},{"type":"narrate","text":"how far you are willing to go."},{"type":"narrate","text":"There is one shelf within reach. It is the planning minutes: dull, heavy, and the thing a city actually needs"},{"type":"narrate","text":"when it wants to prove that a street was a street."},{"type":"choice","text":"Take the planning minutes.","to":"ending_official"},{"type":"choice","text":"Take the box with your handwriting on it, if it is still there.","to":"ending_personal"},{"type":"choice","text":"Take nothing. Go up.","to":"ending_nothing"}],"watch":[{"type":"narrate","text":"You sit on the top step with your feet on the third one down, which stays dry, and you watch the line go under."},{"type":"narrate","text":"It takes eleven minutes. You have never actually watched it happen before. It is the first year you have not"},{"type":"narrate","text":"been carrying something."},{"type":"choice","text":"Go back down. There is time for one more shelf.","to":"one_more"},{"type":"choice","text":"Let it be finished.","to":"ending_nothing"}],"ending_official":[{"type":"flag","name":"ending","delta":"official"},{"type":"narrate","text":"You carry the planning minutes up four flights, one volume at a time, and you are still carrying them when the"},{"type":"narrate","text":"water reaches the ceiling of the room they came from."},{"type":"narrate","text":"The city will ask for those volumes in forty years and they will be here, dry, and the person who asks will not"},{"type":"narrate","text":"know your name and will not need to."},{"type":"narrate","text":"You sleep in the reading room because the stairs are wet. In the morning the chalk line is under nine metres of"},{"type":"narrate","text":"water and you draw a new one, higher, on a wall that is still dry."},{"type":"jump","to":"ending"}],"ending_personal":[{"type":"flag","name":"ending","delta":"personal"},{"type":"narrate","text":"The box is still on its shelf when you get there, floating, lid down, and you go in up to your shoulders to get"},{"type":"narrate","text":"it and the cards inside are ruined."},{"type":"narrate","text":"You take it up anyway. You spread the cards out on the reading room table and they dry badly and the ink runs,"},{"type":"narrate","text":"and the one line you wanted is the one that goes first."},{"type":"narrate","text":"But you have the box, and the handwriting on it is still your handwriting, and that turns out to be the part you"},{"type":"narrate","text":"were actually carrying."},{"type":"jump","to":"ending"}],"ending_nothing":[{"type":"flag","name":"ending","delta":"nothing"},{"type":"narrate","text":"You go up. You do not take anything."},{"type":"narrate","text":"At the top of the stairs you sit down and let the building do what it has been going to do since the first"},{"type":"narrate","text":"spring, and you think about the fact that a line is not a wall and never was, and that you have spent nineteen"},{"type":"narrate","text":"years being very good at the part of the job that could be done with chalk."},{"type":"narrate","text":"In the morning you will be the only person who knows what was on the shelves, and that is a kind of archive too."},{"type":"jump","to":"ending"}],"ending":[{"type":"narrate","text":"The water stops at the second floor, which nobody expected, and stays there."},{"type":"narrate","text":"In the spring you go back down with a new piece of chalk. The room is a room again: eleven metres of silt, and"},{"type":"narrate","text":"shelving standing in it like a burned forest, and light coming down through the reading room windows in a way it"},{"type":"narrate","text":"never did when there were books in front of them."},{"type":"narrate","text":"You draw the line where the water stopped, because that is where it stopped, and you write the date beside it,"},{"type":"narrate","text":"because that is what you do."},{"type":"choice","text":"Bring the box back down with you.","to":"ending_box","cond":"saved_personal"},{"type":"choice","text":"Read the date out loud, to nobody.","to":"ending_date"},{"type":"choice","text":"Admit that you are the archive.","to":"ending_self","cond":"ending == \"nothing\""},{"type":"choice","text":"Start bringing things back down.","to":"END"}],"ending_box":[{"type":"narrate","text":"The box dried badly and the cards are stuck together in one block, and the line you wanted is the line that went"},{"type":"narrate","text":"first."},{"type":"narrate","text":"You put it on the shelf it came off. It is above the new line now, which is the only thing you were ever"},{"type":"narrate","text":"actually asked to do."},{"type":"choice","text":"Read the date out loud, to nobody.","to":"ending_date"},{"type":"choice","text":"Start bringing things back down.","to":"END"}],"ending_date":[{"type":"narrate","text":"\"Fourth of April.\""},{"type":"narrate","text":"It sounds like nothing. It sounds like a date. Nineteen years of this and the whole job has been: notice where"},{"type":"narrate","text":"the water is, and say so, and do it again next year."},{"type":"choice","text":"Start bringing things back down.","to":"END"}],"ending_self":[{"type":"narrate","text":"You took nothing, and you are the only copy."},{"type":"narrate","text":"Every rate book, every planning minute, every card in that box: the water has them now, and what it does not"},{"type":"narrate","text":"have is the nineteen years of knowing where they were. That is not a comfort and it is not a substitute. It is"},{"type":"narrate","text":"just what is true."},{"type":"narrate","text":"You draw the line and you write the date and you go up, and next spring you come down again, and you are the"},{"type":"narrate","text":"archive, and you had better last."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
