<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Lookout</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

xt":"has been arguing about for three years, and it is exactly the kind of place"},{"type":"narrate","text":"that burns hot and fast and cannot be walked into."},{"type":"narrate","text":"Four miles is under an hour for a ground crew and about eleven minutes for the"},{"type":"narrate","text":"helicopter, which is at the airstrip with nobody in it until Friday."},{"type":"choice","text":"Call it in now, before you have talked yourself out of it.","to":"call_it"},{"type":"choice","text":"Take the glass and look properly first.","to":"watch_it"}],"watch_it":[{"type":"narrate","text":"You take the glass and you find it again and you hold it, and you do the"},{"type":"narrate","text":"arithmetic you have done four times before: how much smoke, how fast, how much"},{"type":"narrate","text":"of the day is left, how far the nearest water is."},{"type":"narrate","text":"It is going straight up, which is what it does when there is no wind on it yet,"},{"type":"narrate","text":"and it is getting thicker at the base, which is what it does when it is"},{"type":"narrate","text":"working its way down into the duff."},{"type":"narrate","text":"Nine minutes of watching tells you everything that four minutes would have,"},{"type":"narrate","text":"which is the whole of what a lookout is for and also the whole of the risk."},{"type":"choice","text":"Radio it in with the column height and the drift.","to":"call_it"},{"type":"choice","text":"Sit on it until the half-hour check.","to":"wait_for_check"}],"wait_for_check":[{"type":"say","who":"The 17","text":"50 check comes at 17:50."},{"type":"say","who":"base","text":"Lookout, base."},{"type":"say","who":"you","text":"Smoke in the north-east quadrant, four miles, beetle-kill stand. It is"},{"type":"narrate","text":"going up and it is getting wider at the base."},{"type":"say","who":"base","text":"Copy. We'll have somebody look at it in the morning."},{"type":"say","who":"you","text":"In the morning it will be a hundred acres."},{"type":"say","who":"base","text":"It'll be whatever it is. There's nobody to send tonight."},{"type":"narrate","text":"You put the radio down. You have done your job and you have written it down,"},{"type":"narrate","text":"and the district will have a line in a file that says the lookout reported"},{"type":"say","who":"smoke at 17","text":"50 on the day it started."},{"type":"flag","name":"called_late","delta":"true"},{"type":"jump","to":"the_night"}],"call_it":[{"type":"say","who":"you","text":"Base, Lookout. I have smoke in the north-east quadrant, approximately four"},{"type":"narrate","text":"miles, in the beetle-kill stand. Column is going vertical and widening at the"},{"type":"narrate","text":"base. Requesting a ground crew and the helicopter."},{"type":"narrate","text":"There is a pause that is longer than the radio needs."},{"type":"say","who":"base","text":"Lookout, that's the fourth time you've called one of those in from that"},{"type":"narrate","text":"chair."},{"type":"say","who":"you","text":"It is."},{"type":"say","who":"base","text":"Copy. Ground crew rolling, ETA fifty minutes."},{"type":"flag","name":"called_early","delta":"true"},{"type":"jump","to":"the_night"}],"the_night":[{"type":"bg","name":"west_hall"},{"type":"say","who":"The light goes at 20","text":"10 and you do the last sweep by torch, which is not"},{"type":"narrate","text":"required and which you have never missed."},{"type":"narrate","text":"The smoke is still there. It is not bigger, which means the crew found it, and"},{"type":"narrate","text":"it is not gone, which means they are still on it."},{"type":"say","who":"At 21","text":"30 the radio brings a voice you do not know, from the crew, which is not"},{"type":"narrate","text":"how it usually goes - the district passes things on and the lookout hears about"},{"type":"narrate","text":"it a week later in a summary."},{"type":"say","who":"crew","text":"Lookout. We've got it at about two acres. We're going to be here all"},{"type":"narrate","text":"night."},{"type":"say","who":"you","text":"Copy."},{"type":"say","who":"crew","text":"They said to say thanks. They said you're the one who calls them in from"},{"type":"narrate","text":"that chair."},{"type":"choice","text":"It was going up and widening. That's all.","to":"modesty"},{"type":"choice","text":"Somebody has to be up here when it starts.","to":"plainly"}],"modesty":[{"type":"say","who":"you","text":"It was going up and widening. That's all."},{"type":"say","who":"crew","text":"That's all it ever is."},{"type":"narrate","text":"You write the time down. Temperature nine, wind dropping, smoke visible,"},{"type":"narrate","text":"crews on scene. You write it in the same handwriting you have used for eleven"},{"type":"narrate","text":"summers, and you close the book, and you sit in the chair for another hour"},{"type":"narrate","text":"because the tower is the only place you can see the glow."},{"type":"jump","to":"the_morning"}],"plainly":[{"type":"say","who":"you","text":"Somebody has to be up here when it starts."},{"type":"say","who":"crew","text":"Yes. Somebody does."},{"type":"narrate","text":"You write the time down. Temperature nine, wind dropping, smoke visible, crews"},{"type":"narrate","text":"on scene. It is the fourth line like it in eleven years and it is the first one"},{"type":"narrate","text":"you have ever written knowing the names of the people on the other end."},{"type":"jump","to":"the_morning"}],"the_morning":[{"type":"bg","name":"west_hall"},{"type":"say","who":"At 06","text":"00 base does the morning check, which is the district supervisor, which"},{"type":"narrate","text":"means it is a Thursday."},{"type":"say","who":"base","text":"Lookout. Status?"},{"type":"choice","text":"Give the numbers.","to":"numbers"},{"type":"choice","text":"Say what it was like.","to":"say_what","cond":"called_early"},{"type":"choice","text":"Say what it cost.","to":"say_cost","cond":"called_late"}],"numbers":[{"type":"say","who":"you","text":"Temperature four, wind calm, visibility twenty miles. Two acres, crews on"},{"type":"narrate","text":"scene, no structures. Nothing else to report."},{"type":"say","who":"base","text":"Copy. Good work."},{"type":"narrate","text":"You write it down, which makes it true in the way that only a written thing is."},{"type":"jump","to":"close_early"}],"say_what":[{"type":"say","who":"you","text":"It was going straight up when I found it, and by the time I had the glass"},{"type":"narrate","text":"on it, it was widening at the base. It took nine minutes to be sure."},{"type":"say","who":"base","text":"And you called it in at 17:29."},{"type":"say","who":"you","text":"I did."},{"type":"say","who":"base","text":"That's the earliest call from that chair in nine years. I looked it up."},{"type":"narrate","text":"You do not tell him you nearly waited. There is nothing in the log about the"},{"type":"narrate","text":"nine minutes, and the log is the record."},{"type":"jump","to":"close_early"}],"say_cost":[{"type":"say","who":"you","text":"It was four miles out at 17:20 and I called it at 17:50. In the morning it"},{"type":"narrate","text":"is going to be whatever it is."},{"type":"say","who":"base","text":"It's two acres. It stayed small."},{"type":"say","who":"you","text":"It stayed small because somebody got lucky with the wind, not because"},{"type":"narrate","text":"somebody got up here fast."},{"type":"say","who":"base","text":"That's not what the file says."},{"type":"say","who":"you","text":"I know what the file says. I wrote it."},{"type":"jump","to":"close_late"}],"close_early":[{"type":"narrate","text":"You close the book at the end of the shift and you put it on the shelf with the"},{"type":"narrate","text":"others, and the shelf is eleven books long, and the newest one has a line in it"},{"type":"narrate","text":"that says smoke reported 17:29."},{"type":"narrate","text":"The helicopter comes on Friday and does not get used."},{"type":"narrate","text":"You are back in the chair on Saturday."}],"close_late":[{"type":"narrate","text":"You close the book at the end of the shift and you put it on the shelf with the"},{"type":"narrate","text":"others, and the shelf is eleven books long, and the newest one has a line in it"},{"type":"narrate","text":"that says smoke reported 17:50."},{"type":"narrate","text":"The helicopter comes on Friday and does not get used, and the crew goes home,"},{"type":"narrate","text":"and the district writes a summary that says the fire was held at two acres."},{"type":"narrate","text":"You are back in the chair on Saturday, because somebody has to be up here when"},{"type":"narrate","text":"it starts, and because you have never once been sure that it was you."}]}};

function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
