<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Ninety Days</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

. That is the rule and it is a good rule, because it means you never have to decide anything: you"},{"type":"narrate","text":"write the date in the book and the date decides for you. Today is disposal day for everything logged in July."},{"type":"narrate","text":"The book is open at July. You have read it already, the way you read it every quarter, and now you do the part"},{"type":"narrate","text":"that is not in the rule, which is picking each thing up one last time."},{"type":"choice","text":"A single shoe, size six, off the 07:40.","to":"shoe","cond":"!s_shoe"},{"type":"choice","text":"A tin of paint, unopened, with the receipt still taped to it.","to":"paint","cond":"!s_paint"},{"type":"choice","text":"A phone, dead, with four hundred unread messages on it.","to":"phone","cond":"!s_phone"},{"type":"choice","text":"A passport, expired four years.","to":"passport","cond":"!s_passport"},{"type":"choice","text":"A jar of marmalade, homemade, labelled in biro.","to":"marmalade","cond":"!s_marmalade"},{"type":"choice","text":"That is everything.","to":"shelf","cond":"seen \u003e= 3"}],"shoe":[{"type":"flag","name":"seen","delta":"+1"},{"type":"flag","name":"s_shoe","delta":"true"},{"type":"narrate","text":"A single shoe. Left on the 07:40, which is the 07:40 to the coast, and somebody got off at the coast with one"},{"type":"narrate","text":"shoe and did not notice, or noticed and did not care, or was in no state to notice either way."},{"type":"narrate","text":"Size six. Worn through at the outside of the heel, which is how people walk when they are carrying something on"},{"type":"narrate","text":"that side. You have thought about that more than the shoe deserves."},{"type":"choice","text":"Put it back.","to":"office"}],"paint":[{"type":"flag","name":"seen","delta":"+1"},{"type":"flag","name":"s_paint","delta":"true"},{"type":"narrate","text":"One litre of a colour called Weathered Copper, unopened, with the receipt still taped to the tin and the date on"},{"type":"narrate","text":"the receipt four days before it was handed in."},{"type":"narrate","text":"Somebody bought paint, carried it onto a bus, and then had a week in which they did not need it. You do not know"},{"type":"narrate","text":"what happened in that week and you never will, and the tin is not going to tell you, and you have decided that"},{"type":"narrate","text":"this is the most honest object on the shelf."},{"type":"choice","text":"Put it back.","to":"office"}],"phone":[{"type":"flag","name":"seen","delta":"+1"},{"type":"flag","name":"s_phone","delta":"true"},{"type":"narrate","text":"It is dead and it will not charge. Four hundred unread messages, which you know because the lock screen still"},{"type":"narrate","text":"shows the count, and the count is the only thing on it that still works."},{"type":"narrate","text":"Four hundred. You have watched that number for ninety days and it has not gone up, and you have decided that"},{"type":"narrate","text":"this is because nobody is sending them any more rather than because nobody is receiving them, and you are aware"},{"type":"narrate","text":"that you have no evidence for this at all."},{"type":"choice","text":"Put it back.","to":"office"}],"passport":[{"type":"flag","name":"seen","delta":"+1"},{"type":"flag","name":"s_passport","delta":"true"},{"type":"narrate","text":"Expired four years ago, which means it was already expired when it was handed in, which means somebody carried an"},{"type":"narrate","text":"expired passport around with them and then lost it and then did not come back for it."},{"type":"narrate","text":"There is a photograph in it of a person who is twelve years younger than the person who lost it. You look at the"},{"type":"narrate","text":"photograph for slightly longer than you look at the others."},{"type":"choice","text":"Put it back.","to":"office"}],"marmalade":[{"type":"flag","name":"seen","delta":"+1"},{"type":"flag","name":"s_marmalade","delta":"true"},{"type":"narrate","text":"A jar of marmalade, homemade, labelled in biro with a date and a name and the word SEVILLE. It is the only thing"},{"type":"narrate","text":"on the shelf that somebody made."},{"type":"narrate","text":"It has been here eighty-eight days. You have thought about the marmalade more than any of it, because a jar of"},{"type":"narrate","text":"something you made is not the sort of thing you leave on a bus by accident, and because it is the one item on the"},{"type":"narrate","text":"shelf that was clearly meant for somebody."},{"type":"choice","text":"Put it back.","to":"office"}],"shelf":[{"type":"narrate","text":"There is one more thing on the shelf and it is not in the book, because it was logged before the book."},{"type":"narrate","text":"A suitcase. Eleven years ago, the first week you had this job, handed in off a service that does not run any more."},{"type":"narrate","text":"You wrote it on a page of a different book and then the book changed and it did not get carried over, and so it"},{"type":"narrate","text":"has never had a date, and so it has never come up for disposal, and so it has been on that shelf for eleven years"},{"type":"narrate","text":"while everything around it came and went."},{"type":"narrate","text":"You have never opened it. You have thought about opening it roughly once a quarter for eleven years."},{"type":"choice","text":"Open it.","to":"open"},{"type":"choice","text":"Put it in the skip with the rest.","to":"dispose"},{"type":"choice","text":"Write today's date on it and give it ninety days.","to":"keep"}],"open":[{"type":"bg","name":"lost_office_open"},{"type":"narrate","text":"The catches are stiff and the first one takes a thumbnail with it."},{"type":"say","who":"Inside","text":"a man's coat, folded, in a plastic bag that has gone brittle. A paperback with a cracked spine and a"},{"type":"narrate","text":"bus ticket for a bookmark, on a page about a third of the way in. A photograph of two people on a beach, in"},{"type":"narrate","text":"colour, which dates it. A tin of boiled sweets with three sweets left."},{"type":"narrate","text":"That is all. There is nothing in it that explains anything, and no name anywhere, and the coat is not your size"},{"type":"narrate","text":"and never was."},{"type":"narrate","text":"You sit with it for a while. Then you fold the coat back the way it was, because it was folded well and you are"},{"type":"narrate","text":"not going to be the one who ruined it."},{"type":"choice","text":"","to":"end_open"}],"dispose":[{"type":"bg","name":"lost_office_open"},{"type":"narrate","text":"You carry the suitcase out to the skip and put it in, and it lands on the paint and the shoe and the rest of July,"},{"type":"narrate","text":"and it makes a sound that is much smaller than eleven years should make."},{"type":"narrate","text":"Back at the desk you write the line in the book that you have been not writing for eleven years: date, description,"},{"type":"narrate","text":"disposed. The book is complete now. Every object in this office has a date next to it and there is nothing left on"},{"type":"narrate","text":"the shelf, and the job is exactly what it is supposed to be, which is a job with no decisions in it."},{"type":"choice","text":"","to":"end_dispose"}],"keep":[{"type":"narrate","text":"You write today's date on the tag and hang it back on the handle, which means it goes on the shelf for another"},{"type":"narrate","text":"ninety days, which means in ninety days you will stand here again and do this again."},{"type":"narrate","text":"It is not a decision. It is the absence of one, and you know that, and you have made it eleven years running,"},{"type":"narrate","text":"and you have decided that a person is allowed one thing they do not decide about."},{"type":"choice","text":"","to":"end_keep"}],"end_open":[{"type":"bg","name":"lost_office_open"},{"type":"narrate","text":"The skip goes at four. The shoe goes, and the paint, and the phone with its four hundred messages, and the"},{"type":"narrate","text":"expired passport, and the marmalade, which is the only one you hesitate over and which you put in anyway because"},{"type":"narrate","text":"eighty-eight days is eighty-eight days."},{"type":"narrate","text":"The suitcase does not go, because it is open now and you cannot put an open suitcase in a skip, and by the time"},{"type":"narrate","text":"you have worked out what to do with it the van has gone."},{"type":"narrate","text":"So it is on the shelf, open, with a folded coat and a paperback and a photograph in it, and it will be there"},{"type":"narrate","text":"tomorrow, and you have decided that this is fine. It is the first thing anybody ever handed in to you and it is"},{"type":"narrate","text":"still here, and that is not the same as it being unclaimed."}],"end_dispose":[{"type":"narrate","text":"The skip goes at four and it is not full, which is unusual, and the driver says so, and you say yes."},{"type":"narrate","text":"Back at the desk the shelf is empty and the book has six lines in it and the office is a desk, a shelf and a book"},{"type":"narrate","text":"with nothing on the shelf and nothing left to decide. You will log something new on Thursday, probably, because"},{"type":"narrate","text":"people leave things on buses at a rate that has not changed in eleven years."},{"type":"narrate","text":"You go home at five. On the way out you check the shelf, which you have never done before, and there is nothing"},{"type":"narrate","text":"on it, which you knew."}],"end_keep":[{"type":"narrate","text":"The skip goes at four without the suitcase in it, and the driver does not say anything, because he has never"},{"type":"narrate","text":"known what is on your shelf and is not going to start now."},{"type":"narrate","text":"It has ninety days. In ninety days it will come up, and you will stand here with the book open, and you will"},{"type":"narrate","text":"write another date on it, and that will be the twelfth time."},{"type":"narrate","text":"You have decided that this is not a failure. The rule exists so that somebody else's things do not become your"},{"type":"narrate","text":"problem, and the suitcase is not a problem. It is just a thing that is here, on a shelf, in a room you are in"},{"type":"narrate","text":"every day, and you have decided that a room you are in every day is allowed to have one thing in it that you"},{"type":"narrate","text":"have not finished with."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
