<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>the camera cannot see the room you are in</title>
<style>
  :root{--bg:#05060A; --ink:#D8D8E4; --dim:#7A7A90; --red:#E94560; --gold:#FFD700;
        --panel:#0B0D14; --line:#1E2030}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:14px 14px 22px;min-height:100%;
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;letter-spacing:.10em;color:var(--red);margin:2px 0 0;text-transform:uppercase}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .nightrow{display:block;width:100%;text-align:left;padding:12px 14px;margin:0 0 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;cursor:pointer}
  .nightrow:active{background:#16171F}
  .nightrow .t{display:block;font-size:16px}
  .nightrow .n{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .help{color:var(--dim);font-size:12px;line-height:1.6}
  #band{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}
  #night{color:var(--red);letter-spacing:.06em}
  #stage{position:relative;background:#02030A;border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  #readout{font-size:13px;letter-spacing:.04em;color:var(--gold);min-height:20px}
  #readout small{color:var(--dim);letter-spacing:0}
  #strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #rooms{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px}
  #strip button,#rooms button{padding:12px 6px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  #rooms button{padding:10px 2px;font-size:11px}
  #strip button:active,#rooms button:active{background:#16171F}
  #strip button[disabled],#rooms button[disabled]{opacity:.35}
  #strip button.on,#rooms button.on{border-color:var(--red);color:var(--red)}
  #over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:6px;background:rgba(2,3,10,.86);text-align:center;padding:18px}
  #over h2{margin:0;font-size:22px;color:var(--red);letter-spacing:.06em}
  #over p{margin:0;color:var(--dim);font-size:13px}
  #over button{margin-top:10px;padding:10px 18px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <h1>Five Nights at Freddy's 5</h1>
  <p class="sub">Five rooms in a line, one monitor -- and the camera cannot see the room you are in.</p>

  <div id="select"></div>

  <div id="band" hidden>
    <span id="night"></span>
    <span id="clock"></span>
    <span id="shocks"></span>
  </div>

  <div id="stage" hidden>
    <canvas id="cv" width="720" height="300"></canvas>
    <div id="over" hidden>
      <h2 id="overtitle"></h2>
      <p id="overtext"></p>
      <button id="again">Again</button>
    </div>
  </div>

  <div id="readout" hidden></div>

  <div id="strip" hidden>
    <button id="wl">WALK LEFT</button>
    <button id="wr">WALK RIGHT</button>
    <button id="sh">SHOCK</button>
    <button id="md">MONITOR DOWN</button>
  </div>
  <div id="rooms" hidden></div>

  <p class="help" id="help"></p>
</div>

// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


/**
 * FNAF5's cue names, on the shared palette.
 *
 * Ballora is blind and follows sound, so the cue is not atmosphere
 * here -- it is the only channel that says something is next door, and the
 * engine's own note records what happened when it was missing: "the bot walked
 * straight into the room she had just left, on every seed, because the only
 * channel that says 'something is next door' was never fired."
 */
function sfx(cue) {

  // The cues this engine builds from a name at runtime.
  if (cue.startsWith("here_")) { voice("knock"); return; }
  if (cue.startsWith("step_")) { voice("step"); return; }
  if (cue.startsWith("lost_")) { voice("breath"); return; }
  switch (cue) {
    case "camera_down": voice("click"); break;
    case "camera_up": voice("click"); break;
    case "chime_6am": voice("chime"); break;
    case "footstep": voice("footstep"); break;
    case "scare_sprint": voice("scream"); break;
    case "shock": voice("clank"); break;
    case "static": voice("static"); break;
    default: break;
  }
}

// --------------------------------------------------------------- the night
//
// A faithful port of aside.games.fnaf5.engine.Game. Five rooms in a line,
// one monitor, and three things in the dark that differ in what they
// follow: Freddy follows you (standing still kills you), Ballora follows
// sound (moving kills you), Foxy follows the camera (looking kills you).
// The camera cannot see the room you are in, so the information and the
// safety are the same resource.
//
// java.util.Random is reproduced in BigInt so the same seed deals the same
// night in both builds. This engine seeds Random directly rather than
// through the splitmix64 finalizer the later games use.

function RNG(seed) {
  this.s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
}
RNG.prototype.next = function (bits) {
  this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
  return Number(this.s >> BigInt(48 - bits));
};
RNG.prototype.nextDouble = function () {
  return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
};
RNG.prototype.nextInt = function (bound) {
  let r = this.next(31);
  const m = bound - 1;
  if ((bound & m) === 0) return Number((BigInt(bound) * BigInt(r)) >> 31n);
  let u = r;
  for (;;) {
    r = u % bound;
    if (((u - r + m) | 0) >= 0) return r;
    u = this.next(31);
  }
};

// The art, as data URIs in the content. Loaded once, and the drawing waits
// for them rather than drawing a half-built frame.
const IMG = {};
let artReady = false;
{
  const keys = Object.keys(C.assets);
  let left = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) artReady = true; };
    im.src = C.assets[k];
    IMG[k] = im;
  }
}

const HOUR_SECONDS = C.hourSeconds, NIGHT_HOURS = C.nightHours;
const MOVE_TIME = C.moveTime, SHOCK_TIME = C.shockTime, SHOCK_FLASH = C.shockFlash;
const SOUND_MEMORY = C.soundMemory;
const BALLORA_PATIENCE = C.balloraPatience, BALLORA_GRACE = C.balloraGrace;
const BALLORA_COOLDOWN = C.balloraCooldown, CUE_EVERY = C.cueEvery;
const FEED_PACE = C.feedPace, STILL_WINDOW = C.stillWindow, STILL_PACE = C.stillPace;
const INTERVAL_JITTER = C.intervalJitter;
const ROOMS = ["PARTS", "BALLORA", "CONTROL", "CIRCUS", "AUDITORIUM"];
const START = "CONTROL";

const index = (w) => ROOMS.indexOf(w);
const at = (i) => (i < 0 || i >= ROOMS.length ? null : ROOMS[i]);
const distance = (a, b) => Math.abs(index(a) - index(b));
const adjacent = (a, b) => distance(a, b) === 1;
function stepToward(from, to) {
  if (from === null || to === null) return from;
  const d = Math.sign(index(to) - index(from));
  const next = at(index(from) + d);
  return next === null ? from : next;
}
function stepAway(from, away) {
  if (from === null) return null;
  let d = Math.sign(index(from) - index(away));
  if (d === 0) d = index(from) * 2 < ROOMS.length ? 1 : -1;
  let next = at(index(from) + d);
  if (next === null) next = at(index(from) - d);
  return next === null ? from : next;
}

function Threat(name, key, rule, home, pace, start) {
  this.name = name; this.key = key; this.rule = rule; this.home = home; this.pace = pace;
  this.room = start; this.timer = 0; this.wait = 0; this.hereFor = 0;
  this.sinceCue = 0; this.visits = 0; this.deaf = 0;
}
Threat.prototype.inYourRoom = function (g) { return this.room === g.where; };
Threat.prototype.nextDoor = function (g) { return adjacent(this.room, g.where); };
Threat.prototype.update = function (dt, g) {
  if (g.status !== "PLAYING") return;
  if (this.deaf > 0) this.deaf = Math.max(0, this.deaf - dt);

  if (this.inYourRoom(g)) {
    this.hereFor += dt;
    this.sinceCue += dt;
    if (this.sinceCue >= CUE_EVERY) { this.sinceCue = 0; g.cue("here_" + this.key); }

    // Ballora is blind: only sound tells her anything, so if nothing has
    // made a noise for as long as she has been here she gives up.
    if (this.rule === "SOUND"
        && this.hereFor >= BALLORA_PATIENCE && g.soundAge >= BALLORA_PATIENCE) {
      g.cue("lost_" + this.key);
      this.room = stepAway(this.room, g.where);
      this.deaf = BALLORA_COOLDOWN;
      this.hereFor = 0; this.sinceCue = 0; this.timer = 0;
      if (this.nextDoor(g)) { g.cue("step_" + this.key); g.heardNextDoor(this); }
      else g.cue("footstep");
      return;
    }

    if (this.hereFor >= g.graceFor(this)) { g.jumpscare(this); return; }
    // No return here: a thing in your room is still walking. Foxy turns
    // the moment the camera moves, and that is his counter.
  } else {
    this.hereFor = 0;
  }

  this.timer += dt;
  if (this.wait <= 0) this.wait = g.interval(this);
  if (this.timer < this.wait) return;
  this.timer = 0;
  this.wait = g.interval(this) * (1.0 + INTERVAL_JITTER * (g.rng.nextDouble() - 0.5));

  // The die. A failed roll is a hesitation, not a retreat.
  if (g.rng.nextInt(20) >= g.aiLevel()) return;
  this.step(g);
};
Threat.prototype.step = function (g) {
  const target = this.target(g);
  if (target === null) return;
  const next = stepToward(this.room, target);
  if (next === this.room) return;
  this.room = next;
  if (this.inYourRoom(g)) {
    this.hereFor = 0; this.sinceCue = 0; this.visits++;
    g.cue("here_" + this.key); g.arrived(this);
  } else if (this.nextDoor(g)) {
    g.cue("step_" + this.key); g.heardNextDoor(this);
  } else {
    g.cue("footstep");
  }
};
Threat.prototype.target = function (g) {
  if (this.rule === "PURSUIT") return g.where;
  if (this.rule === "ATTENTION") {
    if (!g.monitorOn || g.camera === null) return null;
    return this.room === g.camera ? g.where : g.camera;
  }
  return (this.deaf > 0 || g.soundAge > SOUND_MEMORY) ? null : g.lastSound;
};
Threat.prototype.banished = function (to) {
  this.room = to; this.timer = 0; this.hereFor = 0; this.sinceCue = 0;
};

function Game(night, seed) {
  this.night = night;
  this.rng = new RNG(seed);
  this.time = 0; this.hour = 0;
  this.where = START; this.heading = null;
  this.busy = 0; this.busyTotal = 0; this.shockT = 0;
  this.monitorOn = true; this.camera = "AUDITORIUM";
  this.soundAge = 999; this.lastSound = START; this.sounds = 0;
  this.heardAge = 999; this.heardKey = null; this.heardAt = null;
  this.shocks = C.shockAllowance[Math.min(night - 1, 4)];
  this.shocksUsed = 0; this.wastedShocks = 0;
  this.status = "PLAYING"; this.killer = null;
  this.arrivals = 0; this.moves = 0; this.stillTime = 0; this.cameraSwitches = 0;
  this.lastArrival = null;
  this.cues = [];
  this.threats = [
    new Threat("Ballora", "ballora", "SOUND", "BALLORA", 1.60, "BALLORA"),
    new Threat("Funtime Foxy", "foxy", "ATTENTION", "AUDITORIUM", 0.95, "AUDITORIUM"),
    new Threat("Funtime Freddy", "freddy", "PURSUIT", "PARTS", this.freddyPace(), "PARTS")
  ];
}
Game.prototype.aiLevel = function () { return C.aiLevel[Math.min(this.night - 1, 4)]; };
Game.prototype.baseInterval = function () { return C.baseInterval[Math.min(this.night - 1, 4)]; };
Game.prototype.freddyPace = function () { return C.freddyPace[Math.min(this.night - 1, 4)]; };
Game.prototype.grace = function () { return C.grace[Math.min(this.night - 1, 4)]; };
Game.prototype.graceFor = function (t) {
  return (t !== null && t.rule === "SOUND") ? BALLORA_GRACE : this.grace();
};
Game.prototype.interval = function (t) {
  let base = this.baseInterval() / t.pace;
  if (t.rule === "ATTENTION" && this.monitorOn) base /= FEED_PACE;
  if (t.rule === "PURSUIT" && this.stillTime >= STILL_WINDOW) base /= STILL_PACE;
  return base;
};
Game.prototype.clock = function () {
  const h = Math.min(this.hour, 6);
  return h === 0 ? "12 AM" : (h < 6 ? h + " AM" : "6 AM");
};
Game.prototype.cue = function (n) { this.cues.push(n); };
Game.prototype.drain = function () { const c = this.cues; this.cues = []; return c; };
Game.prototype.makeSound = function (at) { this.lastSound = at; this.soundAge = 0; this.sounds++; };
Game.prototype.heardNextDoor = function (t) { this.heardKey = t.key; this.heardAt = t.room; this.heardAge = 0; };
Game.prototype.arrived = function (t) { this.lastArrival = t; this.arrivals++; };
Game.prototype.jumpscare = function (t) {
  if (this.status !== "PLAYING") return;
  this.status = "JUMPSCARED"; this.killer = t.name; this.cue("scare_sprint");
};
Game.prototype.occupied = function () {
  for (const t of this.threats) if (t.inYourRoom(this)) return true;
  return false;
};
Game.prototype.standingWith = function () {
  for (const t of this.threats) if (t.inYourRoom(this)) return t;
  return null;
};
Game.prototype.standingIn = function (w) {
  for (const t of this.threats) if (t.room === w) return t;
  return null;
};
Game.prototype.nextDoor = function () {
  for (const t of this.threats) if (t.nextDoor(this)) return true;
  return false;
};
Game.prototype.view = function () { return this.monitorOn ? this.camera : null; };

Game.prototype.update = function (dt) {
  if (this.status !== "PLAYING") return;
  this.time += dt;
  this.hour = Math.floor(this.time / HOUR_SECONDS);
  if (this.hour >= NIGHT_HOURS) { this.status = "SURVIVED"; this.cue("chime_6am"); return; }

  this.soundAge += dt;
  this.heardAge += dt;
  this.stillTime += dt;

  if (this.busy > 0) {
    this.busy -= dt;
    if (this.busy <= 0) {
      this.busy = 0;
      if (this.heading !== null) this.arrive();
    }
  }
  if (this.shockT > 0) this.shockT = Math.max(0, this.shockT - dt);

  for (const t of this.threats) {
    t.update(dt, this);
    if (this.status !== "PLAYING") return;
  }
};

Game.prototype.arrive = function () {
  this.where = this.heading;
  this.heading = null;
  this.moves++;
  this.stillTime = 0;
  // You walked into the picture, so there is no picture any more.
  if (this.camera === this.where) { this.camera = null; this.cue("static"); }
};

Game.prototype.moving = function () { return this.heading !== null; };
Game.prototype.canShock = function () {
  return this.status === "PLAYING" && this.busy <= 0 && this.shocks > 0;
};
Game.prototype.step = function (direction) {
  if (this.status !== "PLAYING") return false;
  if (this.busy > 0) return false;
  const dest = at(index(this.where) + direction);
  if (dest === null) return false;
  this.heading = dest;
  this.busy = MOVE_TIME; this.busyTotal = MOVE_TIME;
  this.makeSound(dest);
  this.cue("footstep");
  return true;
};
Game.prototype.watch = function (room) {
  if (this.status !== "PLAYING") return false;
  if (room === null || room === this.where) return false;
  if (this.monitorOn && this.camera === room) return false;
  this.monitorOn = true; this.camera = room; this.cameraSwitches++;
  this.cue("camera_up");
  // Foxy turns to follow the feed the moment the feed moves.
  for (const t of this.threats) if (t.rule === "ATTENTION") t.timer = this.interval(t);
  return true;
};
Game.prototype.monitorDown = function () {
  if (this.status !== "PLAYING") return false;
  if (!this.monitorOn) return false;
  this.monitorOn = false;
  this.cue("camera_down");
  return true;
};
Game.prototype.farEnd = function () {
  return distance(this.where, ROOMS[0]) >= distance(this.where, ROOMS[ROOMS.length - 1])
    ? ROOMS[0] : ROOMS[ROOMS.length - 1];
};
Game.prototype.shock = function () {
  if (!this.canShock()) return false;
  this.shocks--; this.shocksUsed++;
  this.busy = SHOCK_TIME; this.busyTotal = SHOCK_TIME; this.shockT = SHOCK_FLASH;
  this.makeSound(this.where);
  this.cue("shock");
  let found = false;
  for (const t of this.threats) {
    if (t.room !== this.where) continue;
    // Only the pursuer. The shock is one answer, not three.
    if (t.rule !== "PURSUIT") continue;
    found = true;
    t.banished(this.farEnd());
  }
  if (!found) this.wastedShocks++;
  return found;
};

// --------------------------------------------------------------- the building

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const BOX = (() => {
  const out = {};
  for (let i = 0; i < ROOMS.length; i++) out[ROOMS[i]] = [14 + i * 140, 60, 128, 170];
  return out;
})();

function drawBuilding(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);

  // The stage is the room the monitor is on, or the thing standing in the
  // room with you -- which is the one fact the camera cannot give you,
  // because the camera cannot see the room you are in.
  const withYou = g.standingWith();
  const view = g.view();
  const ROOM_H = 300;

  if (withYou) {
    const key = "here:" + withYou.key;
    if (IMG[key] && IMG[key].complete && IMG[key].naturalWidth) {
      cx.drawImage(IMG[key], 0, 0, W, ROOM_H);
    } else {
      cx.fillStyle = "#0A0C14"; cx.fillRect(0, 0, W, ROOM_H);
    }
    cx.fillStyle = "rgba(233,69,96,0.18)"; cx.fillRect(0, 0, W, ROOM_H);
    cx.fillStyle = "#E94560"; cx.font = "16px Arial"; cx.textAlign = "center";
    cx.fillText(withYou.name + " IS IN HERE", W / 2, ROOM_H - 18);
  } else if (view !== null) {
    const key = "room:" + view;
    if (IMG[key] && IMG[key].complete && IMG[key].naturalWidth) {
      cx.drawImage(IMG[key], 0, 0, W, ROOM_H);
    } else {
      cx.fillStyle = "#0A0C14"; cx.fillRect(0, 0, W, ROOM_H);
    }
    const t = g.standingIn(view);
    if (t) {
      cx.fillStyle = "rgba(233,69,96,0.75)";
      cx.beginPath();
      cx.ellipse(W / 2, ROOM_H * 0.62, 40, 62, 0, 0, Math.PI * 2);
      cx.fill();
      cx.fillStyle = "#FFD700"; cx.font = "14px Arial"; cx.textAlign = "center";
      cx.fillText(t.name, W / 2, ROOM_H - 18);
    }
    cx.fillStyle = "rgba(2,3,10,0.35)"; cx.fillRect(0, 0, W, 22);
    cx.fillStyle = "#FFD700"; cx.font = "13px Arial"; cx.textAlign = "left";
    cx.fillText("CAM " + C.roomTag[view], 10, 16);
  } else {
    cx.fillStyle = "#0A0C14"; cx.fillRect(0, 0, W, ROOM_H);
    cx.fillStyle = "#3A3A4E"; cx.font = "15px Arial"; cx.textAlign = "center";
    cx.fillText(g.monitorOn ? "no feed -- the camera was pointed where you are" : "monitor down",
            W / 2, ROOM_H / 2);
  }

  // The building, as a strip: five rooms, and where you are in it. This is
  // the shape of the game and it has to stay legible even when the stage is
  // a photograph.
  const y = ROOM_H + 24;
  const bw = (W - 40) / ROOMS.length;
  for (let i = 0; i < ROOMS.length; i++) {
    const w = ROOMS[i];
    const x = 20 + i * bw;
    const here = g.where === w;
    const going = g.heading === w;
    cx.fillStyle = here ? "#2A0E16" : "#0A0C14";
    cx.fillRect(x + 2, y, bw - 4, 62);
    cx.strokeStyle = here ? "#E94560" : (going ? "#6A5A3A" : "#1E2030");
    cx.lineWidth = here ? 3 : 1;
    cx.strokeRect(x + 2, y, bw - 4, 62);
    cx.fillStyle = here ? "#E94560" : "#556070";
    cx.font = "10px Arial"; cx.textAlign = "center";
    const tag = C.roomTag[w];
    cx.fillText(tag.length > 12 ? tag.slice(0, 11) + "\u2026" : tag, x + bw / 2, y + 22);
    if (here) { cx.fillText("YOU", x + bw / 2, y + 42); }
  }

  // The shock, when it fires: the one thing that reaches the room you are in.
  if (g.shockT > 0) {
    cx.fillStyle = "rgba(255,220,150,0.20)";
    cx.fillRect(0, 0, W, ROOM_H);
  }
  cx.strokeStyle = "#12141E"; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(0, H - 30); cx.lineTo(W, H - 30); cx.stroke();
}

/** The face, filling the screen. The one frame the art is for. */
function drawScare(g) {
  const key = "scare:" + (g.killer === "Ballora" ? "ballora"
            : g.killer === "Funtime Foxy" ? "foxy" : "freddy");
  const im = IMG[key];
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  if (im && im.complete && im.naturalWidth) {
    const s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * 1.08;
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    cx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
}

// --------------------------------------------------------------- the page

let g = null, raf = 0, last = 0, heard = "";

function start(night) {
  g = new Game(night, Date.now() & 0xffff);
  heard = "";
  document.getElementById("select").hidden = true;
  document.getElementById("band").hidden = false;
  document.getElementById("stage").hidden = false;
  document.getElementById("readout").hidden = false;
  document.getElementById("strip").hidden = false;
  document.getElementById("rooms").hidden = false;
  document.getElementById("over").hidden = true;
  buildRooms();
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (g) { g.update(dt); cues(); paint(); }
  raf = requestAnimationFrame(loop);
}

function cues() {
  for (const c of g.drain()) {
    sfx(c);
    if (c.startsWith("here_")) {
      heard = "IT IS IN HERE <small>&mdash; " + nameOf(c.slice(5)) + "</small>";
    } else if (c.startsWith("step_")) {
      heard = "ONE ROOM AWAY <small>&mdash; " + nameOf(c.slice(5)) + "</small>";
    } else if (c.startsWith("lost_")) {
      heard = "SHE LOST YOU <small>&mdash; " + nameOf(c.slice(5)) + " has given up</small>";
    } else if (c === "footstep") {
      heard = "A FOOTSTEP <small>&mdash; somewhere in the building</small>";
    } else if (c === "shock") {
      heard = "THE SHOCK <small>&mdash; it only answers the one that follows you</small>";
    } else if (c === "static") {
      heard = "STATIC <small>&mdash; you walked into the picture</small>";
    } else if (c === "scare_sprint") {
      heard = "";
    }
  }
}

function nameOf(key) {
  for (const t of g.threats) if (t.key === key) return t.name;
  return key;
}

function buildRooms() {
  const box = document.getElementById("rooms");
  box.innerHTML = "";
  for (const w of ROOMS) {
    const b = document.createElement("button");
    b.textContent = C.roomTag[w];
    b.onclick = () => g && g.watch(w);
    box.appendChild(b);
  }
}

function paint() {
  if (g.status === "JUMPSCARED") drawScare(g); else drawBuilding(g);
  document.getElementById("night").textContent = "NIGHT " + g.night;
  document.getElementById("clock").textContent = g.clock();
  document.getElementById("shocks").textContent = "SHOCKS " + g.shocks;

  let line = heard;
  if (g.busy > 0) {
    line = (g.busyTotal === SHOCK_TIME ? "SHOCKING" : "WALKING")
      + " <small>&mdash; both hands are busy</small>";
  } else if (g.monitorOn && g.camera === null) {
    line = "NO FEED <small>&mdash; the camera was pointed where you are standing</small>";
  }
  document.getElementById("readout").innerHTML = line;

  const on = g.status === "PLAYING";
  document.getElementById("wl").disabled = !on || g.busy > 0;
  document.getElementById("wr").disabled = !on || g.busy > 0;
  document.getElementById("sh").disabled = !g.canShock();
  document.getElementById("md").disabled = !on || !g.monitorOn;
  const kids = document.getElementById("rooms").children;
  for (let i = 0; i < ROOMS.length; i++) {
    const w = ROOMS[i];
    kids[i].disabled = !on || w === g.where;
    kids[i].className = (g.monitorOn && g.camera === w) ? "on" : "";
  }

  if (g.status !== "PLAYING" && document.getElementById("over").hidden) {
    document.getElementById("over").hidden = false;
    document.getElementById("overtitle").textContent =
      g.status === "SURVIVED" ? "6 AM" : "IT GOT YOU";
    document.getElementById("overtext").textContent =
      g.status === "SURVIVED" ? "Nothing was in the room at six."
                              : g.killer + " was standing in the room with you.";
  }
}

document.getElementById("wl").onclick = () => g && g.step(-1);
document.getElementById("wr").onclick = () => g && g.step(1);
document.getElementById("sh").onclick = () => g && g.shock();
document.getElementById("md").onclick = () => g && g.monitorDown();
document.getElementById("again").onclick = () => { const n = g.night; start(n); };

(function build() {
  const sel = document.getElementById("select");
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.className = "nightrow";
    b.innerHTML = '<span class="t">Night ' + n + "</span>"
      + '<span class="n">' + C.notes[n - 1] + "</span>";
    b.onclick = () => start(n);
    sel.appendChild(b);
  }
  document.getElementById("help").textContent = C.help;
})();
</script>
