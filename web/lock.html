<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Lock</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

2KD1muFofix7LY4XPVyUdtg9lxtje7HpveA98x1OvzYObQZsjO7JxETYZDOsngm+D95M8v9QMNtsMNj4M3a2tvyw/DAnPUqR3dOJCeO7Jbfgx7FhxcLXzc9G2cxRy+4GHtrb6WeI4YPbMuBnpyTzojIa2C4tnge7c3ZDGeLYzZzJeYBLARmE3W5WIFzA/zWhkrlu2s4S1nPotnxfIlUlL3IZi8wNsA4tXMD7kT3PUuSy8QkpKeYMlJfeyZPfh/qCLb1EQfcXKz8yZc/MffNv1K/MfqRsudNi7ldNT9YUXjPGmZkkaOkeIOo1F0dLtCfpKl+8uDDmQ1Ih3fbSjt/yZos2C6P9lDZ3erZXxGvVrPfc3fu4XXMl3LM1OnL/khxbaYzCZMhdQxu/E51hsU9kF4cWzyhBy82C0Or6Lm5l3D7uXOz8Xw8Bfrwmw+/AmVbsnNkln9P/9k="},"missing":[],"passages":{"start":[{"type":"bg","name":"river_jetty"},{"type":"narrate","text":"Eleven minutes a boat, and you have done it eleven thousand times, which is a number you"},{"type":"narrate","text":"worked out one winter and have not repeated to anybody."},{"type":"narrate","text":"The lock is one chamber and four gates."},{"type":"narrate","text":"The hours are on a board by the office: six to eight, twelve to two, five to seven."},{"type":"narrate","text":"Outside those, the gates stay shut, and the water stays where you left it, and that"},{"type":"narrate","text":"is what a schedule is for."},{"type":"jump","to":"the_evening"}],"the_evening":[{"type":"narrate","text":"It is ten past seven. The last boat of the day went down at twenty to, a hire boat"},{"type":"narrate","text":"with six people and a dog, and you have the paddles down and the balance beams"},{"type":"narrate","text":"pulled shut and the office light off."},{"type":"narrate","text":"A boat comes up the cut with its light on. That is not a thing that happens."},{"type":"jump","to":"the_boat"}],"the_boat":[{"type":"narrate","text":"It is a narrowboat, seventy feet of it, and it is coming slowly and it is alone. The"},{"type":"narrate","text":"man on the tiller lifts a hand and says the thing they all say."},{"type":"say","who":"boater","text":"Evening. Am I too late?"},{"type":"narrate","text":"The answer is yes. You have given that answer four times this year and every one of"},{"type":"narrate","text":"them turned round without an argument."},{"type":"jump","to":"the_choice"}],"the_choice":[{"type":"narrate","text":"You are standing at the bottom gate with the windlass in your hand, which you have"},{"type":"narrate","text":"not put down since seven, and the water in the chamber is at the level of the lower"},{"type":"narrate","text":"cut, which is where it should be at this hour."},{"type":"choice","text":"Work him through. Eleven minutes.","to":"work_him"},{"type":"choice","text":"Say no, the way you have said it four times.","to":"say_no"},{"type":"choice","text":"Ask him why he is late.","to":"ask_him"}],"work_him":[{"type":"narrate","text":"You open the top paddles and the water starts and the boat comes in and the man says"},{"type":"narrate","text":"nothing at all, which is unusual, and the dog that is not there is noticeable because"},{"type":"narrate","text":"every hire boat has one."},{"type":"narrate","text":"He is standing on the back deck with both hands on the tiller and he does not look at"},{"type":"narrate","text":"the gates, or at the water, or at you. He looks at the office window, which is dark."},{"type":"jump","to":"the_through"}],"say_no":[{"type":"say","who":"you","text":"You're too late. I'm shut."},{"type":"say","who":"boater","text":"Right."},{"type":"narrate","text":"He does not argue. He puts the tiller over and the bow comes round in the wide part"},{"type":"narrate","text":"and he goes back up the cut the way he came, slow, with the light on, and you stand"},{"type":"narrate","text":"and watch him to the bend because that is what there is to do."},{"type":"jump","to":"ending_refused"}],"ask_him":[{"type":"say","who":"you","text":"You're late."},{"type":"say","who":"boater","text":"I know."},{"type":"say","who":"you","text":"Where are you making for?"},{"type":"say","who":"boater","text":"Anywhere past the lock."},{"type":"narrate","text":"He says it plainly and then, because you have not said no yet, he says the rest."},{"type":"say","who":"boater","text":"I was moored above the bend and there's a man been walking the towpath all"},{"type":"narrate","text":"evening. He hasn't got a boat and he hasn't got a dog and he's stopped at mine twice."},{"type":"jump","to":"the_man"}],"the_man":[{"type":"narrate","text":"You look back up the way he came. The towpath is a pale line and there is nothing on"},{"type":"narrate","text":"it that you can see, and you have worked this cut for nineteen years and you know that"},{"type":"narrate","text":"\"nothing you can see\" at night is a different sentence from \"nothing\"."},{"type":"narrate","text":"You have two things in your hand, which are a windlass and a telephone that works."},{"type":"choice","text":"Work him through and walk up the towpath yourself after.","to":"work_then_walk"},{"type":"choice","text":"Ring the office and let somebody else decide.","to":"ring_office"},{"type":"choice","text":"Work him through and say nothing to anybody.","to":"the_through"}],"work_then_walk":[{"type":"narrate","text":"You work him through. Eleven minutes. He says thank you at the top gate and goes on"},{"type":"narrate","text":"into the dark, and you put the paddles down and shut the gates behind him and take the"},{"type":"narrate","text":"torch off its hook."},{"type":"narrate","text":"The towpath is two miles to the bend. You walk it as far as the bridge with the torch"},{"type":"narrate","text":"on, and there is a coat over the rail that was not there at six, and nothing else, and"},{"type":"narrate","text":"you leave the coat where it is because it is not yours."},{"type":"jump","to":"ending_the_coat"}],"ring_office":[{"type":"bg","name":"closet"},{"type":"narrate","text":"The office closes at five and the phone rings four times and then a man from the"},{"type":"narrate","text":"regional number answers and asks you for the details in the order he has them on his"},{"type":"say","who":"screen","text":"the boat, the registration, the time, the location, the nature of the concern."},{"type":"narrate","text":"You give him all of it in that order, which takes six minutes, and he says somebody"},{"type":"narrate","text":"will be sent out, which is a sentence with no time on it."},{"type":"narrate","text":"The boat has gone by the time you put the phone down. You never got the number."},{"type":"jump","to":"ending_the_number"}],"the_through":[{"type":"narrate","text":"You work him through, eleven minutes, the same as every boat, and he says thank you"},{"type":"narrate","text":"and goes on into the dark towards the next lock, which is six miles and is manned by"},{"type":"narrate","text":"somebody who will be shutting at eight."},{"type":"narrate","text":"You put the paddles down and you shut the gates and you check the balance beams twice,"},{"type":"narrate","text":"which you have not done since the year the ice took the bottom gate."},{"type":"jump","to":"ending_schedule"}],"ending_refused":[{"type":"narrate","text":"You lock the office and walk to the car and the cut is flat and quiet and the light"},{"type":"narrate","text":"that was coming up it is going back down it, and that is the schedule."},{"type":"narrate","text":"You get the boat's number anyway, from the board at the office in the morning, because"},{"type":"narrate","text":"the registration was on the bow and you are good at reading bows. You do not do"},{"type":"narrate","text":"anything with it. It is in the book, which is a thing that has a number in it now, and"},{"type":"narrate","text":"which had nothing in it the day before."}],"ending_the_coat":[{"type":"narrate","text":"The police come to the lock on the Thursday and ask about the coat, and you tell them"},{"type":"narrate","text":"the time you walked it and how far, and the man from the boat rings the office a week"},{"type":"narrate","text":"later to say he got to the next lock and then to a mooring and that it was nothing, or"},{"type":"narrate","text":"that he did not want to say, and you cannot tell which from his voice."},{"type":"narrate","text":"You have worked four more boats through after hours since. Nobody has asked you about"},{"type":"narrate","text":"it. The board by the office still says five to seven, and you are the only person who"},{"type":"narrate","text":"knows what you do with the eleventh hour."}],"ending_the_number":[{"type":"narrate","text":"The regional man rings back in the morning for the boat's number and you do not have"},{"type":"narrate","text":"it, and he writes that down in the words he has for it, which are \"insufficient"},{"type":"narrate","text":"detail\"."},{"type":"narrate","text":"There is a folder with a line in it now that says this, and your name is on the line,"},{"type":"narrate","text":"and the man on the towpath was never mentioned by anybody. You work the boats through"},{"type":"narrate","text":"in the hours on the board and you put the windlass down at seven, and the cut is the"},{"type":"narrate","text":"same as it was, and you have been doing this nineteen years."}],"ending_schedule":[{"type":"narrate","text":"You put the windlass in the office and you drive home with the radio on and it is"},{"type":"narrate","text":"twenty to eight, which is the time you always get home on a Tuesday."},{"type":"narrate","text":"In the morning the water is where you left it and the gates are shut and there is"},{"type":"narrate","text":"nothing on the towpath, and you look anyway, from the car, before you unlock."},{"type":"narrate","text":"The board by the office says six to eight, twelve to two, five to seven, and you wrote"},{"type":"narrate","text":"it out in 2019 and it has never once been wrong."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
