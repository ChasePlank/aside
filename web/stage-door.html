<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Stage Door</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

ZnBkZLe0cLOPvyq82J1KGJ00jDG0fO677p3SYOnReTEBGwC3PP5nqn1GJxYTG0f8AuBqlPx3W7V85vqODGXkwfkmPqG97/wBVHLkOmHra2/cCle6lE8ztaIgX1/KqRxMgEDynWew5XnzmUuo6Sz2gQnPjkiNSMcw+zhSauTYQhCASgkEEcpEILePmuhk1kk/2VvO61PPCMZr/AODyR7lZKdHvI2xe/C6zky9M+M9t7oPR3ZLxmZDNUQ3a0/zfP0XUzMDYmklvqNANWbhdQ1RhodWw9PZaLpIWxPklfWltj4XqwxmMcMst1k52MKOqtubWEelMLy50zIohy53Kk6p1k5E9QbMbwSNyfdPi6Fm5eIMqZ7i527YzyR7/AAueVmV1JtuSyds134RhcwB7/ZwKrkN7X91I5oZMQ5jmBuxFb/umRyaHfB5C4X+V1hiEp96SLFihCEKAQhCAQhCAQhCAQhCAQhCBWuLTYKe6WSQAOeSB2tRoV3TSUY8paXBpIHNKIijRWjBnRR45D2anVQCoOJe8n3Ws5jPTMt+zUIII5QsNBCEIP//Z"},"missing":[],"passages":{"start":[{"type":"bg","name":"backstage"},{"type":"narrate","text":"The stage door is a green door in an alley, and the alley is where the smokers"},{"type":"narrate","text":"go and where the bins are, and in eleven years you have never once used the"},{"type":"narrate","text":"front."},{"type":"narrate","text":"Inside is a desk with a lamp, a telephone that only rings inward, a rack of"},{"type":"narrate","text":"keys on hooks, and the book."},{"type":"narrate","text":"The book is a ledger with a line for every person who comes in: name, time,"},{"type":"narrate","text":"and who they are here to see. You write it in their presence. That is the"},{"type":"narrate","text":"whole rule and it is the only one you have ever needed."},{"type":"narrate","text":"Tonight is the last night. The run closes at eleven and the get-out starts at"},{"type":"narrate","text":"midnight and by Tuesday the door will open onto a building with no show in it."},{"type":"jump","to":"the_book"}],"the_book":[{"type":"narrate","text":"You turn to tonight's page. The list for a closing night is longer than usual:"},{"type":"narrate","text":"the company, the crew, two of the producers, a critic who has been asked to"},{"type":"narrate","text":"come and has come, and somebody's mother."},{"type":"narrate","text":"Halfway down, in the hand of the stage manager, one line is not a name:"},{"type":"narrate","text":"see me about the understudy - R"},{"type":"narrate","text":"You have seen that handwriting on every list for six weeks. You have never"},{"type":"narrate","text":"once been told what it is about."},{"type":"choice","text":"Look at the call sheet on the board.","to":"the_board"},{"type":"choice","text":"Wait. Somebody will come to the door.","to":"the_door"}],"the_board":[{"type":"narrate","text":"The call sheet is pinned by the phone, and it says what call sheets say: half"},{"type":"narrate","text":"hour, beginners, curtain. Somebody has drawn a line through the second cover"},{"type":"narrate","text":"and written *no* beside it, and then, underneath, in pencil, as if to"},{"type":"say","who":"themselves","text":"ask J."},{"type":"narrate","text":"You put your finger on the pencil mark. It is not your handwriting and it is"},{"type":"narrate","text":"not R's."},{"type":"jump","to":"the_door"}],"the_door":[{"type":"narrate","text":"At half an hour the company comes through in the usual order, and you write"},{"type":"narrate","text":"them in as they pass, and they say the things they say."},{"type":"say","who":"danny","text":"Last one, then."},{"type":"say","who":"you","text":"Last one."},{"type":"narrate","text":"The lamp makes the alley outside into a black rectangle with a hand in it"},{"type":"narrate","text":"every few minutes. The book fills. At the bottom of the page there is still"},{"type":"narrate","text":"the line R wrote, and no name beside it."},{"type":"narrate","text":"Then the bell goes, and it is not the company, and it is not the time the"},{"type":"narrate","text":"company comes."},{"type":"jump","to":"she_asks"}],"she_asks":[{"type":"narrate","text":"There is a woman in the doorway with a canvas bag held in both hands."},{"type":"say","who":"woman","text":"I'm not on the list."},{"type":"narrate","text":"You look at the page. She is not on the list."},{"type":"say","who":"woman","text":"I know how it works. I'm not asking you to break it. I'm asking you to"},{"type":"narrate","text":"write me in."},{"type":"say","who":"you","text":"Who are you here to see?"},{"type":"say","who":"woman","text":"Nobody. I was in it."},{"type":"narrate","text":"She says it the way somebody says a thing they have practised in the street."},{"type":"say","who":"woman","text":"Eleven years ago, in this building, in the other production. I was the"},{"type":"narrate","text":"second cover. I never went on. Not once, not for a matinee, not for a warm-up."},{"type":"narrate","text":"I stood in the wings at every performance of that run and I knew every part"},{"type":"narrate","text":"and nobody ever saw me do one line of it."},{"type":"narrate","text":"The bag shifts in her hands. Something in it is heavy and flat."},{"type":"jump","to":"the_choice"}],"the_choice":[{"type":"say","who":"you","text":"Tonight is the last night."},{"type":"say","who":"woman","text":"I know. That's why it has to be tonight."},{"type":"narrate","text":"Behind her, the alley. Behind you, the book, open, with a line at the bottom"},{"type":"narrate","text":"that the stage manager wrote and never explained."},{"type":"choice","text":"Write her in and walk her to the wings.","to":"let_her_in"},{"type":"choice","text":"Keep the rule: no name, no entry.","to":"keep_the_rule"},{"type":"choice","text":"Take the book and find R.","to":"find_r"}],"let_her_in":[{"type":"say","who":"you","text":"Name."},{"type":"narrate","text":"She gives it. You write it, and the time, and in the last column you write"},{"type":"narrate","text":"WINGS, which is not a person, and which you have never written before."},{"type":"narrate","text":"You take her through the pass door and along the back of the set. The house is"},{"type":"narrate","text":"filling up on the other side of the flats, a sound like weather. You leave her"},{"type":"narrate","text":"where the second cover stands, at the corner where you can see the whole stage"},{"type":"narrate","text":"and be seen by nobody."},{"type":"say","who":"woman","text":"Thank you."},{"type":"say","who":"you","text":"Eleven years is a long time to hold a part."},{"type":"say","who":"woman","text":"It was never mine."},{"type":"narrate","text":"She takes the thing out of the bag. It is a script, and it is soft as cloth,"},{"type":"narrate","text":"and the corners of it are gone."},{"type":"jump","to":"ending_wrote_her"}],"keep_the_rule":[{"type":"say","who":"you","text":"I can't. Not without a name on the list, and I'm not allowed to put one"},{"type":"narrate","text":"there."},{"type":"say","who":"woman","text":"You're allowed to write who comes in."},{"type":"say","who":"you","text":"I'm allowed to write who is expected."},{"type":"narrate","text":"For a moment she does not move, and then she puts the bag down on the step"},{"type":"narrate","text":"outside and stands with her hands empty, which is worse."},{"type":"say","who":"woman","text":"I was in it. Eleven years ago. Second cover. I never went on."},{"type":"say","who":"you","text":"I'm sorry."},{"type":"say","who":"woman","text":"So am I."},{"type":"narrate","text":"She goes back up the alley the way she came, and the bins are the only things"},{"type":"narrate","text":"out there, and you close the door and stand in the lamp for a while."},{"type":"jump","to":"ending_the_rule"}],"find_r":[{"type":"narrate","text":"You take the book off the desk and go through the pass door with it under your"},{"type":"narrate","text":"arm, which is a thing you have never done, and you find R by the prompt corner"},{"type":"narrate","text":"with a headset round her neck."},{"type":"say","who":"R","text":"What's wrong?"},{"type":"say","who":"you","text":"There's a woman at the door. She says she was the second cover. Eleven"},{"type":"narrate","text":"years ago."},{"type":"narrate","text":"R looks at the book. Then she looks at the line she wrote herself, and at the"},{"type":"narrate","text":"blank beside it, and something in her face closes like a door."},{"type":"say","who":"R","text":"Second cover in the other production. That was my sister."},{"type":"say","who":"you","text":"Your -"},{"type":"say","who":"R","text":"She covered for me for a whole run and I never missed a night. Nobody ever"},{"type":"narrate","text":"saw her do it. Not the company, not the management, not the critics. And she"},{"type":"narrate","text":"came tonight, and you left her in the alley."},{"type":"say","who":"you","text":"She's still there."},{"type":"say","who":"R","text":"No she isn't."},{"type":"jump","to":"ending_r_was_told"}],"ending_wrote_her":[{"type":"narrate","text":"The house goes dark the way it does, all at once, and the overture starts, and"},{"type":"narrate","text":"for two hours the building is a machine that runs on everybody in it."},{"type":"narrate","text":"You go back to the desk. The book is open where you left it, and the lamp is"},{"type":"narrate","text":"on, and the alley outside is a black rectangle with nobody in it."},{"type":"narrate","text":"When the curtain comes down the noise goes on longer than a curtain call and"},{"type":"narrate","text":"somebody's mother comes through the pass door crying, and the company comes"},{"type":"narrate","text":"out one at a time carrying flowers and cardboard and pieces of the set, and"},{"type":"narrate","text":"you write them all out, and the page fills up, and the last line of it is"},{"type":"narrate","text":"still the one R wrote."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"The book goes in the drawer with the others: eleven years of them, one a year,"},{"type":"narrate","text":"each one a ledger of everybody who ever came through the green door."},{"type":"narrate","text":"In tonight's there is a line in your own hand that says WINGS where a name"},{"type":"narrate","text":"should be, and it is the only lie in the drawer."},{"type":"narrate","text":"You think about that on the way home, and about a part held for eleven years"},{"type":"narrate","text":"by somebody nobody ever saw, and about the fact that the rule was never about"},{"type":"narrate","text":"the book. The book was just how you kept the rule."}],"ending_the_rule":[{"type":"narrate","text":"The house goes dark the way it does, all at once, and the overture starts, and"},{"type":"narrate","text":"for two hours the building is a machine that runs on everybody in it."},{"type":"narrate","text":"You go back to the desk. The book is open where you left it, and the lamp is"},{"type":"narrate","text":"on, and the alley outside is a black rectangle with nobody in it."},{"type":"narrate","text":"When the curtain comes down the noise goes on longer than a curtain call and"},{"type":"narrate","text":"somebody's mother comes through the pass door crying, and the company comes"},{"type":"narrate","text":"out one at a time carrying flowers and cardboard and pieces of the set, and"},{"type":"narrate","text":"you write them all out, and the page fills up, and the last line of it is"},{"type":"narrate","text":"still the one R wrote."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"The book goes in the drawer with the others: eleven years of them, one a year,"},{"type":"narrate","text":"each one a ledger of everybody who ever came through the green door."},{"type":"narrate","text":"Tonight's page is complete and correct and every line of it is true."},{"type":"narrate","text":"You think about that on the way home, and about a woman with a canvas bag who"},{"type":"narrate","text":"had practised the sentence in the street, and about the difference between a"},{"type":"narrate","text":"door and a rule, and you are not sure you would do it again."}],"ending_r_was_told":[{"type":"narrate","text":"The house goes dark the way it does, all at once, and the overture starts, and"},{"type":"narrate","text":"for two hours the building is a machine that runs on everybody in it."},{"type":"narrate","text":"You go back to the desk. The book is open where you left it, and the lamp is"},{"type":"narrate","text":"on, and the alley outside is a black rectangle with nobody in it."},{"type":"narrate","text":"When the curtain comes down the noise goes on longer than a curtain call and"},{"type":"narrate","text":"somebody's mother comes through the pass door crying, and the company comes"},{"type":"narrate","text":"out one at a time carrying flowers and cardboard and pieces of the set, and"},{"type":"narrate","text":"you write them all out, and the page fills up, and the last line of it is"},{"type":"narrate","text":"still the one R wrote."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"At midnight the get-out starts and the alley fills with a lorry and six men"},{"type":"narrate","text":"and a lot of noise, and by two there is no set left, only the marks on the"},{"type":"narrate","text":"floor where it stood."},{"type":"narrate","text":"You take the keys off the hooks and put them in the tin, which is the last"},{"type":"narrate","text":"thing you do on a closing night, and you take the book with you, which is not."},{"type":"narrate","text":"The book goes in the drawer with the others: eleven years of them, one a year,"},{"type":"narrate","text":"each one a ledger of everybody who ever came through the green door."},{"type":"narrate","text":"You told R. R is the only person who could have done anything about it and R"},{"type":"narrate","text":"did nothing about it, and that is the shape the night had, and you write it"},{"type":"narrate","text":"down the way you write everything down, because that is the job."},{"type":"narrate","text":"Under the last line, in the space where the totals go, you put nothing."}]}};

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
