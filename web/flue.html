<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>The Flue</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

ojIa2C4tnge7c3ZDGeLYzZzJeYBLARmE3W5WIFzA/zWhkrlu2s4S1nPotnxfIlUlL3IZi8wNsA4tXMD7kT3PUuSy8QkpKeYMlJfeyZPfh/qCLb1EQfcXKz8yZc/MffNv1K/MfqRsudNi7ldNT9YUXjPGmZkkaOkeIOo1F0dLtCfpKl+8uDDmQ1Ih3fbSjt/yZos2C6P9lDZ3erZXxGvVrPfc3fu4XXMl3LM1OnL/khxbaYzCZMhdQxu/E51hsU9kF4cWzyhBy82C0Or6Lm5l3D7uXOz8Xw8Bfrwmw+/AmVbsnNkln9P/9k="},"missing":[],"passages":{"start":[{"type":"bg","name":"hall_corner"},{"type":"narrate","text":"The house is on the list because it has four chimneys and one of them has not been"},{"type":"narrate","text":"swept since the old man died, which the daughter tells you on the phone, twice."},{"type":"narrate","text":"You have been doing this fourteen years: rods, brush, sheets, the register, and the"},{"type":"narrate","text":"same three sentences said in the same order every time you go into somebody's"},{"type":"narrate","text":"front room."},{"type":"jump","to":"the_sheets"}],"the_sheets":[{"type":"narrate","text":"You put the sheets down before anything else. That is the first sentence. The"},{"type":"narrate","text":"sheets go from the hearth to the door and up over the pictures, and people always"},{"type":"narrate","text":"watch the pictures."},{"type":"say","who":"daughter","text":"Be careful of the -"},{"type":"say","who":"you","text":"They're covered. That's what the sheets are for."},{"type":"narrate","text":"She stands in the doorway with her arms folded, which is how people stand when they have decided to be in the way politely."},{"type":"jump","to":"the_first"}],"the_first":[{"type":"narrate","text":"The first three are straight: front room, back room, the one over the kitchen. Soot"},{"type":"narrate","text":"comes down the way it always does, you take the brush up and bring it down, and the"},{"type":"narrate","text":"daughter says something about her father every time you come out of a room."},{"type":"say","who":"daughter","text":"He did them himself, always. Even when he couldn't get up the ladder."},{"type":"say","who":"daughter","text":"I used to hold the rods."},{"type":"jump","to":"the_landing"}],"the_landing":[{"type":"narrate","text":"The fourth is the bedroom, and the bedroom is the one that has not been done, and"},{"type":"narrate","text":"the flue for it runs up the outside wall behind the cupboard on the landing."},{"type":"narrate","text":"You open the cupboard. It is a cupboard: a hoover, two tins of paint, a box of"},{"type":"narrate","text":"Christmas things, and the register of a man who did his own chimneys in biro on the"},{"type":"narrate","text":"back of a calendar."},{"type":"jump","to":"the_landing_look"}],"the_landing_look":[{"type":"narrate","text":"The calendar is seven years of Wednesdays, and the last entry is in a different"},{"type":"narrate","text":"hand, and it is shorter than the others, and it says *done*, once."},{"type":"choice","text":"Take the calendar down.","to":"take_calendar"},{"type":"choice","text":"Leave it and get on with the bedroom flue.","to":"the_bedroom"},{"type":"choice","text":"Ask her about the calendar.","to":"ask_her"}],"take_calendar":[{"type":"narrate","text":"You take it down. Behind it, in the recess where the flue bends, there is a gap in"},{"type":"narrate","text":"the brick about the size of a fist, and in the gap there is a tobacco tin with a"},{"type":"narrate","text":"rubber band round it."},{"type":"narrate","text":"You have found things up chimneys before. Coins, mostly, and once a set of keys,"},{"type":"narrate","text":"and once a letter that you did not read and handed over folded."},{"type":"jump","to":"the_tin"}],"the_bedroom":[{"type":"narrate","text":"You do the bedroom flue, which is the one that needed doing, and the soot comes"},{"type":"narrate","text":"down black and wet and takes twenty minutes. When you go back out onto the landing"},{"type":"narrate","text":"the cupboard door is open the way you left it and the calendar is still hanging on"},{"type":"narrate","text":"the nail."},{"type":"jump","to":"the_fourth_done"}],"ask_her":[{"type":"say","who":"you","text":"Who wrote the last one?"},{"type":"say","who":"daughter","text":"I did."},{"type":"say","who":"you","text":"It's shorter than the others."},{"type":"say","who":"daughter","text":"It was the last time. I did it with the rods out of the shed because he"},{"type":"narrate","text":"couldn't and he sat on the stairs and told me when to push."},{"type":"flag","name":"asked_her","delta":"+1"},{"type":"jump","to":"the_calendar_answer"}],"the_calendar_answer":[{"type":"narrate","text":"She says it the way people say a thing they have said to themselves a lot."},{"type":"say","who":"daughter","text":"He had me do it in September and he died in February and I have not"},{"type":"narrate","text":"touched it since, and that's why it's on the list, and I know it's daft."},{"type":"say","who":"you","text":"It's not daft. It's a chimney."},{"type":"say","who":"daughter","text":"It's not, though."},{"type":"jump","to":"the_tin_or_the_room"}],"the_tin_or_the_room":[{"type":"narrate","text":"The brush is out of the flue and the sheets are down and the register is filled in"},{"type":"narrate","text":"and this is the part of the job where you decide what you are going to be."},{"type":"choice","text":"Open it in front of her.","to":"the_open"},{"type":"choice","text":"Put it back exactly as it was and finish the job.","to":"ending_left_it"},{"type":"choice","text":"Put it in your bag.","to":"ending_took_it"}],"the_tin":[{"type":"bg","name":"closet"},{"type":"narrate","text":"It is a tobacco tin and it is heavier than a tobacco tin. The band has perished and"},{"type":"narrate","text":"comes off in your fingers and you open it standing in a cupboard on somebody else's"},{"type":"narrate","text":"landing with a brush in your other hand."},{"type":"narrate","text":"Inside there is money, folded, in notes that stopped being printed years ago, and a"},{"type":"narrate","text":"photograph of a woman on a bicycle, and nothing with anybody's name on it."},{"type":"jump","to":"the_decision"}],"the_fourth_done":[{"type":"narrate","text":"You fill the register in at the front door, which is the third sentence, and she"},{"type":"narrate","text":"signs it with her own pen because she did not like the look of yours."},{"type":"say","who":"daughter","text":"He'd have hated anybody doing the bedroom one."},{"type":"say","who":"you","text":"He'd have hated it being black up there more."},{"type":"narrate","text":"She laughs, once, and it is a real one, and then she pays you and you carry the"},{"type":"narrate","text":"rods out to the van and that is the job."}],"the_decision":[{"type":"narrate","text":"Through the wall you can hear the daughter moving around in the kitchen, putting the"},{"type":"narrate","text":"kettle on for somebody who is going to drink it alone."},{"type":"narrate","text":"The tin has been in the brick for a while. Whatever it is, somebody put it there and"},{"type":"narrate","text":"did not tell anybody, and the only person who could have is seven years dead."},{"type":"jump","to":"the_open","cond":"asked_her \u003e= 1"},{"type":"jump","to":"the_quiet_choice"}],"the_quiet_choice":[{"type":"narrate","text":"You could put the tin in your bag. Nobody would know: the cupboard holds a hoover, a"},{"type":"narrate","text":"can of paint and a box of Christmas things, and the calendar goes back on its nail"},{"type":"narrate","text":"over the gap, and the gap is behind the calendar, and the calendar is behind a"},{"type":"narrate","text":"cupboard door on a landing nobody uses."},{"type":"choice","text":"Take it. It is nobody's now.","to":"ending_took_it"},{"type":"choice","text":"Put it back and say nothing to anybody.","to":"ending_left_it"},{"type":"jump","to":"the_open"}],"the_open":[{"type":"narrate","text":"You take it into the kitchen with the sheet still folded over your arm, because"},{"type":"narrate","text":"carrying it in a bag would be a different thing."},{"type":"say","who":"you","text":"I found something up the bedroom flue."},{"type":"say","who":"daughter","text":"What sort of something."},{"type":"say","who":"you","text":"It was in a tin. It's money, and a photograph. I haven't counted it."},{"type":"narrate","text":"She puts the kettle down and does not pick it up again."},{"type":"jump","to":"the_open_answer"}],"the_open_answer":[{"type":"say","who":"daughter","text":"Show me."},{"type":"narrate","text":"You put the tin on the table with the lid off and she looks at the notes for a long"},{"type":"narrate","text":"time without touching them, and then she turns it round to see the photograph and"},{"type":"narrate","text":"makes a noise that is not a word."},{"type":"say","who":"daughter","text":"That's not my mother."},{"type":"say","who":"you","text":"No."},{"type":"say","who":"daughter","text":"That's the woman from the shop. She had that bicycle until I was nineteen."},{"type":"narrate","text":"She sits down at her own kitchen table and you stand there with a brush in your hand"},{"type":"narrate","text":"and neither of you says anything for a while, and then she starts laughing, which is"},{"type":"narrate","text":"how it goes sometimes."},{"type":"say","who":"daughter","text":"He never said a word. Not once, in all of it."},{"type":"jump","to":"ending_told_her"}],"ending_told_her":[{"type":"narrate","text":"You finish the register standing up because she has not offered you a chair, and she"},{"type":"narrate","text":"signs it and pays you and adds twenty pounds that you say is not necessary and she"},{"type":"narrate","text":"says is not for you, and you drive home with the rods in the back."},{"type":"narrate","text":"It is not your money and it was never going to be, and the part you did was carry a"},{"type":"narrate","text":"tin into a kitchen instead of out of it, which is not a thing anybody will ever ask"},{"type":"narrate","text":"you about."},{"type":"narrate","text":"You do the same three sentences at the next house and you mean them a little more"},{"type":"narrate","text":"than you did, which is the whole of what fourteen years has taught you."}],"ending_left_it":[{"type":"narrate","text":"You put the band back on as best it will go and put the tin back in the recess and"},{"type":"narrate","text":"the calendar back on its nail, and you do the bedroom flue, and you fill the register"},{"type":"narrate","text":"in at the front door."},{"type":"say","who":"daughter","text":"He'd have hated anybody doing the bedroom one."},{"type":"say","who":"you","text":"He'd have hated it being black up there more."},{"type":"narrate","text":"She laughs once. You carry the rods out to the van and drive home and never mention"},{"type":"narrate","text":"it to anybody, and the tin is still there now, and so is the calendar over it, and"},{"type":"narrate","text":"that is a thing you have decided and will go on deciding."}],"ending_took_it":[{"type":"narrate","text":"It goes in the bag under the sheets. You finish the register standing up, and she"},{"type":"narrate","text":"signs it, and you are home by four with the rods in the back and a tobacco tin in the"},{"type":"narrate","text":"cupboard under your own stairs."},{"type":"narrate","text":"The notes are old but a bank will take them, and you know that because you asked,"},{"type":"narrate","text":"three days later, at a counter in another town, and then did not do it."},{"type":"narrate","text":"It is under your stairs fourteen years later. You have never opened the photograph"},{"type":"narrate","text":"again and you have never thrown the tin away, and you are not sure which of those two"},{"type":"narrate","text":"is the thing you are doing."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
