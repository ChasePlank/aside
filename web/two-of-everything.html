<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Two of Everything</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"bg","name":"kitchen_boxes"},{"type":"narrate","text":"Nell gets there first, which she will mention, and puts the kettle on, which she will also mention."},{"type":"narrate","text":"There are boxes in the kitchen. There were boxes in the kitchen when they were children and there are boxes in"},{"type":"narrate","text":"the kitchen now, and the difference is that these ones have her mother's handwriting on them, and say things"},{"type":"say","who":"like","text":"spoons (good)."},{"type":"narrate","text":"Tom arrives at eleven with a van and an apology. The apology is for being late. The van is for the piano."},{"type":"choice","text":"There's tea.","to":"tea"},{"type":"choice","text":"You brought the van.","to":"van"}],"tea":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"narrate","text":"He takes the tea. He stands in the doorway of the kitchen he grew up in and does not sit down, because every"},{"type":"narrate","text":"chair has something on it."},{"type":"narrate","text":"\"She labelled the spoons,\" he says."},{"type":"narrate","text":"\"She labelled everything. There are two of everything, Tom. Two toasters. Two of the good scissors.\""},{"type":"narrate","text":"\"You know why.\""},{"type":"narrate","text":"\"I know why.\""},{"type":"choice","text":"Say it anyway.","to":"say_it"},{"type":"choice","text":"Don't. Let's start.","to":"loft"}],"van":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"narrate","text":"\"I brought the van,\" he says. \"For the piano.\""},{"type":"narrate","text":"\"You're not taking the piano.\""},{"type":"narrate","text":"\"I'm not taking the piano. I'm taking the opportunity to have brought a van.\""},{"type":"show","who":"nell","pose":"wry","where":"left","key":"nell-wry"},{"type":"narrate","text":"Nell laughs, which surprises both of them, and then they stand there for a moment being pleased about it. Two"},{"type":"narrate","text":"toasters. Two sets of the good scissors. Their mother, who never threw anything away because throwing it away"},{"type":"narrate","text":"would have meant admitting whose it was."},{"type":"choice","text":"Say the thing about the toasters.","to":"say_it"},{"type":"choice","text":"Come on. The loft first.","to":"loft"}],"say_it":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"narrate","text":"\"Dad's,\" Tom says. \"It was all Dad's, and she couldn't throw it out, and she couldn't use it either, so it lived"},{"type":"narrate","text":"in a cupboard for twenty years being his.\""},{"type":"narrate","text":"\"That's not a reason to keep two toasters.\""},{"type":"narrate","text":"\"It's a reason they came in twos.\""},{"type":"narrate","text":"Nell puts her tea down on a box marked *cups (everyday)* and looks at the room the way she looks at a problem at"},{"type":"narrate","text":"work, which is the only way she has ever looked at anything."},{"type":"narrate","text":"\"Right,\" she says. \"Loft.\""},{"type":"choice","text":"Go up to the loft.","to":"loft"}],"loft":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"bg","name":"loft_light"},{"type":"narrate","text":"The loft is hot and full of light and the sort of dust that has opinions."},{"type":"narrate","text":"There are two suitcases. Matching. His and hers, and hers has a label on it with a destination on it that is not"},{"type":"narrate","text":"this house, and the label is forty years old and the handwriting on it is her mother's, young."},{"type":"show","who":"tom","pose":"flat","where":"right","key":"tom-flat"},{"type":"narrate","text":"Tom sits down on the floor of the loft, which he has not done since he was nine."},{"type":"narrate","text":"\"She nearly went,\" he says. \"She had the case packed and a label written and she stayed, and then we got two of"},{"type":"narrate","text":"everything.\""},{"type":"choice","text":"She chose us.","to":"chose"},{"type":"choice","text":"We don't know that. She might have unpacked it a hundred times.","to":"unpacked"}],"chose":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"narrate","text":"\"That's what I tell myself,\" Tom says."},{"type":"show","who":"nell","pose":"warm","where":"left","key":"nell-warm"},{"type":"show","who":"tom","pose":"warm","where":"right","key":"tom-warm"},{"type":"narrate","text":"\"That's what I tell myself too,\" Nell says. \"Which is why it's true.\""},{"type":"narrate","text":"They carry the suitcases down together and put them by the van, and it takes the rest of the day to do the loft,"},{"type":"narrate","text":"and they do not talk about the label again, which is a kind of agreement."},{"type":"choice","text":"At the end of the day.","to":"table"}],"unpacked":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"narrate","text":"\"That is genuinely the worst thing you have ever said to me in a loft,\" Tom says."},{"type":"narrate","text":"\"Probably.\""},{"type":"show","who":"nell","pose":"tired","where":"left","key":"nell-tired"},{"type":"narrate","text":"They laugh, and it is not entirely a joke, and Nell sits down on the floor next to him in the dust in her good"},{"type":"narrate","text":"trousers, which for Nell is close to a confession."},{"type":"narrate","text":"\"If she unpacked it a hundred times,\" she says, \"she packed it a hundred times too.\""},{"type":"choice","text":"At the end of the day.","to":"table"}],"table":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"bg","name":"table_evening"},{"type":"narrate","text":"By six the house is a house. It is astonishing how quickly a house stops being somebody's."},{"type":"narrate","text":"The van is full. There are two boxes on the kitchen table that are not going in it, and both of them know which"},{"type":"narrate","text":"two, and neither of them has moved them."},{"type":"narrate","text":"The label on the case and the second set of scissors. One is going to Tom's and one is going to Nell's, and"},{"type":"narrate","text":"whoever picks first gives the other one away, and they are both standing at the table being extremely casual"},{"type":"narrate","text":"about it."},{"type":"choice","text":"You take the case. You've got the room.","to":"ending_case"},{"type":"choice","text":"I'll take the scissors. You had them last.","to":"ending_scissors"},{"type":"choice","text":"Leave them both on the table and lock up.","to":"ending_table"}],"ending_case":[{"type":"show","who":"nell","pose":"neutral","where":"center","key":"nell-neutral"},{"type":"bg","name":"table_evening"},{"type":"narrate","text":"He takes the case. She does not say anything about it, and she takes nothing at all, which he notices and does not"},{"type":"narrate","text":"mention, and which will be the thing she is angry about in about four years."},{"type":"narrate","text":"Driving away, Nell thinks: the scissors were the better thing to want."},{"type":"narrate","text":"She is still thinking it at the first roundabout, and at the second, and then she stops, because she has just"},{"type":"narrate","text":"understood that he took the case for the same reason she wanted the scissors, which is that neither of them"},{"type":"narrate","text":"wanted the thing itself. They wanted to be the one who was given it."}],"ending_scissors":[{"type":"show","who":"nell","pose":"neutral","where":"left","key":"nell-neutral"},{"type":"show","who":"tom","pose":"neutral","where":"right","key":"tom-neutral"},{"type":"bg","name":"front_step"},{"type":"narrate","text":"She takes the scissors, and she does not even like the scissors, and he knows she does not like the scissors."},{"type":"show","who":"tom","pose":"flat","where":"right","key":"tom-flat"},{"type":"narrate","text":"\"You didn't want those,\" he says, on the step."},{"type":"narrate","text":"\"I wanted them more than you wanted the case.\""},{"type":"narrate","text":"He looks at her. He is the younger one and he has always been able to tell, and she watches him decide not to"},{"type":"narrate","text":"say the true thing, which is that the case was never going to be his and the scissors were never going to be"},{"type":"narrate","text":"hers and their mother had forty years to say what she meant and she labelled the spoons instead."},{"type":"narrate","text":"\"Right,\" he says. \"See you at Christmas.\""},{"type":"narrate","text":"\"See you at Christmas.\""}],"ending_table":[{"type":"bg","name":"table_evening"},{"type":"narrate","text":"They put both boxes back on the table with the same hands at the same time, which takes some doing."},{"type":"narrate","text":"Tom locks up. Nell waits in the van. Neither of them says the obvious thing, which is that the next person"},{"type":"narrate","text":"through that door will be a stranger with a clipboard, and the stranger will take the case and the scissors and"},{"type":"narrate","text":"everything else on the table, and will not know what any of it was for."},{"type":"narrate","text":"What they have done instead is leave the house exactly as their mother kept it: two of everything, neither one"},{"type":"narrate","text":"chosen, nobody admitting whose it was."},{"type":"narrate","text":"It is a terrible way to end and it is also, and both of them know this, the only one that is actually about her."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
