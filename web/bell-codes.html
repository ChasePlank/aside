<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Bell Codes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

omusNjpA/MXslTl5fuEHs2y23A0W59o6hz+jfpAYta0fMKKMs1v3jrGO8QUQUUQMYxe4sTdOARqpNuVZmulxS/HImVHZna7vpBESB2IrfLwFfMXUPA7g+YuTJLywo/oI4AVyaBeswDRClMr0qFwJDgd3pChcw7kXYPRWYJlpSbp5mIy3N59XMGvOkX4v2hYFYpyHiKe6uScq+YAtxLtg7yuVhfM6G2AhdiqOXlhrG6BEwRz7TOblqB7JCIpeIwBsfKICuAGI7F6DERjaL0i20odTSv5UGMaNuIG53XDUsLEXxFz5P1BXjKTTuOHEV/mcw+4VeXDKtdkjlubcRTbDBqX4KntD8xzcZodopKyXjtL8zOoJyGfSYQxmOxI2CJn/lds7jcxd1AsxzMC7T1mPBAOL5IFwrlgz7WX7D0ljtPMFNSBeRPRlumPMprU9JxUf7MzzCqbmGqZx1mtkdFwd8xwwrHMrXRnoCe055jgqPBXecXVubdT3QezMS3Xn+k/9k="},"missing":[],"passages":{"read_again":[{"type":"narrate","text":"You read it again, slowly, the way you would read a diagram you were being asked to check rather than"},{"type":"narrate","text":"follow. It says the same thing, in the same order, with the same dates. You put it back on the board."},{"type":"jump","to":"routine"}],"coat_up":[{"type":"narrate","text":"The coat goes on the hook by the door, where it has gone every night for eleven years, and the hook has"},{"type":"narrate","text":"never once needed anything from you."},{"type":"jump","to":"routine"}],"box":[{"type":"bg","name":"box_interior"},{"type":"narrate","text":"Eighteen lever, forty-one. The frame has been the same colour since before you were born, and the paint has gone"},{"type":"narrate","text":"the way of everything else here, which is to say it has lasted."},{"type":"narrate","text":"You put your bag under the bench and take your coat off, because the box is warm and the night outside is not."},{"type":"narrate","text":"The notice is on the board where notices go. One week. The box closes, the levers are secured, the panel at the"},{"type":"narrate","text":"regional centre takes the line, and the bells go quiet. It has been coming for eleven years. You have read it"},{"type":"narrate","text":"eleven times and it has said the same thing every time, which is a quality you can admire in a notice."},{"type":"choice","text":"Read it again, the way you would read a diagram.","to":"read_again"},{"type":"choice","text":"Hang your coat up. It is a shift like any other.","to":"coat_up"}],"routine":[{"type":"narrate","text":"The line runs north to south through this box and you are the only thing standing between the two."},{"type":"narrate","text":"Two bells from Wrenmoor means a train has entered the section. One from you sends it on. Two-two back from"},{"type":"narrate","text":"Ashfield means it has arrived. Down the board, lever by lever, and you are the hinge."},{"type":"narrate","text":"The book is on the shelf: BELL CODES. Everything in it is four beats or fewer. You have known it since you were"},{"type":"narrate","text":"twenty-three and you could write it out in the dark, and tonight, being the last night, you just might."},{"type":"say","who":"At 02","text":"14 the bell rings."},{"type":"narrate","text":"It is not a code. Five beats, the last one held."},{"type":"narrate","text":"Then nothing."},{"type":"choice","text":"Take the book down. There is no five-beat code in it, and you want to be sure.","to":"book"},{"type":"choice","text":"Answer it. Whatever it was, it wanted an answer.","to":"answer"},{"type":"choice","text":"Ring the regional centre. That is what the book is for.","to":"control"}],"book":[{"type":"bg","name":"box_interior_book"},{"type":"narrate","text":"You take the book down and open it, which you have not done in nine years, and the spine makes a sound like a door"},{"type":"narrate","text":"in another building."},{"type":"narrate","text":"One. Two-one. Two-two. Three. Three-three. Four. Six. There is no five. There is not only no five-beat code -"},{"type":"narrate","text":"there is nothing above four beats anywhere in it, and the last code page is dated 1938 and signed by a man called"},{"type":"narrate","text":"Ackroyd whose handwriting is worse than yours."},{"type":"choice","text":"Read the back pages. It is a short book, and it is the last night.","to":"old_pages"},{"type":"choice","text":"Put it back. The answer is not in a book.","to":"answer"}],"old_pages":[{"type":"narrate","text":"The back pages are the oldest and they are not codes. They are notes, in three hands, about the codes."},{"type":"narrate","text":"Ackroyd, 1938: \"Wrenmoor signs off five. Not in the book. Courtesy.\""},{"type":"narrate","text":"Below it, 1971: \"Wrenmoor still signs off five. Told the inspector it was interference.\""},{"type":"narrate","text":"Below that, in a hand you know because you have seen it on your own timesheets, your predecessor, 1984:"},{"type":"narrate","text":"\"Wrenmoor closed today. He signed off five and then the circuit was cut. Nobody answered. I was on the Ashfield"},{"type":"narrate","text":"side and I heard it and I did not answer, and I have thought about it every shift since.\""},{"type":"narrate","text":"The five beats are a man going home. It has never been in the book, because it was never railway business."},{"type":"narrate","text":"It was manners, and the men kept it, and the book does not record manners."},{"type":"narrate","text":"The tapper is quiet under your hand. Whoever it was, they are waiting."},{"type":"choice","text":"Send it back. Five beats, the last one held.","to":"end_courtesy"},{"type":"choice","text":"Write it in the log and leave it at that.","to":"end_record"}],"answer":[{"type":"narrate","text":"You put your hand on the tapper and send five beats back into the dark, the last one held, the way you would"},{"type":"narrate","text":"acknowledge anything. It is not in the book. It is not a fault either."},{"type":"narrate","text":"There is no reply, and you did not expect one, and that is the whole of it: a thing that had been said and had not"},{"type":"narrate","text":"been answered for forty-two years has now been answered, and you did it without knowing what it meant, which is how"},{"type":"narrate","text":"most courtesies are performed."},{"type":"choice","text":"Sit with it. You will never find out, and it was still the right thing to send.","to":"end_blind"},{"type":"choice","text":"Go back for the book. You would rather know.","to":"book"}],"control":[{"type":"bg","name":"box_interior"},{"type":"narrate","text":"The regional centre answers on the second ring, which is the most impressive thing that has happened tonight."},{"type":"narrate","text":"You give them the time, the section, the beats, and you hear a man write it down."},{"type":"narrate","text":"\"Held, the last one? That is not one of ours. Interference. It is a wet night, you get that.\""},{"type":"narrate","text":"You say yes. It is a wet night. It is in fact the driest night in a month, and you do not say so, because he"},{"type":"narrate","text":"wrote it down and that is the record, and you have been doing this long enough to know the difference between"},{"type":"narrate","text":"being right and being useful."},{"type":"choice","text":"Open the book. You are not finished.","to":"book"},{"type":"choice","text":"Leave it. He wrote it down.","to":"end_record"}],"end_courtesy":[{"type":"bg","name":"box_dawn"},{"type":"narrate","text":"The dark does not answer, and you find that you did not need it to. Someone kept a courtesy for forty-two years"},{"type":"narrate","text":"in the margins of a book that was not for courtesies, and tonight it was answered by a man on the last shift of a"},{"type":"narrate","text":"box that is closing, which is the kind of handover the railway has always actually been made of."},{"type":"narrate","text":"The light comes up the way it does, grey from the east and then ordinary. The first train of the morning takes"},{"type":"narrate","text":"the section and you send it on with one bell, and Ashfield answers two-two."},{"type":"narrate","text":"You write the five beats in the log before you go, so the record has them, because the record is what there will"},{"type":"narrate","text":"be. The book stays on the shelf. It is railway property."}],"end_record":[{"type":"bg","name":"box_dawn"},{"type":"narrate","text":"The log has one line in it that is not like the others. You write the time, and the beats, and then the word"},{"type":"narrate","text":"the book uses for a thing you cannot place: UNIDENTIFIED."},{"type":"say","who":"At 05","text":"40 the light comes up. The first train takes the section and you send it on with one bell, and Ashfield"},{"type":"narrate","text":"answers two-two, and the line is the line again."},{"type":"narrate","text":"Somewhere in the archive there is now a page with five beats on it and no explanation, and in forty years somebody"},{"type":"narrate","text":"will find it and wonder, which is the closest thing to being remembered that a signal box has ever managed."}],"end_blind":[{"type":"bg","name":"box_dawn"},{"type":"narrate","text":"You sit with your hand on the tapper and the line doing nothing, which is the job: you are the thing that knows"},{"type":"narrate","text":"where the trains are, and for four hours there are no trains, and you know exactly where they are."},{"type":"say","who":"At 05","text":"40 the light comes up. The first train takes the section and you send it on with one bell, and Ashfield"},{"type":"narrate","text":"answers two-two."},{"type":"narrate","text":"You will never know what it was. It was answered, and it was answered by somebody who did not know what he was"},{"type":"narrate","text":"answering, and you have decided that this does not make it less of an answer."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
</body>
</html>
