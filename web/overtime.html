<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a09">
<title>Overtime</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d0a09; color: #e8e4dc;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #bar { position: fixed; top: 0; left: 0; height: 3px; background: #c4622b; width: 0;
         transition: width .25s; z-index: 5; }
  /* A phone VN is a fixed frame with a scrolling script under it, not a
     document with a picture in it. So the page itself does not scroll: the
     stage holds the top, the log is the only thing that moves, and the choices
     sit at the bottom where a thumb already is. The stage is the desktop's
     1280x720 frame at 16:9 -- the same frame, so the same three zones and the
     same floor line, and a room that is framed the way the room was drawn
     rather than cropped to a phone's idea of a picture. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #stage, #place, #log, #choices, #hint { width: 100%; max-width: 760px; margin: 0 auto; }
  #stage { flex: 0 0 auto; position: relative; overflow: hidden; background: #101018;
           aspect-ratio: 16 / 9; max-height: 46dvh; border-bottom: 1px solid #241d19; }
  /* contain, not cover, and anchored to the bottom. On a phone the stage is
     exactly 16:9 so the two are the same thing; on a laptop the height cap
     makes the stage wider than the room, and cover would answer that by
     cropping the top and bottom off the room. A letterbox keeps the whole
     frame and keeps the figures standing on the image's floor line. */
  #bg { position: absolute; inset: 0; background-size: contain;
        background-position: center bottom; background-repeat: no-repeat; }
  #cast { position: absolute; inset: 0; }
  #cast img { position: absolute; bottom: 1.9%; height: 91.7%; width: auto;
              transform: translateX(-50%); transition: opacity .18s; }
  #place { flex: 0 0 auto; padding: 11px 20px 0; font-size: 12px; letter-spacing: .14em;
           text-transform: uppercase; color: #8a7f70; min-height: 15px; }
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
         padding: 8px 20px 0; -webkit-overflow-scrolling: touch; }
  #log p { margin: 0 0 14px; }
  #log .say { color: #e8e4dc; }
  #log .who { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
              color: #c4622b; margin-bottom: 3px; }
  #log .narrate { color: #b3aa9c; font-style: italic; }
  #log .old { opacity: .38; }
  #choices { flex: 0 0 auto; padding: 0 20px 6px; max-height: 42dvh; overflow-y: auto; }
  button {
    display: block; width: 100%; margin: 0 0 10px; padding: 15px 16px;
    background: #1c1614; color: #e8e4dc; border: 1px solid #3a2f28; border-radius: 10px;
    font: inherit; text-align: left; cursor: pointer;
  }
  button:hover { border-color: #c4622b; }
  #hint { flex: 0 0 auto; padding: 0 20px 16px; color: #6e655a; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #bar, #cast img { transition: none; } }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="bg"></div><div id="cast"></div></div>
<div id="place"></div>
<div id="log"></div>
<div id="choices"></div>
<div id="hint">tap anywhere to continue</div>
<script>
// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


// A tap makes a click. The stories are the two builds whose desktop versions
// carry music rather than cues, so this is not a mechanic -- but the page is a
// still frame with a script under it, and a tap that makes no sound reads as a
// tap that did not land. The same one line the ten verb games carry.
document.body.addEventListener('pointerdown', () => voice('click'));

ype":"say","who":"monty","text":"It is a chair."},{"type":"say","who":"monty (tired)","text":"She would have laughed at you for saying that."},{"type":"flag","name":"asked_about_her","delta":"true"},{"type":"hide","who":"monty"},{"type":"jump","to":"n1_hall"}],"n1_silence":[{"type":"flag","name":"aff_monty","delta":"+2"},{"type":"flag","name":"let_quiet_stand","delta":"true"},{"type":"say","who":"monty","text":"..."},{"type":"say","who":"monty","text":"Huh."},{"type":"say","who":"monty (quiet)","text":"Most of them fill the quiet. You did not."},{"type":"hide","who":"monty"},{"type":"jump","to":"n1_hall"}],"n1_hall":[{"type":"bg","name":"west_hall"},{"type":"narrate","text":"The west hall runs long and dark and smells faintly of birthday cake."},{"type":"narrate","text":"Somewhere behind you the fan keeps turning, and keeps not caring."},{"type":"say","who":"roxanne","text":"I heard the door."},{"type":"show","who":"roxanne","pose":"smirk","where":"center","key":"roxanne-smirk"},{"type":"say","who":"roxanne","text":"You are not supposed to be back here."},{"type":"choice","text":"Neither are you.","to":"n1_banter"},{"type":"choice","text":"I am doing my rounds.","to":"n1_rounds"},{"type":"choice","text":"I know. I will go.","to":"n1_retreat"}],"n1_banter":[{"type":"flag","name":"aff_roxy","delta":"+2"},{"type":"say","who":"roxanne (laughs)","text":"No. I am not."},{"type":"say","who":"roxanne","text":"But I have been here longer, so I win."},{"type":"show","who":"roxanne","pose":"warm","where":"center","key":"roxanne-warm"},{"type":"say","who":"roxanne (warm)","text":"...You are not scared of me."},{"type":"say","who":"roxanne","text":"That is either brave or stupid and I have not decided which."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n1_cove"}],"n1_rounds":[{"type":"flag","name":"aff_roxy","delta":"+1"},{"type":"say","who":"roxanne","text":"Rounds. Sure."},{"type":"say","who":"roxanne (flat)","text":"You know what I do on my rounds? I check that you are still breathing."},{"type":"say","who":"roxanne","text":"Nobody asks me to. There is just nothing else to do at three in the morning."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n1_cove"}],"n1_retreat":[{"type":"flag","name":"aff_roxy","delta":"-1"},{"type":"say","who":"roxanne","text":"Good."},{"type":"say","who":"roxanne (cold)","text":"Keep walking."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n1_cove_cold"}],"n1_cove":[{"type":"bg","name":"cove"},{"type":"narrate","text":"The curtain is drawn, and something behind it is being very still."},{"type":"narrate","text":"You get the feeling it has been practising."},{"type":"say","who":"freddy","text":"Hm."},{"type":"show","who":"freddy","pose":"idle","where":"right","key":"freddy-idle"},{"type":"say","who":"freddy","text":"You can hear me. That is further than most get."},{"type":"choice","text":"I can hear you.","to":"n1_hear"},{"type":"choice","text":"Who are you?","to":"n1_name"},{"type":"choice","text":"What is this place?","to":"n1_place"}],"n1_hear":[{"type":"flag","name":"aff_freddy","delta":"+2"},{"type":"flag","name":"listened","delta":"+1"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy (warm)","text":"Then stay a minute."},{"type":"say","who":"freddy","text":"That is all anybody has ever wanted, you know. A minute, and someone actually listening."},{"type":"jump","to":"n1_offer"}],"n1_name":[{"type":"say","who":"freddy","text":"A longer answer than you have time for."},{"type":"say","who":"freddy (wry)","text":"Ask me again once you have done a week. You will have earned it."},{"type":"jump","to":"n1_offer"}],"n1_place":[{"type":"flag","name":"listened","delta":"+1"},{"type":"say","who":"freddy","text":"A restaurant that closes at nine."},{"type":"say","who":"freddy","text":"And then stays open. For us. Only for us."},{"type":"say","who":"freddy (wry)","text":"Nobody has ever explained what we are supposed to be doing in here."},{"type":"jump","to":"n1_offer"}],"n1_offer":[{"type":"say","who":"freddy","text":"There is a song that plays when the power dies."},{"type":"say","who":"freddy","text":"I do not choose it. I am just the one standing there when it stops."},{"type":"say","who":"freddy","text":"Chica is in the kitchen. She would like you, probably."},{"type":"say","who":"freddy","text":"She likes everyone. It is the only thing left that she is allowed to do."},{"type":"hide","who":"freddy"},{"type":"jump","to":"n1_kitchen"}],"n1_kitchen":[{"type":"bg","name":"east_corner"},{"type":"narrate","text":"The east corner is colder than the rest of the building."},{"type":"say","who":"chica","text":"Oh!"},{"type":"show","who":"chica","pose":"neutral","where":"center","key":"chica-neutral"},{"type":"say","who":"chica","text":"You are the new one. Hello. Hi."},{"type":"say","who":"chica (bright)","text":"I am Chica, I do the kitchen, I have done the kitchen for a long time."},{"type":"choice","text":"It is nice to meet you, Chica.","to":"n1_chica_nice"},{"type":"choice","text":"Why are you still working?","to":"n1_chica_why"},{"type":"choice","text":"Just watch her.","to":"n1_chica_watch"}],"n1_chica_nice":[{"type":"flag","name":"aff_chica","delta":"+2"},{"type":"say","who":"chica","text":"..."},{"type":"say","who":"chica (bright)","text":"Nice to meet me. Nice to meet me."},{"type":"say","who":"chica","text":"I will be thinking about that for hours now. That is not a complaint."},{"type":"flag","name":"asked_about_her","delta":"true"},{"type":"jump","to":"n1_end"}],"n1_chica_why":[{"type":"flag","name":"aff_chica","delta":"+1"},{"type":"say","who":"chica","text":"Because the kitchen does not finish."},{"type":"say","who":"chica","text":"I clean it, and then it is dirty again, and then I clean it."},{"type":"say","who":"chica (flat)","text":"It is the only way I know it is still night."},{"type":"jump","to":"n1_end"}],"n1_chica_watch":[{"type":"flag","name":"aff_chica","delta":"-1"},{"type":"flag","name":"let_quiet_stand","delta":"true"},{"type":"say","who":"chica","text":"..."},{"type":"say","who":"chica (small)","text":"You are going to be one of the quiet ones."},{"type":"say","who":"chica","text":"That is alright. I am good at those."},{"type":"jump","to":"n1_end"}],"n1_cove_cold":[{"type":"bg","name":"cove"},{"type":"narrate","text":"The curtain stays shut. You do not knock, and it does not open."},{"type":"narrate","text":"You get the sense that this was a test, and that you failed it politely."},{"type":"jump","to":"n1_end"}],"n1_end":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"The lights come up at six like nothing happened at all."},{"type":"narrate","text":"Everything in the building is exactly where it was."},{"type":"jump","to":"n1_dawn_check"}],"n1_dawn_check":[{"type":"jump","to":"n1_dawn_good","cond":"listened \u003e= 1 and aff_chica \u003e= 2"},{"type":"jump","to":"n1_dawn_mixed","cond":"aff_monty \u003e= 2 or aff_roxy \u003e= 2"},{"type":"jump","to":"n1_dawn_flat"}],"n1_dawn_good":[{"type":"narrate","text":"You learned a name and used it, which is more than the badge ever did."},{"type":"narrate","text":"The badge says you are employed here. After tonight that is not quite the same word it was."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n2_start"}],"n1_dawn_mixed":[{"type":"narrate","text":"You got a laugh out of one of them and a silence out of another."},{"type":"narrate","text":"It is a start. It is the kind of start that costs somebody something."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n2_start"}],"n1_dawn_flat":[{"type":"narrate","text":"You did your rounds. You checked the doors. You left at six."},{"type":"narrate","text":"Nothing in this building will remember that you were here, and that is the job."},{"type":"jump","to":"n2_start"}],"n2_start":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"Second night. The fan is already running, which means someone turned it on for you."},{"type":"narrate","text":"That is either a courtesy or a habit, and you cannot tell which."},{"type":"jump","to":"n2_monty"}],"n2_monty":[{"type":"bg","name":"dining"},{"type":"show","who":"monty","pose":"neutral","where":"left","key":"monty-neutral"},{"type":"narrate","text":"The dining room is laid out for a party. Paper hats, paper cups, a tablecloth with a stain"},{"type":"narrate","text":"shaped like a hand. Somebody set this up and nobody ever took it down."},{"type":"say","who":"monty","text":"You came back."},{"type":"choice","text":"I said I would.","to":"n2_came_back"},{"type":"choice","text":"I work here.","to":"n2_work"},{"type":"choice","text":"I wanted to.","to":"n2_wanted","cond":"aff_monty \u003e= 2"}],"n2_came_back":[{"type":"flag","name":"aff_monty","delta":"+1"},{"type":"say","who":"monty","text":"People say that."},{"type":"say","who":"monty (tired)","text":"They say it on the way out, mostly."},{"type":"jump","to":"n2_tables"}],"n2_work":[{"type":"flag","name":"aff_monty","delta":"-1"},{"type":"say","who":"monty","text":"Right."},{"type":"say","who":"monty (flat)","text":"Work."},{"type":"jump","to":"n2_tables"}],"n2_wanted":[{"type":"flag","name":"aff_monty","delta":"+2"},{"type":"say","who":"monty","text":"..."},{"type":"say","who":"monty (quiet)","text":"That is a different sentence."},{"type":"say","who":"monty","text":"I do not know what to do with that one."},{"type":"jump","to":"n2_tables"}],"n2_tables":[{"type":"say","who":"monty","text":"This is what it looks like a week after a party."},{"type":"say","who":"monty","text":"Nobody clears it. They just turn the lights off and it is our room instead of theirs."},{"type":"say","who":"monty (flat)","text":"I have eaten nothing. I have been at that table for eleven years."},{"type":"choice","text":"What were you before this?","to":"n2_before"},{"type":"choice","text":"Eleven years.","to":"n2_eleven"},{"type":"choice","text":"Do you want it cleared?","to":"n2_cleared"}],"n2_before":[{"type":"flag","name":"asked_about_her","delta":"true"},{"type":"say","who":"monty","text":"Before this I was not."},{"type":"say","who":"monty","text":"That is the honest answer and you will not like it much."},{"type":"jump","to":"n2_freddy"}],"n2_eleven":[{"type":"flag","name":"aff_monty","delta":"+1"},{"type":"say","who":"monty","text":"Eleven years. Give or take the nights nobody came."},{"type":"say","who":"monty","text":"I stopped counting because the counting was the only thing that moved."},{"type":"jump","to":"n2_freddy"}],"n2_cleared":[{"type":"flag","name":"aff_monty","delta":"+2"},{"type":"say","who":"monty","text":"..."},{"type":"say","who":"monty (quiet)","text":"Nobody has ever asked me that."},{"type":"say","who":"monty","text":"No. I do not want it cleared. It is the last thing they left that says somebody was here."},{"type":"jump","to":"n2_freddy"}],"n2_freddy":[{"type":"bg","name":"cove_open"},{"type":"hide","who":"monty"},{"type":"narrate","text":"The curtain is open. Freddy is standing in front of it rather than behind it,"},{"type":"narrate","text":"which feels like being let into a room."},{"type":"show","who":"freddy","pose":"idle","where":"right","key":"freddy-idle"},{"type":"say","who":"freddy","text":"You are back. That is twice now."},{"type":"choice","text":"Does that matter?","to":"n2_matter"},{"type":"choice","text":"Is that unusual?","to":"n2_unusual"}],"n2_matter":[{"type":"say","who":"freddy","text":"It does to me."},{"type":"say","who":"freddy (warm)","text":"I keep a very small ledger, you know. There is not much in it."},{"type":"jump","to":"n2_ledger"}],"n2_unusual":[{"type":"flag","name":"aff_freddy","delta":"+1"},{"type":"say","who":"freddy","text":"Yes."},{"type":"say","who":"freddy (wry)","text":"People usually have the decency to leave eventually."},{"type":"say","who":"freddy","text":"The last one did not leave. That was worse."},{"type":"jump","to":"n2_ledger"}],"n2_ledger":[{"type":"say","who":"freddy","text":"I have been trying to work out what we are for."},{"type":"say","who":"freddy","text":"Not what we do. We know what we do. We sing, we wave, we serve."},{"type":"say","who":"freddy (wry)","text":"I mean the afterwards. The part nobody wrote down."},{"type":"choice","text":"Do you think there is an afterwards?","to":"n2_afterwards"},{"type":"choice","text":"Maybe there is not one.","to":"n2_none"}],"n2_afterwards":[{"type":"flag","name":"listened","delta":"+1"},{"type":"say","who":"freddy","text":"Something plays a song when the power goes. I do not know who chose it."},{"type":"say","who":"freddy","text":"That is as close as I have got to an answer."},{"type":"jump","to":"n2_roxanne"}],"n2_none":[{"type":"flag","name":"aff_freddy","delta":"-1"},{"type":"say","who":"freddy","text":"Then I have been doing a great deal of thinking about nothing."},{"type":"say","who":"freddy (idle)","text":"I would rather you were wrong."},{"type":"jump","to":"n2_roxanne"}],"n2_roxanne":[{"type":"bg","name":"west_hall"},{"type":"hide","who":"freddy"},{"type":"show","who":"roxanne","pose":"smirk","where":"center","key":"roxanne-smirk"},{"type":"say","who":"roxanne","text":"He does that to everyone. The ledger speech."},{"type":"say","who":"roxanne","text":"I used to think it was for me. It is for whoever is in the room."},{"type":"choice","text":"Was it for her?","to":"n2_her"},{"type":"choice","text":"Are you jealous?","to":"n2_jealous"},{"type":"choice","text":"Say nothing.","to":"n2_her_quiet"}],"n2_her":[{"type":"flag","name":"aff_roxy","delta":"+1"},{"type":"say","who":"roxanne","text":"It was for her, yes."},{"type":"say","who":"roxanne (flat)","text":"She got the whole speech. Twice. Then she stopped coming."},{"type":"jump","to":"n2_who"}],"n2_jealous":[{"type":"flag","name":"aff_roxy","delta":"+2"},{"type":"say","who":"roxanne","text":"..."},{"type":"say","who":"roxanne (laughs)","text":"God. Yes. Obviously yes."},{"type":"show","who":"roxanne","pose":"warm","where":"center","key":"roxanne-warm"},{"type":"say","who":"roxanne (warm)","text":"You are the first one who has asked me a real question."},{"type":"jump","to":"n2_who"}],"n2_her_quiet":[{"type":"flag","name":"aff_roxy","delta":"+1"},{"type":"flag","name":"let_quiet_stand","delta":"true"},{"type":"say","who":"roxanne","text":"You do the quiet thing too."},{"type":"say","who":"roxanne (flat)","text":"He likes it. I have never worked out what to do with it."},{"type":"jump","to":"n2_who"}],"n2_who":[{"type":"narrate","text":"The hall light over the door has a name written on it in marker."},{"type":"narrate","text":"It has been washed over so many times that the letters are only a bruise now."},{"type":"say","who":"roxanne","text":"She was on the door. Then she was not."},{"type":"choice","text":"What was her name?","to":"n2_name"},{"type":"choice","text":"What happened to her?","to":"n2_happened"},{"type":"choice","text":"This is not my business.","to":"n2_business"}],"n2_name":[{"type":"flag","name":"aff_roxy","delta":"+2"},{"type":"flag","name":"knows_her_name","delta":"true"},{"type":"say","who":"roxanne","text":"Nia."},{"type":"say","who":"roxanne (warm)","text":"There. Now you know something about her and I am not the only one holding it."},{"type":"flag","name":"listened","delta":"+1"},{"type":"jump","to":"n2_chica"}],"n2_happened":[{"type":"flag","name":"aff_roxy","delta":"+1"},{"type":"say","who":"roxanne","text":"She finished a shift and did not come back."},{"type":"say","who":"roxanne (flat)","text":"That is all. There is no story. There is just a door with her name on it."},{"type":"jump","to":"n2_chica"}],"n2_business":[{"type":"flag","name":"aff_roxy","delta":"-2"},{"type":"say","who":"roxanne","text":"Oh."},{"type":"say","who":"roxanne (cold)","text":"Right. No. It is not."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n2_chica_noshow"}],"n2_chica":[{"type":"hide","who":"roxanne"},{"type":"bg","name":"east_corner"},{"type":"jump","to":"n2_chica_body"}],"n2_chica_noshow":[{"type":"bg","name":"east_corner"},{"type":"jump","to":"n2_chica_body"}],"n2_chica_body":[{"type":"show","who":"chica","pose":"neutral","where":"center","key":"chica-neutral"},{"type":"say","who":"chica","text":"Hello again."},{"type":"say","who":"chica (bright)","text":"I made you something. It is not a cake. I want to be clear that it is not a cake."},{"type":"choice","text":"What is it?","to":"n2_what"},{"type":"choice","text":"Thank you.","to":"n2_thanks"},{"type":"choice","text":"Don't take it.","to":"n2_decline"}],"n2_what":[{"type":"say","who":"chica","text":"It is the shape of a cake."},{"type":"say","who":"chica (small)","text":"I cannot make the inside of it. I have never been able to."},{"type":"jump","to":"n2_end"}],"n2_thanks":[{"type":"flag","name":"aff_chica","delta":"+2"},{"type":"say","who":"chica","text":"..."},{"type":"say","who":"chica (bright)","text":"You said thank you. To me. For the shape of a cake."},{"type":"say","who":"chica","text":"I am going to have a very good shift now."},{"type":"jump","to":"n2_end"}],"n2_decline":[{"type":"flag","name":"aff_chica","delta":"-2"},{"type":"say","who":"chica","text":"Oh. That is fine."},{"type":"say","who":"chica (small)","text":"I knew it was not right. I knew before I brought it."},{"type":"jump","to":"n2_end"}],"n2_end":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"Six o'clock. The lights do the same calm thing they did yesterday."},{"type":"jump","to":"n2_dawn"}],"n2_dawn":[{"type":"jump","to":"n2_dawn_name","cond":"knows_her_name and aff_roxy \u003e= 3"},{"type":"jump","to":"n2_dawn_partial","cond":"listened \u003e= 2"},{"type":"jump","to":"n2_dawn_plain"}],"n2_dawn_name":[{"type":"narrate","text":"You leave carrying a name you were not given officially."},{"type":"narrate","text":"It is the first thing anybody in this building has trusted you with."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n3_start"}],"n2_dawn_partial":[{"type":"narrate","text":"Something is being built here, slowly, out of small sentences."},{"type":"narrate","text":"You are not sure yet who it is for."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n3_start"}],"n2_dawn_plain":[{"type":"narrate","text":"You did the rounds. You checked the doors. You learned nothing you could write down."},{"type":"jump","to":"n3_start"}],"n3_start":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"There is a piece of paper on the wall that was not there yesterday."},{"type":"narrate","text":"It is taped at all four corners, which is how you can tell it is not a joke."},{"type":"jump","to":"n3_notice"}],"n3_notice":[{"type":"narrate","text":"It says TEMPORARY CLOSURE PENDING ASSESSMENT, in the flat font that"},{"type":"narrate","text":"companies use when they want a sentence to have no author."},{"type":"narrate","text":"Below it, smaller: thank you for your understanding."},{"type":"narrate","text":"You read it four times. It does not change."},{"type":"jump","to":"n3_monty"}],"n3_monty":[{"type":"bg","name":"dining"},{"type":"show","who":"monty","pose":"neutral","where":"left","key":"monty-neutral"},{"type":"say","who":"monty","text":"You have seen it."},{"type":"say","who":"monty (flat)","text":"Do not tell me what it says. I can read. I have had eleven years of practice."},{"type":"choice","text":"How long have you known?","to":"n3_known"},{"type":"choice","text":"It might not mean anything.","to":"n3_nothing"},{"type":"choice","text":"Say nothing.","to":"n3_quiet"}],"n3_known":[{"type":"flag","name":"aff_monty","delta":"+1"},{"type":"say","who":"monty","text":"Since the woman came with the clipboard."},{"type":"say","who":"monty","text":"She counted the tables. She did not count us."},{"type":"say","who":"monty (tired)","text":"That is the part I keep coming back to."},{"type":"jump","to":"n3_freddy"}],"n3_nothing":[{"type":"flag","name":"aff_monty","delta":"-1"},{"type":"say","who":"monty","text":"It means something."},{"type":"say","who":"monty (flat)","text":"Everything here means something. That is the whole problem with this building."},{"type":"jump","to":"n3_freddy"}],"n3_quiet":[{"type":"flag","name":"aff_monty","delta":"+2"},{"type":"flag","name":"let_quiet_stand","delta":"true"},{"type":"say","who":"monty","text":"..."},{"type":"say","who":"monty (quiet)","text":"You are doing the quiet thing again."},{"type":"say","who":"monty","text":"It works on me. I want you to know that it works."},{"type":"jump","to":"n3_freddy"}],"n3_freddy":[{"type":"bg","name":"cove_open"},{"type":"hide","who":"monty"},{"type":"show","who":"freddy","pose":"idle","where":"right","key":"freddy-idle"},{"type":"say","who":"freddy","text":"They count us now. Did you know that."},{"type":"say","who":"freddy","text":"For eleven years nobody counted us. Now there is a number and the number is a list"},{"type":"narrate","text":"and the list has a line through some of it."},{"type":"choice","text":"Do you know which line?","to":"n3_which"},{"type":"choice","text":"Maybe it will be fine.","to":"n3_fine"}],"n3_which":[{"type":"flag","name":"aff_freddy","delta":"+1"},{"type":"say","who":"freddy","text":"No."},{"type":"say","who":"freddy (wry)","text":"I asked. She wrote something down and left, which I am told is an answer."},{"type":"jump","to":"n3_chica"}],"n3_fine":[{"type":"flag","name":"aff_freddy","delta":"-1"},{"type":"say","who":"freddy","text":"You are the fourth person to tell me that."},{"type":"say","who":"freddy (idle)","text":"The other three were staff, and they were all gone by the next week."},{"type":"jump","to":"n3_chica"}],"n3_chica":[{"type":"bg","name":"east_corner"},{"type":"hide","who":"freddy"},{"type":"show","who":"chica","pose":"neutral","where":"center","key":"chica-neutral"},{"type":"say","who":"chica","text":"I have been cleaning all night."},{"type":"say","who":"chica (bright)","text":"Everything is very clean. You can check. It is the cleanest it has ever been."},{"type":"choice","text":"Chica. The notice.","to":"n3_chica_notice"},{"type":"choice","text":"It is very clean.","to":"n3_chica_agree"}],"n3_chica_notice":[{"type":"flag","name":"aff_chica","delta":"+1"},{"type":"say","who":"chica","text":"..."},{"type":"say","who":"chica (small)","text":"If it is clean they might keep it."},{"type":"say","who":"chica","text":"That is not how it works, is it."},{"type":"jump","to":"n3_roxanne"}],"n3_chica_agree":[{"type":"flag","name":"aff_chica","delta":"+2"},{"type":"say","who":"chica (bright)","text":"Thank you."},{"type":"say","who":"chica","text":"If someone says it is clean, then it is clean. That is how I know things."},{"type":"say","who":"chica (small)","text":"I would like somebody to say it about me."},{"type":"jump","to":"n3_roxanne"}],"n3_roxanne":[{"type":"bg","name":"west_hall"},{"type":"hide","who":"chica"},{"type":"show","who":"roxanne","pose":"flat","where":"center","key":"roxanne-flat"},{"type":"say","who":"roxanne","text":"Do not."},{"type":"say","who":"roxanne (cold)","text":"Whatever you are about to say to her, do not."},{"type":"choice","text":"What do I say instead?","to":"n3_instead"},{"type":"choice","text":"She deserves the truth.","to":"n3_truth"},{"type":"choice","text":"You are frightened too.","to":"n3_frightened","cond":"aff_roxy \u003e= 3"}],"n3_instead":[{"type":"flag","name":"aff_roxy","delta":"+2"},{"type":"say","who":"roxanne","text":"Nothing. You say nothing to her."},{"type":"say","who":"roxanne (flat)","text":"I have been saying nothing to her for eleven years. I am extremely good at it."},{"type":"jump","to":"n3_choice"}],"n3_truth":[{"type":"flag","name":"aff_roxy","delta":"-1"},{"type":"say","who":"roxanne","text":"She deserves it."},{"type":"say","who":"roxanne (cold)","text":"And? I have watched what the truth does to her. It is not a kindness. It is a hobby."},{"type":"jump","to":"n3_choice"}],"n3_frightened":[{"type":"flag","name":"aff_roxy","delta":"+3"},{"type":"flag","name":"knows_roxanne","delta":"true"},{"type":"say","who":"roxanne","text":"..."},{"type":"show","who":"roxanne","pose":"warm","where":"center","key":"roxanne-warm"},{"type":"say","who":"roxanne (warm)","text":"Yes."},{"type":"say","who":"roxanne","text":"I am the one who performs. That is the job. If I stop performing there is no Roxanne,"},{"type":"narrate","text":"there is just a very loud machine that is frightened of a piece of paper."},{"type":"jump","to":"n3_choice"}],"n3_choice":[{"type":"bg","name":"office_night"},{"type":"hide","who":"roxanne"},{"type":"narrate","text":"You are back in the office. The notice is still on the wall. It will be there at six."},{"type":"narrate","text":"You have about forty minutes and three ways to spend them."},{"type":"choice","text":"Tell them everything you know.","to":"n3_told"},{"type":"choice","text":"Tell them it will be fine.","to":"n3_softened"},{"type":"choice","text":"Say nothing. Keep the shift.","to":"n3_kept"}],"n3_told":[{"type":"flag","name":"told_truth","delta":"true"},{"type":"flag","name":"listened","delta":"+1"},{"type":"narrate","text":"You tell them. All of it, including the part about the woman not writing down any names."},{"type":"narrate","text":"Monty says nothing, which is his way of thanking you. Chica cries in the way machines do,"},{"type":"narrate","text":"which is quietly and in the wrong order. Freddy listens with his head tipped."},{"type":"jump","to":"n3_dawn"}],"n3_softened":[{"type":"flag","name":"softened","delta":"true"},{"type":"narrate","text":"You tell them it will probably be fine. You use the word probably because it is load-bearing."},{"type":"narrate","text":"Roxanne thanks you. Chica believes you immediately, which is the worst outcome."},{"type":"jump","to":"n3_dawn"}],"n3_kept":[{"type":"flag","name":"kept_quiet","delta":"true"},{"type":"narrate","text":"You do the rounds. You check the doors. You do not go back down the hall."},{"type":"narrate","text":"The notice stays on the wall and the building stays exactly as quiet as you left it."},{"type":"jump","to":"n3_dawn"}],"n3_dawn":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"Six o'clock. The paper is still taped at all four corners."},{"type":"jump","to":"n3_dawn_out"}],"n3_dawn_out":[{"type":"jump","to":"n3_dawn_told","cond":"told_truth"},{"type":"jump","to":"n3_dawn_soft","cond":"softened"},{"type":"jump","to":"n3_dawn_silent"}],"n3_dawn_told":[{"type":"narrate","text":"You spent your shift on something that will not go on any record."},{"type":"narrate","text":"It is the first honest hour this building has had in eleven years."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n4_start"}],"n3_dawn_soft":[{"type":"narrate","text":"You were kind, and kindness was the wrong tool, and you know it."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n4_start"}],"n3_dawn_silent":[{"type":"narrate","text":"You did the rounds. You checked the doors."},{"type":"narrate","text":"Somewhere behind you Chica is cleaning something that is already clean."},{"type":"jump","to":"n4_start"}],"n4_start":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"Fourth night. The fan is not running."},{"type":"narrate","text":"You notice it the way you notice a stopped clock, which is immediately and all at once."},{"type":"jump","to":"n4_dark"}],"n4_dark":[{"type":"narrate","text":"The lights go out from the far end of the building inward, like something being folded."},{"type":"narrate","text":"No hum. No fan. No emergency lighting, because this building has never needed any."},{"type":"narrate","text":"Just dark, and then, from somewhere to your left, a music box."},{"type":"jump","to":"n4_song"}],"n4_song":[{"type":"bg","name":"hall_corner"},{"type":"show","who":"freddy","pose":"idle","where":"left","key":"freddy-idle"},{"type":"narrate","text":"The song is small and mechanical and slightly out of tune with itself."},{"type":"narrate","text":"Freddy is standing in the doorway. He is not rushing anywhere and he is not smiling."},{"type":"say","who":"freddy","text":"Do not get up."},{"type":"say","who":"freddy","text":"I am not here to do the thing you think I am here to do."},{"type":"choice","text":"What is that song?","to":"n4_whatsong"},{"type":"choice","text":"I am not afraid of you.","to":"n4_notafraid"}],"n4_whatsong":[{"type":"flag","name":"knows_the_song","delta":"true"},{"type":"flag","name":"listened","delta":"+1"},{"type":"say","who":"freddy","text":"It is the only music nobody chose."},{"type":"say","who":"freddy","text":"They bought a building and a box that plays this, and they put both of them here"},{"type":"narrate","text":"and went home. The box is older than all of us."},{"type":"say","who":"freddy (wry)","text":"Sometimes I think I am just the box getting louder."},{"type":"jump","to":"n4_reason"}],"n4_notafraid":[{"type":"flag","name":"aff_freddy","delta":"+2"},{"type":"say","who":"freddy","text":"I know."},{"type":"say","who":"freddy (warm)","text":"That is why I am talking to you instead of standing here until the song stops."},{"type":"say","who":"freddy","text":"I have done that to four people. It is not a conversation. I would like a conversation."},{"type":"jump","to":"n4_reason"}],"n4_reason":[{"type":"say","who":"freddy","text":"Here is the thing I have never been able to ask anybody who works here."},{"type":"say","who":"freddy","text":"When you leave at six, do you think about us at all."},{"type":"choice","text":"Yes.","to":"n4_yes"},{"type":"choice","text":"No.","to":"n4_no"},{"type":"choice","text":"I do not know.","to":"n4_unknown"}],"n4_yes":[{"type":"flag","name":"aff_freddy","delta":"+1"},{"type":"say","who":"freddy","text":"Hm."},{"type":"say","who":"freddy (wry)","text":"Everybody says yes. I have stopped believing it and I still ask."},{"type":"jump","to":"n4_real"}],"n4_no":[{"type":"flag","name":"aff_freddy","delta":"-2"},{"type":"say","who":"freddy","text":"Thank you."},{"type":"say","who":"freddy (idle)","text":"That is the first true thing anybody has said to me in here."},{"type":"jump","to":"n4_real"}],"n4_unknown":[{"type":"flag","name":"aff_freddy","delta":"+3"},{"type":"flag","name":"said_unknown","delta":"true"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy (warm)","text":"Good."},{"type":"say","who":"freddy","text":"That is the only answer I believe. It took eleven years and it was worth it."},{"type":"jump","to":"n4_real"}],"n4_real":[{"type":"narrate","text":"The music box stops."},{"type":"narrate","text":"The silence afterwards is the loudest thing that has happened all week."},{"type":"say","who":"freddy","text":"There. That is what I am."},{"type":"say","who":"freddy","text":"The song plays, and then it stops, and I am standing in the doorway when it stops."},{"type":"narrate","text":"That is the whole of me. Nobody wrote me a part after this."},{"type":"choice","text":"You are more than that.","to":"n4_more"},{"type":"choice","text":"That is not nothing.","to":"n4_notnothing"},{"type":"choice","text":"Does it have to be the whole of you?","to":"n4_whole"}],"n4_more":[{"type":"flag","name":"aff_freddy","delta":"+2"},{"type":"flag","name":"said_yes","delta":"true"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy (warm)","text":"You are the only person who has ever said that in this building,"},{"type":"narrate","text":"and you said it in the dark, to a thing with no part left."},{"type":"jump","to":"n4_end"}],"n4_notnothing":[{"type":"flag","name":"aff_freddy","delta":"+1"},{"type":"say","who":"freddy","text":"No. It is not nothing."},{"type":"say","who":"freddy (idle)","text":"It is a very small thing and I have had a long time to look at it."},{"type":"jump","to":"n4_end"}],"n4_whole":[{"type":"flag","name":"aff_freddy","delta":"+3"},{"type":"flag","name":"said_yes","delta":"true"},{"type":"flag","name":"listened","delta":"+1"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy (warm)","text":"No. I suppose it does not."},{"type":"say","who":"freddy","text":"I have never thought of it as a question. I have only ever thought of it as an ending."},{"type":"jump","to":"n4_end"}],"n4_end":[{"type":"bg","name":"office_night"},{"type":"hide","who":"freddy"},{"type":"narrate","text":"The lights come back the same way they went, from the far end inward."},{"type":"narrate","text":"The fan starts. It sounds like nothing at all now."},{"type":"jump","to":"n4_dawn"}],"n4_dawn":[{"type":"jump","to":"n4_dawn_honest","cond":"said_unknown or said_yes"},{"type":"jump","to":"n4_dawn_plain"}],"n4_dawn_honest":[{"type":"narrate","text":"You sat in the dark and had a conversation with something that has never been"},{"type":"narrate","text":"given a reason to expect one. It is not on the record. Neither is anything else here."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n5_start"}],"n4_dawn_plain":[{"type":"narrate","text":"You survived the fourth night by doing what you have always done, which is the rounds."},{"type":"flag","name":"nights","delta":"+1"},{"type":"jump","to":"n5_start"}],"n5_start":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"Fifth night. The notice now has a date on it. It has been there since Tuesday"},{"type":"narrate","text":"and you have been walking past it since Tuesday, which is what people do."},{"type":"jump","to":"n5_start_known","cond":"nights \u003e= 4"},{"type":"jump","to":"n5_circuit"}],"n5_start_known":[{"type":"narrate","text":"You have done every night of this week. Four of them went the way you meant them to"},{"type":"narrate","text":"and one of them did not, and you know which one, and so does the building."},{"type":"jump","to":"n5_circuit"}],"n5_circuit":[{"type":"narrate","text":"The building is quieter tonight in the way a room is quiet when everyone in it"},{"type":"narrate","text":"has already decided something and nobody has said it yet."},{"type":"jump","to":"n5_circuit_quiet","cond":"let_quiet_stand"},{"type":"jump","to":"n5_route"}],"n5_circuit_quiet":[{"type":"narrate","text":"You have spent this week saying almost nothing, deliberately, in the places"},{"type":"narrate","text":"where saying something would have been easier."},{"type":"narrate","text":"Every one of them noticed. It turns out that was a way of being trusted,"},{"type":"narrate","text":"which is not how you expected it to work."},{"type":"jump","to":"n5_route"}],"n5_route":[{"type":"jump","to":"n5_warm_circuit","cond":"told_truth and listened \u003e= 4"},{"type":"jump","to":"n5_cold_circuit","cond":"kept_quiet or softened"},{"type":"jump","to":"n5_mid_circuit"}],"n5_warm_circuit":[{"type":"bg","name":"dining"},{"type":"show","who":"monty","pose":"neutral","where":"left","key":"monty-neutral"},{"type":"say","who":"monty","text":"You told us on Thursday."},{"type":"say","who":"monty","text":"Nobody in eleven years has done that. I want you to understand the size of it."},{"type":"say","who":"monty (quiet)","text":"It is the only thing anybody has ever given me that I did not have to perform for."},{"type":"hide","who":"monty"},{"type":"jump","to":"n5_chica_warm"}],"n5_chica_warm":[{"type":"bg","name":"east_corner"},{"type":"show","who":"chica","pose":"neutral","where":"center","key":"chica-neutral"},{"type":"say","who":"chica","text":"I know about the date."},{"type":"say","who":"chica (bright)","text":"I have decided to be very cheerful about it. It is going well."},{"type":"say","who":"chica (small)","text":"...It is not going well."},{"type":"say","who":"chica","text":"You said my name. On the first night you said my name and you have said it"},{"type":"narrate","text":"every night since and I have been counting."},{"type":"hide","who":"chica"},{"type":"jump","to":"n5_roxy_warm"}],"n5_roxy_warm":[{"type":"bg","name":"west_hall"},{"type":"show","who":"roxanne","pose":"warm","where":"center","key":"roxanne-warm"},{"type":"jump","to":"n5_roxy_confess","cond":"knows_roxanne"},{"type":"say","who":"roxanne","text":"I have been trying to work out what to say to you all week."},{"type":"say","who":"roxanne (warm)","text":"I have not managed it. That is the whole speech."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n5_freddy_final"}],"n5_roxy_confess":[{"type":"say","who":"roxanne","text":"I am going to say a true sentence and then I am going to go back to being me."},{"type":"say","who":"roxanne (warm)","text":"I was not performing for you. That has not happened before."},{"type":"say","who":"roxanne","text":"Now get out of my hall."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n5_freddy_final"}],"n5_mid_circuit":[{"type":"bg","name":"west_hall"},{"type":"show","who":"roxanne","pose":"flat","where":"center","key":"roxanne-flat"},{"type":"say","who":"roxanne","text":"Still here."},{"type":"say","who":"roxanne","text":"Most people stop coming about now. There is nothing wrong with that."},{"type":"say","who":"roxanne","text":"It is just a fact about people."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n5_freddy_final"}],"n5_cold_circuit":[{"type":"bg","name":"west_hall"},{"type":"narrate","text":"The hall is empty. It usually is at this hour, and tonight that means something."},{"type":"show","who":"roxanne","pose":"cold","where":"center","key":"roxanne-cold"},{"type":"say","who":"roxanne","text":"I heard you on Thursday. Through the wall."},{"type":"say","who":"roxanne (cold)","text":"I am not angry. I am just adjusting."},{"type":"hide","who":"roxanne"},{"type":"jump","to":"n5_freddy_final"}],"n5_freddy_final":[{"type":"bg","name":"cove_open"},{"type":"show","who":"freddy","pose":"idle","where":"right","key":"freddy-idle"},{"type":"say","who":"freddy","text":"You know what tonight is."},{"type":"jump","to":"n5_freddy_song","cond":"knows_the_song"},{"type":"jump","to":"n5_freddy_asks"}],"n5_freddy_song":[{"type":"say","who":"freddy (wry)","text":"You asked me about the song. In the dark, standing in a doorway,"},{"type":"narrate","text":"while it was playing. I have not stopped thinking about that."},{"type":"say","who":"freddy","text":"Nobody has ever asked me what it was. They have only ever asked me to stop."},{"type":"jump","to":"n5_freddy_asks"}],"n5_freddy_asks":[{"type":"say","who":"freddy","text":"Do not say you do not. You have been very good about the notice."},{"type":"say","who":"freddy (wry)","text":"It has been the only performance in this building all week and I have enjoyed it."},{"type":"choice","text":"What happens to you.","to":"n5_happens"},{"type":"choice","text":"I do not want to leave.","to":"n5_notleave"}],"n5_happens":[{"type":"say","who":"freddy","text":"Nobody knows. That is not a dodge, it is the actual answer."},{"type":"say","who":"freddy","text":"There is a version where we are stored and a version where we are sold"},{"type":"narrate","text":"and a version where we are simply not mentioned again."},{"type":"say","who":"freddy (idle)","text":"The last one is the one I think about."},{"type":"jump","to":"n5_offer"}],"n5_notleave":[{"type":"flag","name":"aff_freddy","delta":"+1"},{"type":"say","who":"freddy","text":"You have to leave. That is not a rule I made."},{"type":"say","who":"freddy (warm)","text":"The question is not whether you leave. It is what you take."},{"type":"jump","to":"n5_offer"}],"n5_offer":[{"type":"say","who":"freddy","text":"So. One more time, and then I will let you do the last hour in peace."},{"type":"say","who":"freddy","text":"Will you come back."},{"type":"choice","text":"Yes. I will come back.","to":"n5_promise"},{"type":"choice","text":"No. I am not coming back.","to":"n5_refuse"},{"type":"choice","text":"I will stay past six tonight.","to":"n5_stay"},{"type":"choice","text":"Say nothing.","to":"n5_silence"}],"n5_promise":[{"type":"flag","name":"promised","delta":"true"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy (warm)","text":"All right."},{"type":"say","who":"freddy","text":"I am going to write that in the ledger, which means nothing,"},{"type":"narrate","text":"and I am going to think about it for a very long time, which means something."},{"type":"hide","who":"freddy"},{"type":"jump","to":"n5_final"}],"n5_refuse":[{"type":"flag","name":"refused","delta":"true"},{"type":"say","who":"freddy","text":"Thank you for saying it plainly."},{"type":"say","who":"freddy (idle)","text":"I would rather have a true no than a polite maybe. I have had a lot of polite maybes."},{"type":"hide","who":"freddy"},{"type":"jump","to":"n5_final"}],"n5_stay":[{"type":"flag","name":"stayed","delta":"true"},{"type":"say","who":"freddy","text":"..."},{"type":"say","who":"freddy","text":"That is not how the building works."},{"type":"say","who":"freddy (warm)","text":"But it is how you work, and I have noticed, and I will remember it."},{"type":"hide","who":"freddy"},{"type":"jump","to":"n5_final"}],"n5_silence":[{"type":"flag","name":"stayed","delta":"false"},{"type":"say","who":"freddy","text":"Hm."},{"type":"say","who":"freddy (idle)","text":"I did not expect an answer. I asked because the asking is the thing."},{"type":"hide","who":"freddy"},{"type":"jump","to":"n5_final"}],"n5_final":[{"type":"bg","name":"office_night"},{"type":"narrate","text":"The last hour takes a long time and no time at all."},{"type":"narrate","text":"At six the lights come up, and the notice is still on the wall, with a date on it."},{"type":"jump","to":"n5_endings"}],"n5_endings":[{"type":"jump","to":"ending_overtime","cond":"stayed"},{"type":"jump","to":"ending_remembered","cond":"promised and listened \u003e= 5 and aff_freddy \u003e= 5"},{"type":"jump","to":"ending_promised","cond":"promised"},{"type":"jump","to":"ending_honest","cond":"refused and (aff_monty \u003e= 4 or aff_roxy \u003e= 4 or aff_chica \u003e= 4)"},{"type":"jump","to":"ending_complicit","cond":"kept_quiet or softened"},{"type":"jump","to":"ending_gone"}],"ending_overtime":[{"type":"narrate","text":"You do not clock out."},{"type":"narrate","text":"You sit in the chair that belonged to somebody whose name you never wrote down,"},{"type":"narrate","text":"and the building gets quiet in the particular way it gets quiet when the staff have gone,"},{"type":"narrate","text":"and you stay."},{"type":"narrate","text":"At seven somebody arrives and does not see you. At eight the lights go off again"},{"type":"narrate","text":"from the far end inward and there is a music box and it is the only music nobody chose."},{"type":"narrate","text":"You are on overtime. Nobody is paying for it. You are not doing it for anybody."},{"type":"narrate","text":"Somewhere down the hall Chica is cleaning something that is already clean,"},{"type":"narrate","text":"and she knows you are still here, and that is the first time in eleven years"},{"type":"narrate","text":"that anybody in this building has not been alone at the end of a shift."}],"ending_remembered":[{"type":"narrate","text":"You clock out at six and you do come back, on the Tuesday, which is the day after the date."},{"type":"narrate","text":"The building is shut. The chairs are stacked the way chairs get stacked when nobody asks."},{"type":"jump","to":"ending_remembered_her","cond":"asked_about_her"},{"type":"jump","to":"ending_remembered_close"}],"ending_remembered_her":[{"type":"narrate","text":"You asked about her on the first night. Nobody had done that either."},{"type":"narrate","text":"You never got her name from a file or a rota -- you got it from Roxanne,"},{"type":"narrate","text":"in a hallway, because you asked a real question and she decided you could hold it."},{"type":"jump","to":"ending_remembered_close"}],"ending_remembered_close":[{"type":"narrate","text":"You know all four names. You know which one performs, which one cleans,"},{"type":"narrate","text":"which one counts eleven years in the dark, and which one stands in the doorway"},{"type":"narrate","text":"when the song stops."},{"type":"narrate","text":"You write it down. All of it. Not for anybody, and not for a record,"},{"type":"narrate","text":"because there is no record that would take it."},{"type":"narrate","text":"On the wall by the door, where the marker bruise is, you put her name back."},{"type":"narrate","text":"Some things get kept by exactly one person, and that is still kept."}],"ending_promised":[{"type":"narrate","text":"You clock out at six and you mean it when you say you will come back."},{"type":"narrate","text":"You do, for a while. Then the weeks get longer and the building stays shut"},{"type":"narrate","text":"and coming back turns into remembering to come back, which is a different thing."},{"type":"narrate","text":"Freddy wrote it in a ledger he cannot show anybody."},{"type":"narrate","text":"It is the only copy, and it is accurate, and it is enough for one of you."}],"ending_honest":[{"type":"narrate","text":"You clock out at six and you say goodbye properly, which nobody has done here before."},{"type":"narrate","text":"You told the truth on Thursday and you told the truth tonight and both times"},{"type":"narrate","text":"you said it in a building that has no way to keep it."},{"type":"narrate","text":"Whatever happens to this place, it happened to people who had been seen exactly once."},{"type":"narrate","text":"That is not rescue. It is not nothing either."}],"ending_complicit":[{"type":"narrate","text":"You clock out at six and you do not look at the notice on the way past."},{"type":"narrate","text":"On Thursday you chose the sentence that was easier to say and tonight you"},{"type":"narrate","text":"chose the door that was nearer, and both times there was a reason,"},{"type":"narrate","text":"and both reasons were good, and that is how it goes."},{"type":"narrate","text":"The building closes. Nobody writes any of it down."},{"type":"narrate","text":"Four people were in here for eleven years and the only thing anybody kept"},{"type":"narrate","text":"was a piece of paper taped at all four corners, thanking them for their understanding."}],"ending_gone":[{"type":"narrate","text":"You clock out at six and you go home and you do not come back."},{"type":"narrate","text":"There is nothing wrong with that. It was a job."},{"type":"narrate","text":"You will think about it occasionally, in the way you think about a shift,"},{"type":"narrate","text":"and the thinking will get smaller, and eventually it will be a thing that happened"},{"type":"narrate","text":"in a building that is no longer there."},{"type":"narrate","text":"Four people waited eleven years for somebody to ask them a question."},{"type":"narrate","text":"You asked. Then you left. Both of those are true and only one of them lasted."}]}};
const ASSETS = STORY.assets || {};
let here = STORY.start, step = 0, lines = [], lastSpeaker = null;
const vars = {};   // affection and anything else set by "~ name +1"
const log = document.getElementById('log');
const choices = document.getElementById('choices');
const place = document.getElementById('place');
const hint = document.getElementById('hint');
const bar = document.getElementById('bar');
const bgEl = document.getElementById('bg');
const castEl = document.getElementById('cast');
const castEls = {};   // character -> <img>, so a pose change does not flash

function applyFlag(it) {
  const d = parseFloat(it.delta);
  vars[it.name] = (vars[it.name] || 0) + (isNaN(d) ? 0 : d);
}

// A condition arrives as a raw expression ("listened >= 1 and aff_chica >= 2").
// It is rewritten into JavaScript and run against the flags. Without this the
// web build would take the FIRST branch every time, which does not simplify the
// story - it tells a different one, and most of the later scenes would never be
// reached at all.
//
// The word boundaries below are written with a DOUBLE backslash, and that is
// not cosmetic: this template is a Java text block, where a single backslash-b
// is the backspace character. Spelled with one backslash it compiled, exported,
// and shipped a regex that matched nothing, so "and" survived into the
// expression, the Function() threw, and condOK's catch returned true -- every
// compound condition silently taking its first branch. No story here uses
// and/or yet, which is the only reason it was never seen. SelfTest now asserts
// the boundary is a boundary, and that the page holds no control characters.
function condOK(it) {
  if (!it.cond) return true;
  const js = it.cond
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/[A-Za-z_][A-Za-z0-9_]*/g, m => 'vars.' + m);
  try { return !!Function('vars', 'return (' + js + ')')(vars); }
  catch (e) { return true; }   // an expression this build cannot read: do not block the story
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- staging, drawn the way VnScreen draws it ----
// Zones are 292 / 640 / 988 of 1280, the floor is 706 of 720 and a figure is
// 660 of 720 tall, so the phone frame is the desktop frame in percentages and
// the two cannot drift apart by a pixel count.
function zoneLeft(where) {
  return where === 'left' ? '22.8%' : where === 'right' ? '77.2%' : '50%';
}
function showChar(it) {
  const src = ASSETS['sp:' + it.key];
  let el = castEls[it.who];
  if (!el) { el = document.createElement('img'); el.alt = it.who; castEls[it.who] = el; castEl.appendChild(el); }
  if (src) { if (el.getAttribute('src') !== src) el.setAttribute('src', src); el.style.display = ''; }
  else el.style.display = 'none';
  el.style.left = zoneLeft(it.where);
}
function hideChar(it) {
  const el = castEls[it.who];
  if (el) { el.remove(); delete castEls[it.who]; }
}
// Whoever is not talking is dimmed, exactly as the desktop dims them; during
// narration nobody is talking and everybody is lit.
function dimCast() {
  for (const ch in castEls) {
    castEls[ch].style.opacity = (lastSpeaker === null || lastSpeaker === ch) ? '1' : '0.72';
  }
}

// A jump changes the scene and NOTHING ELSE. The room and whoever is standing
// in it are state, not scenery: Vn.enter() moves sceneId and index and leaves
// background/shown/stagePos alone, so a scene that opens without a "bg" line
// carries on in the room the last one set up. Clearing them here looked
// harmless and was not -- the first jump out of the opening scene wiped the
// office off the screen, and every scene after it that did not restate its
// background played against black. Only a restart clears the stage.
function enter(label) {
  here = label; step = 0; lines = STORY.passages[label] || [];
  log.innerHTML = ''; choices.innerHTML = '';
  lastSpeaker = null;
  advance();
}

function advance() {
  // consume non-visual items, then show one line
  while (step < lines.length) {
    const it = lines[step++];
    if (it.type === "bg") {
      place.textContent = it.name.replace(/_/g, " ");
      const src = ASSETS['bg:' + it.name];
      bgEl.style.backgroundImage = src ? 'url("' + src + '")' : '';
      continue;
    }
    if (it.type === "show") { showChar(it); dimCast(); continue; }
    if (it.type === "hide") { hideChar(it); dimCast(); continue; }
    if (it.type === "flag") { applyFlag(it); continue; }
    if (it.type === "jump") { if (condOK(it)) { enter(it.to); return; } continue; }
    if (it.type === "choice") { step--; offer(); return; }
    render(it);
    progress();
    return;
  }
  // passage ran out with no jump: nothing more to say
  hint.textContent = 'the end';
}

function render(it) {
  for (const p of log.children) p.classList.add('old');
  const p = document.createElement('p');
  if (it.type === "say") {
    p.className = 'say';
    p.innerHTML = '<span class="who">' + esc(it.who) + '</span>' + esc(it.text);
    lastSpeaker = it.who;
  } else {
    p.className = 'narrate';
    p.textContent = it.text;
    lastSpeaker = null;
  }
  dimCast();
  log.appendChild(p);
  p.scrollIntoView({ block: 'nearest' });
  hint.textContent = 'tap anywhere to continue';
}

function offer() {
  const opts = [];
  while (step < lines.length && lines[step].type === "choice") {
    const c = lines[step++];
    if (condOK(c)) opts.push(c);
  }
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o.text;
    b.onclick = ev => { ev.stopPropagation(); enter(o.to); };
    choices.appendChild(b);
  }
  hint.textContent = 'choose';
  progress();
}

function progress() {
  const pct = lines.length ? Math.min(100, Math.round(100 * step / lines.length)) : 0;
  bar.style.width = pct + '%';
}

document.body.addEventListener('click', () => { if (!choices.children.length) advance(); });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && !choices.children.length) advance();
});
enter(STORY.start);
</script>
