<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>it has yours</title>
<style>
  :root{--bg:#05060A; --ink:#D8D8E4; --dim:#7A7A90; --red:#E94560; --gold:#FFD700;
        --panel:#0B0D14; --line:#1E2030}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:14px 14px 22px;min-height:100%;
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;letter-spacing:.10em;color:var(--red);margin:2px 0 0;text-transform:uppercase}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .nightrow{display:block;width:100%;text-align:left;padding:12px 14px;margin:0 0 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;cursor:pointer}
  .nightrow:active{background:#16171F}
  .nightrow .t{display:block;font-size:16px}
  .nightrow .n{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .help{color:var(--dim);font-size:12px;line-height:1.6}
  #band{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}
  #night{color:var(--red);letter-spacing:.06em}
  .meter{height:6px;background:#141620;border-radius:3px;overflow:hidden;width:74px}
  .meter i{display:block;height:100%;width:100%;background:#5A6A8A}
  .meter.low i{background:var(--red)}
  #stage{position:relative;background:#02030A;border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  #readout{font-size:13px;letter-spacing:.05em;color:var(--gold);min-height:20px}
  #readout small{color:var(--dim);letter-spacing:0}
  #strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #strip button{padding:13px 8px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
  #strip button:active{background:#16171F}
  #strip button.wide{grid-column:1 / -1}
  #strip button[disabled]{opacity:.35}
  #over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:6px;background:rgba(2,3,10,.86);text-align:center;padding:18px}
  #over h2{margin:0;font-size:22px;color:var(--red);letter-spacing:.06em}
  #over p{margin:0;color:var(--dim);font-size:13px}
  #over button{margin-top:10px;padding:10px 18px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <h1>Five Nights at Freddy's 7</h1>
  <p class="sub">Two doors, one bar and one light -- and it does not have a pattern. It has yours.</p>

  <div id="select"></div>

  <div id="band" hidden>
    <span id="night"></span>
    <span id="clock"></span>
    <span>FILAMENT <span class="meter" id="fil"><i></i></span></span>
  </div>

  <div id="stage" hidden>
    <canvas id="cv" width="720" height="420"></canvas>
    <div id="over" hidden>
      <h2 id="overtitle"></h2>
      <p id="overtext"></p>
      <button id="again">Again</button>
    </div>
  </div>

  <div id="readout" hidden></div>

  <div id="strip" hidden>
    <button id="bl">LOOK LEFT</button>
    <button id="br">LOOK RIGHT</button>
    <button id="blb">BAR LEFT</button>
    <button id="brb">BAR RIGHT</button>
    <button id="bd" class="wide">DARK</button>
  </div>

  <p class="help" id="help"></p>
</div>

// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


/**
 * FNAF7's cue names, on the shared palette.
 *
 * The ears are the one free channel in this game, and the engine says
 * what they are worth: "an arrival you can place is an arrival you can answer
 * without spending a look -- and a look is the only thing keeping the record
 * sharp." A silent port hands the player the light and takes away the reason
 * the light is a decision.
 */
function sfx(cue) {
  // The cues this engine builds from a name at runtime.
  if (cue.startsWith("step_left")) { voice("step"); return; }
  if (cue.startsWith("step_right")) { voice("step"); return; }
  switch (cue) {
    case "at_door": voice("knock"); break;
    case "bar_move": voice("clank"); break;
    case "bar_set": voice("click"); break;
    case "caught": voice("scream"); break;
    case "chime_6am": voice("chime"); break;
    case "light_blown": voice("down"); break;
    case "light_off": voice("click"); break;
    case "light_on": voice("click"); break;
    case "light_ready": voice("up"); break;
    case "repel": voice("knock"); break;
    default: break;
  }
}

/** Play everything the engine raised this frame. */
function sfxAll() {
  for (const c of g.drain()) sfx(c);
}

// --------------------------------------------------------------- the night
//
// A faithful port of aside.games.fnaf7.engine.Shift. The rules are the
// desktop's, to the number: the light has a warm-up, the filament is a
// budget, the bar cannot move while the light is on, the record is a decayed
// integral of where the light has been, and the unit comes to the side the
// record does not hold. What is different is only the presentation -- the
// office is drawn rather than photographed, because the page has to be one
// file and the desktop's art is three megabytes of it.
//
// java.util.Random is reproduced in BigInt so the same seed deals the same
// night in both builds. That is not ceremony: it is what makes a night
// reproducible when the two are compared.

function RNG(seed) {
  this.s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
}
RNG.prototype.next = function (bits) {
  this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
  return Number(this.s >> BigInt(48 - bits));
};
RNG.prototype.nextDouble = function () {
  return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
};
RNG.prototype.nextBoolean = function () { return this.next(1) !== 0; };

function mix(z) {
  z = BigInt(z) + 0x9E3779B97F4A7C15n;
  z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & ((1n << 64n) - 1n);
  z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & ((1n << 64n) - 1n);
  return z ^ (z >> 31n);
}

// The art, as data URIs in the content. Loaded once, and the drawing waits
// for them rather than drawing a half-built frame.
const IMG = {};
let artReady = false;
{
  const keys = Object.keys(C.assets);
  let left = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) artReady = true; };
    im.src = C.assets[k];
    IMG[k] = im;
  }
}

const HOUR_SECONDS = 25.0, NIGHT_HOURS = 6;
const LIGHT_WARM = 0.45, LIGHT_MAX = 3.2, LIGHT_COOL = 10.0, LIGHT_RESET = 0.55;
const BAR_MOVE = 0.60, STRIKE = 1.50, LOOK_WEIGHT = 1.0, SURE = 0.8;
// The night's tables come from the engine rather than from this file, so the
// two builds cannot drift. See aside.games.fnaf7.WebShift.
const AWAY = C.away, APPROACH = C.approach, EXPLORE = C.explore, MEMORY = C.memory;

function Shift(night, seed) {
  this.night = night;
  this.rng = new RNG(mix(seed));
  this.unit = C.units[night - 1];
  this.time = 0; this.hour = 0;
  this.where = "AWAY"; this.target = "LEFT"; this.timer = this.away();
  this.barAt = "RIGHT"; this.barMoving = false; this.barTo = null; this.barTimer = 0;
  this.lit = false; this.lightSide = "LEFT"; this.litFor = 0;
  this.heat = 0; this.blown = false;
  this.attendL = 0; this.attendR = 0;
  this.status = "PLAYING"; this.killer = null; this.caughtAt = -1;
  this.strikes = 0; this.repels = 0; this.looks = 0; this.moves = 0; this.knocked = 0;
  this.heardSide = null; this.cues = [];
}
Shift.prototype.away = function () { return AWAY[Math.min(this.night - 1, 4)]; };
Shift.prototype.approach = function () { return APPROACH[Math.min(this.night - 1, 4)]; };
Shift.prototype.explore = function () { return EXPLORE[Math.min(this.night - 1, 4)]; };
Shift.prototype.memory = function () { return MEMORY[Math.min(this.night - 1, 4)]; };

Shift.prototype.attend = function (s) { return s === "LEFT" ? this.attendL : this.attendR; };
Shift.prototype.belief = function () {
  const d = this.attendL - this.attendR;
  if (Math.abs(d) < SURE) return null;
  return d > 0 ? "LEFT" : "RIGHT";
};
Shift.prototype.confidence = function () {
  const t = this.attendL + this.attendR;
  if (t <= 1e-6) return 0;
  return Math.min(1, Math.abs(this.attendL - this.attendR) / t);
};
Shift.prototype.predicted = function () {
  const b = this.belief();
  return b === null ? null : (b === "LEFT" ? "RIGHT" : "LEFT");
};
Shift.prototype.coin = function () { return this.rng.nextBoolean() ? "LEFT" : "RIGHT"; };
Shift.prototype.choose = function () {
  if (this.rng.nextDouble() < this.explore()) return this.coin();
  const b = this.belief();
  return b === null ? this.coin() : (b === "LEFT" ? "RIGHT" : "LEFT");
};

Shift.prototype.inHall = function () { return this.where === "HALL_LEFT" || this.where === "HALL_RIGHT"; };
Shift.prototype.whereSide = function () {
  if (this.where === "HALL_LEFT" || this.where === "DOOR_LEFT") return "LEFT";
  if (this.where === "HALL_RIGHT" || this.where === "DOOR_RIGHT") return "RIGHT";
  return null;
};
Shift.prototype.revealed = function () { return this.lit && this.litFor >= LIGHT_WARM; };
Shift.prototype.visible = function () {
  return this.revealed() && this.inHall() && this.whereSide() === this.lightSide;
};
Shift.prototype.filament = function () { return 1 - this.heat; };
Shift.prototype.barred = function (s) { return this.barAt === s; };
Shift.prototype.clock = function () {
  const h = Math.min(this.hour, 6);
  return h === 0 ? "12 AM" : (h < 6 ? h + " AM" : "6 AM");
};

Shift.prototype.cue = function (n) { this.cues.push(n); };
Shift.prototype.drain = function () { const c = this.cues; this.cues = []; return c; };

Shift.prototype.update = function (dt) {
  if (this.status !== "PLAYING") return;
  this.time += dt;
  this.hour = Math.floor(this.time / HOUR_SECONDS);
  if (this.hour >= NIGHT_HOURS) { this.status = "SURVIVED"; this.cue("chime_6am"); return; }

  if (this.lit) {
    this.litFor += dt;
    this.heat = Math.min(1, this.heat + dt / LIGHT_MAX);
    if (this.heat >= 1) { this.lit = false; this.litFor = 0; this.blown = true; this.cue("light_blown"); }
  } else {
    this.litFor = 0;
    this.heat = Math.max(0, this.heat - dt / LIGHT_COOL);
    if (this.blown && this.heat <= LIGHT_RESET) { this.blown = false; this.cue("light_ready"); }
  }

  const k = Math.exp(-dt / this.memory());
  this.attendL *= k; this.attendR *= k;
  if (this.lit) {
    if (this.lightSide === "LEFT") this.attendL += LOOK_WEIGHT * dt;
    else this.attendR += LOOK_WEIGHT * dt;
  }

  if (this.barMoving) {
    this.barTimer -= dt;
    if (this.barTimer <= 0) { this.barAt = this.barTo; this.barMoving = false; this.barTo = null; this.cue("bar_set"); }
  }

  this.timer -= dt;
  if (this.timer <= 0) this.stepUnit();
};

Shift.prototype.stepUnit = function () {
  if (this.where === "AWAY") {
    this.target = this.choose();
    this.where = this.target === "LEFT" ? "HALL_LEFT" : "HALL_RIGHT";
    this.timer = this.approach();
    if (this.rng.nextDouble() < this.unit.tell) {
      this.heardSide = this.target;
      this.cue(this.target === "LEFT" ? "step_left" : "step_right");
    } else {
      this.heardSide = null;
    }
  } else if (this.inHall()) {
    this.where = this.target === "LEFT" ? "DOOR_LEFT" : "DOOR_RIGHT";
    this.timer = STRIKE;
    this.cue("at_door");
  } else {
    const s = this.whereSide();
    this.strikes++;
    if (this.barAt === s) {
      this.repels++; this.knocked++;
      this.barAt = null; this.barMoving = false; this.barTo = null; this.barTimer = 0;
      this.where = "AWAY"; this.timer = this.away(); this.heardSide = null;
      this.cue("repel");
    } else {
      this.caughtAt = Math.floor(this.time);
      this.heardSide = null;
      this.status = "CAUGHT"; this.killer = this.unit.name;
      this.cue("caught");
    }
  }
};

Shift.prototype.aim = function (s) {
  if (this.status !== "PLAYING") return this.lit;
  if (this.barMoving || this.blown) return this.lit;
  if (this.lit && this.lightSide === s) return this.lit;
  this.lit = true; this.lightSide = s; this.litFor = 0; this.looks++;
  this.cue("light_on");
  return true;
};
Shift.prototype.dark = function () {
  if (this.status !== "PLAYING") return this.lit;
  if (!this.lit) return this.lit;
  this.lit = false; this.litFor = 0; this.cue("light_off");
  return false;
};
Shift.prototype.moveBar = function (s) {
  if (this.status !== "PLAYING") return false;
  if (this.lit || this.barMoving || this.barAt === s) return false;
  this.barMoving = true; this.barTo = s; this.barAt = null; this.barTimer = BAR_MOVE; this.moves++;
  this.cue("bar_move");
  return true;
};

// --------------------------------------------------------------- the office

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;

function drawOffice(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  // The office itself, with its two doorways.
  const rm = IMG.room;
  if (rm && rm.complete && rm.naturalWidth) {
    cx.drawImage(rm, 0, 0, W, H);
    // Only a little dark on top: the office photograph is already a dark
    // room, and the first version of this put a third of a screen of black
    // over it and the room disappeared.
  }
  // Two doorways, one at each end of the room.
  const doors = { LEFT: [40, 90, 150, 250], RIGHT: [W - 190, 90, 150, 250] };
  for (const s of ["LEFT", "RIGHT"]) {
    const d = doors[s];
    cx.fillStyle = "#0A0C14"; cx.fillRect(d[0], d[1], d[2], d[3]);
    cx.strokeStyle = "#1E2030"; cx.lineWidth = 2; cx.strokeRect(d[0], d[1], d[2], d[3]);
    // The bar, when it is on this door.
    if (g.barred(s)) {
      cx.fillStyle = "#3A2A2E";
      cx.fillRect(d[0] - 6, d[1] + d[3] / 2 - 14, d[2] + 12, 28);
      cx.strokeStyle = "#E94560"; cx.strokeRect(d[0] - 6, d[1] + d[3] / 2 - 14, d[2] + 12, 28);
    }
    // The light, when it is on this side.
    if (g.lit && g.lightSide === s) {
      const warm = g.revealed();
      const grd = cx.createLinearGradient(d[0], 0, d[0] + d[2], 0);
      grd.addColorStop(0, warm ? "rgba(255,220,150,0.16)" : "rgba(255,220,150,0.05)");
      grd.addColorStop(1, "rgba(255,220,150,0)");
      cx.fillStyle = grd; cx.fillRect(d[0], d[1], d[2], d[3]);
      cx.fillStyle = warm ? "#FFDCA0" : "#6A5A3A";
      cx.fillRect(d[0] + d[2] / 2 - 16, d[1] - 12, 32, 6);
    }
    cx.fillStyle = "#556070"; cx.font = "13px Arial"; cx.textAlign = "center";
    cx.fillText(s, d[0] + d[2] / 2, d[1] + d[3] + 22);
  }
  // The bar in the air.
  if (g.barMoving) {
    const t = 1 - g.barTimer / BAR_MOVE;
    const x = g.barTo === "LEFT" ? W / 2 - (W / 2 - 115) * (1 - t) : W / 2 + (W / 2 - 115) * (1 - t);
    cx.fillStyle = "#3A2A2E"; cx.fillRect(x - 40, H / 2 - 12, 80, 24);
    cx.strokeStyle = "#E94560"; cx.strokeRect(x - 40, H / 2 - 12, 80, 24);
  }
  // The unit, when the light holds it. It is drawn from the far end of the
  // hall toward the doorway, so how big it is against the frame is the
  // distance -- which is the only thing the light is for.
  if (g.visible()) {
    const d = doors[g.whereSide()];
    const t = 1 - g.timer / g.approach();
    const x = d[0] + d[2] / 2, y = d[1] + d[3] * (0.25 + 0.55 * t);
    const u = IMG["unit:" + g.unit.key];
    if (u && u.complete && u.naturalWidth) {
      const h = d[3] * (0.45 + 0.75 * t);
      const w = h * (u.naturalWidth / u.naturalHeight);
      cx.drawImage(u, x - w / 2, y - h / 2, w, h);
    } else {
      cx.fillStyle = "rgba(233,69,96,0.85)";
      cx.beginPath(); cx.ellipse(x, y, 26, 52, 0, 0, Math.PI * 2); cx.fill();
    }
    cx.fillStyle = "#FFD700"; cx.font = "13px Arial"; cx.textAlign = "center";
    cx.fillText(g.unit.name, x, d[1] + d[3] + 40);
  }
  // The floor.
  cx.strokeStyle = "#12141E"; cx.beginPath();
  cx.moveTo(0, H - 60); cx.lineTo(W, H - 60); cx.stroke();
}

/** The face, filling the screen. The one frame the art is for. */
function drawScare(g) {
  const im = IMG["scare:" + g.unit.key];
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);
  if (im && im.complete && im.naturalWidth) {
    const s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * 1.08;
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    cx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
}

// --------------------------------------------------------------- the page

let g = null, raf = 0, last = 0;

function start(night) {
  g = new Shift(night, Date.now() & 0xffff);
  document.getElementById("select").hidden = true;
  document.getElementById("band").hidden = false;
  document.getElementById("stage").hidden = false;
  document.getElementById("readout").hidden = false;
  document.getElementById("strip").hidden = false;
  document.getElementById("over").hidden = true;
  document.getElementById("help").textContent = C.help;
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (g) { g.update(dt); sfxAll(); paint(); }
  raf = requestAnimationFrame(loop);
}

function paint() {
  if (g.status === "CAUGHT") drawScare(g); else drawOffice(g);
  document.getElementById("night").textContent = "NIGHT " + g.night;
  document.getElementById("clock").textContent = g.clock();
  const f = document.getElementById("fil");
  f.firstElementChild.style.width = Math.round(g.filament() * 100) + "%";
  f.className = "meter" + (g.filament() < 0.25 ? " low" : "");

  const b = g.belief();
  const r = document.getElementById("readout");
  if (g.heardSide) {
    r.innerHTML = "A STEP, " + g.heardSide + " <small>&mdash; you do not have to look</small>";
  } else if (b === null) {
    r.innerHTML = "IT EXPECTS YOU AT: &mdash; <small>&mdash; the record has not separated</small>";
  } else {
    r.innerHTML = "IT EXPECTS YOU AT: " + b
      + " <small>&mdash; so it comes " + (b === "LEFT" ? "RIGHT" : "LEFT") + "</small>";
  }

  const st = g.status;
  document.getElementById("bl").disabled = st !== "PLAYING" || g.blown;
  document.getElementById("br").disabled = st !== "PLAYING" || g.blown;
  document.getElementById("blb").disabled = st !== "PLAYING" || g.lit;
  document.getElementById("brb").disabled = st !== "PLAYING" || g.lit;
  document.getElementById("bd").disabled = st !== "PLAYING";

  if (st !== "PLAYING" && document.getElementById("over").hidden) {
    document.getElementById("over").hidden = false;
    document.getElementById("overtitle").textContent =
      st === "SURVIVED" ? "6 AM" : "IT CAME THROUGH";
    document.getElementById("overtext").textContent =
      st === "SURVIVED" ? "It never got through. " + g.repels + " turned back."
                        : g.killer + " came through an open door.";
  }
}

document.getElementById("bl").onclick = () => g && g.aim("LEFT");
document.getElementById("br").onclick = () => g && g.aim("RIGHT");
document.getElementById("blb").onclick = () => g && g.moveBar("LEFT");
document.getElementById("brb").onclick = () => g && g.moveBar("RIGHT");
document.getElementById("bd").onclick = () => g && g.dark();
document.getElementById("again").onclick = () => { const n = g.night; start(n); };

(function build() {
  const sel = document.getElementById("select");
  for (let n = 1; n <= 5; n++) {
    const u = C.units[n - 1];
    const b = document.createElement("button");
    b.className = "nightrow";
    b.innerHTML = '<span class="t">Night ' + n + " &mdash; " + u.name + "</span>"
      + '<span class="n">' + u.note + "</span>";
    b.onclick = () => start(n);
    sel.appendChild(b);
  }
  document.getElementById("help").textContent = C.help;
})();
</script>
