<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay</title>
<style>
  :root {
    --bg: #0B0C10;
    --ink: #E9E9F2;
    --dim: #9C9CB0;
    --faint: #6B6B82;
    --gold: #E8B44A;
    --bad: #E05A6B;
    --good: #6FCF97;
    --paper: #1A1B26;
    --edge: #2C2D3E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 0px) 0;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }
  h1 { font-family: Georgia, serif; font-size: 34px; color: var(--gold); margin: 18px 0 2px; font-weight: 400; }
  .sub { color: var(--faint); font-size: 12px; margin-bottom: 18px; }
  p { margin: 0 0 14px; }
  .scene { font-family: Georgia, serif; font-size: 17px; color: var(--ink); }
  .card { background: var(--paper); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .card h2 { font-size: 12px; letter-spacing: .08em; color: var(--faint); margin: 0 0 12px; font-weight: 600; }
  .rule { margin-bottom: 14px; }
  .rule .k { color: var(--gold); font-size: 14px; }
  .rule .t { color: var(--dim); font-size: 13px; }
  button {
    font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 13px 18px;
    background: var(--gold); color: #14141C; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--edge); font-weight: 400; }
  .who { font-family: Georgia, serif; font-size: 24px; color: var(--gold); margin: 6px 0 2px; }
  .sit { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--paper); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 12px; padding: 15px 16px; margin: 0 0 12px;
    font: 17px/1.45 Georgia, serif; font-weight: 400; cursor: pointer;
  }
  .opt:active { border-color: var(--gold); background: #232433; }
  .opt .mark { color: var(--gold); font-size: 12px; display: block; margin-bottom: 6px; font-family: -apple-system, sans-serif; letter-spacing: .08em; }
  .big { font-family: Georgia, serif; font-size: 26px; color: var(--gold); margin: 4px 0 10px; }
  .big.win { color: var(--good); }
  .stat { font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  .stat.bad { color: var(--bad); }
  .stat.good { color: var(--good); }
  .row { padding: 12px 0; border-bottom: 1px solid var(--edge); }
  .row .top { display: flex; gap: 10px; align-items: baseline; }
  .row .n { color: var(--faint); font-size: 12px; width: 18px; flex: 0 0 18px; }
  .row .who2 { color: var(--ink); font-size: 14px; flex: 1; }
  .row .w { font-size: 13px; }
  .row .w.both { color: var(--good); }
  .row .w.half { color: var(--gold); }
  .row .w.broke { color: var(--bad); }
  .row .lbl { color: var(--faint); font-size: 11px; letter-spacing: .07em; }
  .row .txt { color: var(--dim); font-size: 13px; }
  .row .txt.gone { color: var(--faint); }
  .closing { font-family: Georgia, serif; font-size: 16px; color: var(--ink); margin: 18px 0; }
  .note { color: var(--faint); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const C = {
"wordmark":"Relay",
"openTitle":"Relay",
"openSub":"Six messages cross tonight. You are the one carrying them.",
"openSituation":["The house is sold. Ruth and Sam are not speaking, and they are not going to start. Everything that passes between them tonight passes through you.","Ruth writes first, then Sam, then Ruth. Six messages. For each one you choose how to carry it, and once it is carried it is carried."],
"rulesHeading":"the rule",
"rules":[{"key":"two things","text":"A message carries what was said, and what it was for. No way of putting it carries all of both."},{"key":"the floor","text":"A message is worth the smaller of the two. Not the total — the smaller. A message that arrives with every fact and none of the point is not a message, it is a transcript."}],
"startButton":"take the first message",
"arrow":"→",
"carryNote":"Once it is carried it is carried.",
"max":12,
"messages":[{"from":"Ruth","to":"Sam","situation":"Ruth has not written to Sam in four months.","facts":[{"id":"sold","label":"the house is sold"},{"id":"empty","label":"the buyer wants it empty by the 14th"},{"id":"piano","label":"the piano is still in the front room"}],"points":[{"id":"notice","label":"this is a notice, not a request"},{"id":"elsewhere","label":"she wants him to hear it from her"}],"options":[{"text":"The house is sold. The buyer wants it empty by the 14th. The piano is still in the front room.","facts":["sold","empty","piano"],"points":[]},{"text":"The house is sold, and the buyer wants it empty by the 14th. I'm not asking you for anything — I just didn't want you to hear it from someone else.","facts":["sold","empty"],"points":["notice","elsewhere"]},{"text":"The house is sold and the buyer wants it empty by the 14th. The piano is still in the front room. I thought you'd rather hear it from me than from someone else.","facts":["sold","empty","piano"],"points":["elsewhere"]}]},{"from":"Sam","to":"Ruth","situation":"Sam has not been back to the house since the funeral.","facts":[{"id":"working","label":"he is working on the 14th"},{"id":"after","label":"he can come the weekend after"},{"id":"nothing","label":"he wants nothing out of the house"}],"points":[{"id":"spite","label":"he is not refusing out of spite"},{"id":"ask","label":"he will come if she asks him to"}],"options":[{"text":"I'm working on the 14th. I can come the weekend after. I don't want anything from the house.","facts":["working","after","nothing"],"points":[]},{"text":"I can't do the 14th — I'm working. I can come the weekend after. I'm not saying no to you. If you need me there, say so and I'll come.","facts":["working","after"],"points":["spite","ask"]},{"text":"I'm working on the 14th, but I can come the weekend after. I don't want anything from the house. I'm not saying no to you.","facts":["working","after","nothing"],"points":["spite"]}]},{"from":"Ruth","to":"Sam","situation":"The house is being cleared on the 12th.","facts":[{"id":"twelfth","label":"the piano goes to the charity shop on the 12th"},{"id":"boxes","label":"his boxes are in the loft"},{"id":"adair","label":"the neighbour asked after him"}],"points":[{"id":"last","label":"this is the last time she will offer the piano"},{"id":"tired","label":"she is tired of being the one who writes"}],"options":[{"text":"The piano goes to the charity shop on the 12th. Your boxes are in the loft. Mrs Adair asked after you.","facts":["twelfth","boxes","adair"],"points":[]},{"text":"The piano goes on the 12th. If you want it, tell me before then — I won't ask again. Your boxes are in the loft. I'm tired of being the one who writes.","facts":["twelfth","boxes"],"points":["last","tired"]},{"text":"The piano goes to the charity shop on the 12th. Your boxes are in the loft. Mrs Adair asked after you. I won't ask again.","facts":["twelfth","boxes","adair"],"points":["last"]}]},{"from":"Sam","to":"Ruth","situation":"Sam is coming up on the 15th.","facts":[{"id":"fifteenth","label":"he is coming on the 15th"},{"id":"van","label":"he is bringing a van"},{"id":"take","label":"he will take the piano if it is still there"}],"points":[{"id":"argue","label":"he is not coming to argue"},{"id":"key","label":"he is asking her to leave the key out"}],"options":[{"text":"I'll come on the 15th and take the piano if it's still there. I'm not coming to argue. Leave the key under the pot.","facts":["fifteenth","take"],"points":["argue","key"]},{"text":"I'll come on the 15th. I'll take the piano if it's still there. I'm bringing a van.","facts":["fifteenth","van","take"],"points":[]},{"text":"I'll come on the 15th with a van and take the piano. Leave the key under the pot.","facts":["fifteenth","van","take"],"points":["key"]}]},{"from":"Ruth","to":"Sam","situation":"Ruth sold the piano in the spring.","facts":[{"id":"soldpiano","label":"the piano is sold"},{"id":"envelope","label":"the money is in an envelope with his name on it"},{"id":"march","label":"she is moving to her sister's in March"}],"points":[{"id":"sorry","label":"she is sorry she did not wait"},{"id":"keeping","label":"she is not keeping the money"}],"options":[{"text":"The piano is sold. The money's in an envelope with your name on it. I'm moving to Christine's in March.","facts":["soldpiano","envelope","march"],"points":[]},{"text":"The piano is sold and the money's in an envelope with your name on it. I'm moving to Christine's in March. I'm sorry — I should have waited.","facts":["soldpiano","envelope","march"],"points":["sorry"]},{"text":"I sold the piano. I'm sorry — I should have waited. The money's in an envelope with your name on it, and I'm not keeping it.","facts":["soldpiano","envelope"],"points":["sorry","keeping"]}]},{"from":"Sam","to":"Ruth","situation":"Ruth has not answered since the 15th.","facts":[{"id":"got","label":"he has the envelope"},{"id":"half","label":"he is sending half of it back"},{"id":"help","label":"he will come and help her move"}],"points":[{"id":"thanks","label":"he is thanking her"},{"id":"want","label":"he does not want the money"}],"options":[{"text":"I got the envelope — thank you. I'm sending half back. I'll come in March and help you move.","facts":["got","half","help"],"points":["thanks"]},{"text":"I got the envelope. I'm sending half back — I don't want it. Thank you.","facts":["got","half"],"points":["thanks","want"]},{"text":"I got the envelope. I'm sending half back. I'll come in March and help you move.","facts":["got","half","help"],"points":[]}]}],
"progress":["message 1 of 6","message 2 of 6","message 3 of 6","message 4 of 6","message 5 of 6","message 6 of 6"],
"worthWord":["broke","half","both"],
"worthLine":["worth 0 of 12","worth 1 of 12","worth 2 of 12","worth 3 of 12","worth 4 of 12","worth 5 of 12","worth 6 of 12","worth 7 of 12","worth 8 of 12","worth 9 of 12","worth 10 of 12","worth 11 of 12","worth 12 of 12"],
"breaksLine":["Nothing arrived as something else.","One of the six arrived as something else.","2 of the six arrived as something else.","3 of the six arrived as something else.","4 of the six arrived as something else.","5 of the six arrived as something else.","6 of the six arrived as something else."],
"closing":["Nothing arrived. Every message came through as a transcript: correct, complete, and not what anyone was saying. They will read it and learn nothing about the person who wrote it.","Very little arrived. The facts mostly got through; almost none of the reasons did. They will both be accurate about the house and wrong about each other.","Very little arrived. The facts mostly got through; almost none of the reasons did. They will both be accurate about the house and wrong about each other.","Very little arrived. The facts mostly got through; almost none of the reasons did. They will both be accurate about the house and wrong about each other.","Very little arrived. The facts mostly got through; almost none of the reasons did. They will both be accurate about the house and wrong about each other.","Half of it arrived. They will compare notes eventually and find they were told two different evenings. Nothing was invented. A great deal was dropped.","Half of it arrived. They will compare notes eventually and find they were told two different evenings. Nothing was invented. A great deal was dropped.","Half of it arrived. They will compare notes eventually and find they were told two different evenings. Nothing was invented. A great deal was dropped.","Half of it arrived. They will compare notes eventually and find they were told two different evenings. Nothing was invented. A great deal was dropped.","Most of it arrived. Where it did not, it was the floor that went: a message that kept every fact and lost the reason for it. They will be working from the same facts and two different nights.","Most of it arrived. Where it did not, it was the floor that went: a message that kept every fact and lost the reason for it. They will be working from the same facts and two different nights.","Most of it arrived. Where it did not, it was the floor that went: a message that kept every fact and lost the reason for it. They will be working from the same facts and two different nights.","All six arrived. Both of them end the night knowing the same thing, and neither was told anything the other did not say. That is the whole job, and it is rarer than it sounds."],
"reportHead":"what arrived",
"keptHead":"kept",
"lostHead":"lost",
"nothingLost":"nothing — all of it arrived",
"again":"carry them again"
}
;

//__MODEL_BEGIN__
// The rule, ported. A message is worth the smaller of what it carries, not the
// total -- and the phone has to compute that itself, because the report depends
// on it. There is no deal here and no seed: the six messages are the six
// messages, so the whole model is the content and the two builds cannot diverge
// on anything but arithmetic. tools/relay-trace.mjs compares every message,
// every option, every count and every score line against the Java model.
function worth(m, o) {
  const opt = C.messages[m].options[o];
  return Math.min(opt.facts.length, opt.points.length);
}
function total(m, o) {
  const opt = C.messages[m].options[o];
  return opt.facts.length + opt.points.length;
}
function carried(m, o, which) {
  const msg = C.messages[m], opt = msg.options[o];
  return msg[which].filter(el => opt[which].indexOf(el.id) >= 0).map(el => el.label);
}
function kept(m, o) { return carried(m, o, 'facts').concat(carried(m, o, 'points')); }
function lost(m, o) {
  const msg = C.messages[m], opt = msg.options[o];
  return msg.facts.filter(el => opt.facts.indexOf(el.id) < 0).map(el => el.label)
    .concat(msg.points.filter(el => opt.points.indexOf(el.id) < 0).map(el => el.label));
}
function score() {
  let s = 0;
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] >= 0) s += worth(m, state.choices[m]);
  return s;
}
function breaks() {
  let n = 0;
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] >= 0 && worth(m, state.choices[m]) === 0) n++;
  return n;
}
function nextUnchosen() {
  for (let m = 0; m < C.messages.length; m++) if (state.choices[m] < 0) return m;
  return -1;
}
//__MODEL_END__

const KEY = 'aside.relay.night';
let state = { choices: [], reported: false };
let screen = 'open';
let at = 0;
let canStore = true;
try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); }
catch (e) { canStore = false; }

function fresh() {
  state.choices = new Array(C.messages.length).fill(-1);
  state.reported = false;
  at = 0;
}

// The desktop's own save format, so a night carried on one can be finished on
// the other. Same three lines, same shape.
function serialize() {
  return 'relay 1\nchoices ' + state.choices.map(c => (c < 0 ? '-' : c)).join(' ') + '\n'
    + 'reported ' + (state.reported ? 1 : 0) + '\n';
}

function deserialize(text) {
  const lines = String(text).split('\n');
  if (!lines.length || lines[0].trim().split(/\s+/)[0] !== 'relay') return false;
  for (const line of lines) {
    const p = line.trim().split(/\s+/);
    if (p[0] === 'choices') {
      for (let i = 0; i < C.messages.length && i + 1 < p.length; i++) {
        state.choices[i] = p[i + 1] === '-' ? -1 : Number(p[i + 1]);
      }
    } else if (p[0] === 'reported' && p.length > 1) {
      state.reported = p[1] === '1';
    }
  }
  return true;
}

function load() {
  if (!canStore) return false;
  let t = null;
  try { t = localStorage.getItem(KEY); } catch (e) { return false; }
  if (!t) return false;
  fresh();
  if (!deserialize(t)) return false;
  at = Math.max(0, nextUnchosen());
  return true;
}

function save() {
  if (!canStore) return false;
  try { localStorage.setItem(KEY, serialize()); return true; }
  catch (e) { return false; }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

const app = document.getElementById('app');

function render() {
  if (screen === 'open') renderOpen();
  else if (screen === 'read') renderRead();
  else renderReport();
}

function renderOpen() {
  let h = '<h1>' + esc(C.openTitle) + '</h1><div class="sub">' + esc(C.openSub) + '</div>';
  for (const p of C.openSituation) h += '<p class="scene">' + esc(p) + '</p>';
  h += '<div class="card"><h2>' + esc(C.rulesHeading) + '</h2>';
  for (const r of C.rules) {
    h += '<div class="rule"><div class="k">' + esc(r.key) + '</div><div class="t">' + esc(r.text) + '</div></div>';
  }
  h += '</div><button id="go">' + esc(C.startButton) + '</button>';
  if (!canStore) h += '<div class="note">This browser will not keep the night. The report will be lost when you close the tab.</div>';
  app.innerHTML = h;
  document.getElementById('go').onclick = () => { screen = 'read'; render(); };
}

function renderRead() {
  const msg = C.messages[at];
  let h = '<h1>' + esc(C.wordmark) + '</h1><div class="sub">' + esc(C.progress[at]) + '</div>';
  h += '<div class="who">' + esc(msg.from) + ' ' + esc(C.arrow) + ' ' + esc(msg.to) + '</div>';
  h += '<div class="sit">' + esc(msg.situation) + '</div>';
  for (let o = 0; o < msg.options.length; o++) {
    h += '<button class="opt" data-o="' + o + '">' + esc(msg.options[o].text) + '</button>';
  }
  h += '<div class="note">' + esc(C.carryNote) + '</div>';
  app.innerHTML = h;
  for (const el of document.querySelectorAll('.opt')) {
    el.onclick = () => {
      state.choices[at] = Number(el.dataset.o);
      const n = nextUnchosen();
      if (n < 0) { state.reported = true; screen = 'report'; }
      else { at = n; }
      save();
      render();
    };
  }
}

function renderReport() {
  const s = score(), b = breaks();
  let h = '<h1>' + esc(C.wordmark) + '</h1><div class="sub">' + esc(C.reportHead) + '</div>';
  h += '<div class="big' + (s === C.max ? ' win' : '') + '">' + esc(C.worthLine[s]) + '</div>';
  h += '<div class="stat ' + (b === 0 ? 'good' : 'bad') + '">' + esc(C.breaksLine[b]) + '</div>';

  for (let m = 0; m < C.messages.length; m++) {
    const o = state.choices[m], w = worth(m, o), msg = C.messages[m];
    const word = C.worthWord[w];
    const gone = lost(m, o);
    h += '<div class="row">'
       + '<div class="top"><div class="n">' + (m + 1) + '</div>'
       + '<div class="who2">' + esc(msg.from) + ' ' + esc(C.arrow) + ' ' + esc(msg.to) + '</div>'
       + '<div class="w ' + esc(word) + '">' + esc(word) + '</div></div>'
       + '<div class="lbl">' + esc(C.keptHead) + '</div><div class="txt">' + esc(kept(m, o).join(' \u00b7 ')) + '</div>'
       + '<div class="lbl">' + esc(C.lostHead) + '</div><div class="txt gone">'
       + esc(gone.length ? gone.join(' \u00b7 ') : C.nothingLost) + '</div>'
       + '</div>';
  }

  h += '<div class="closing">' + esc(C.closing[s]) + '</div>';
  h += '<button id="again">' + esc(C.again) + '</button>';
  app.innerHTML = h;
  document.getElementById('again').onclick = () => {
    fresh();
    save();
    screen = 'open';
    render();
  };
}

if (load()) screen = state.reported ? 'report' : 'read';
else { fresh(); save(); screen = 'open'; }
render();
</script>
</body>
</html>
