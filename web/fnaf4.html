<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>where you are is the resource</title>
<style>
  :root{--bg:#05060A; --ink:#D8D8E4; --dim:#7A7A90; --red:#E94560; --gold:#FFD700;
        --panel:#0B0D14; --line:#1E2030}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{max-width:560px;margin:0 auto;padding:14px 14px 22px;min-height:100%;
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;letter-spacing:.10em;color:var(--red);margin:2px 0 0;text-transform:uppercase}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .nightrow{display:block;width:100%;text-align:left;padding:12px 14px;margin:0 0 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;cursor:pointer}
  .nightrow:active{background:#16171F}
  .nightrow .t{display:block;font-size:16px}
  .nightrow .n{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .help{color:var(--dim);font-size:12px;line-height:1.6}
  #band{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}
  #night{color:var(--red);letter-spacing:.06em}
  .meter{height:6px;background:#141620;border-radius:3px;overflow:hidden;width:74px}
  .meter i{display:block;height:100%;width:100%;background:#5A6A8A}
  .meter.loud i{background:var(--red)}
  #stage{position:relative;background:#02030A;border:1px solid var(--line);border-radius:10px;
    overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  #heard{font-size:13px;letter-spacing:.04em;color:var(--gold);min-height:20px}
  #heard small{color:var(--dim);letter-spacing:0}
  #strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #strip button{padding:13px 8px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
  #strip button:active{background:#16171F}
  #strip button.wide{grid-column:1 / -1}
  #strip button[disabled]{opacity:.35}
  #over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:6px;background:rgba(2,3,10,.86);text-align:center;padding:18px}
  #over h2{margin:0;font-size:22px;color:var(--red);letter-spacing:.06em}
  #over p{margin:0;color:var(--dim);font-size:13px}
  #over button{margin-top:10px;padding:10px 18px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:inherit;cursor:pointer}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <h1>Five Nights at Freddy's 4</h1>
  <p class="sub">Four sides to the room, one body, and a light that tells them where you are.</p>

  <div id="select"></div>

  <div id="band" hidden>
    <span id="night"></span>
    <span id="clock"></span>
    <span>NOISE <span class="meter" id="nz"><i></i></span></span>
  </div>

  <div id="stage" hidden>
    <canvas id="cv" width="720" height="420"></canvas>
    <div id="over" hidden>
      <h2 id="overtitle"></h2>
      <p id="overtext"></p>
      <button id="again">Again</button>
    </div>
  </div>

  <div id="heard" hidden></div>

  <div id="strip" hidden>
    <button id="mb">BED</button>
    <button id="ml">LEFT DOOR</button>
    <button id="mc">CLOSET</button>
    <button id="mr">RIGHT DOOR</button>
    <button id="fl" class="wide">FLASH</button>
  </div>

  <p class="help" id="help"></p>
</div>

<script>
const C = {
  baseInterval: [6, 5.3, 4.7, 4.2, 3.8],
  grace: [4.2, 3.8, 3.3, 2.9, 2.5],
  fredbearRate: [0, 0.004, 0.007, 0.011, 0.016],
  aiLevel: [3, 6, 10, 14, 18],
  hourSeconds: 40,
  nightHours: 6,
  hopTime: 1.15,
  flashTime: 0.4,
  litTime: 1,
  distMax: 4,
  pushTo: 3,
  breathEvery: 1.5,
  noiseMax: 100,
  noisePerFlash: 18,
  noiseDecay: 6,
  noiseWeight: 1.9,
  fredbearGrace: 9,
  fredbearCooldown: 22,
  notes: ["Comfortable. You can answer a breath from anywhere. Grace 4.2s against a 2.7s trip.", "Still comfortable, and the room is busier. Grace 3.8s against a 2.7s trip.", "The trip starts to cost you. Grace 3.3s against a 2.7s trip.", "Answering a breath is no longer enough. Grace 2.9s against a 2.7s trip.", "The grace is shorter than the worst-case trip. Pre-empt or lose. Grace 2.5s against a 2.7s trip."],
  help: "Four sides to the room and one body. The bed is the hub, so a door is one hop away and the doors are two hops from each other. Four things count down in moves toward four stations, and the countdown is audible: a step when one is a move out, a breath when it is standing there. The light reaches one move out as well as standing-here -- and every flash is noise, and noise is what brings Fredbear, who does not walk and has to be found."
};


// --------------------------------------------------------------- the sound
//
// Synthesised, so the page stays one file with no audio in it. The palette is
// shared by every phone build -- see aside.game.WebAudio -- and what each game
// does with it is its own business: the cue names below are mapped to these
// voices in the page, because the mapping is the game.
//
// A browser will not start audio until the player has touched the page, so the
// context is created on the first cue and resumed on every one after that. The
// first tap of a night is what turns the sound on, which is the same gesture
// that starts the night.

let AC = null;

function ac() {
  if (!AC) {
    const K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    try { AC = new K(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function noiseBuf(a, dur) {
  const n = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function tone(a, t, f0, f1, dur, type, gain) {
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function hiss(a, t, dur, type, freq, q, gain, bendTo) {
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a, dur);
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (bendTo) f.frequency.linearRampToValueAtTime(bendTo, t + dur);
  f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + Math.min(0.04, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + dur + 0.02);
}

/**
 * One voice. Every game's cues land on one of these, and the palette is
 * deliberately small: a footstep, a knock, a breath, a clank, static, a click,
 * a chime, a scream, and a system going down or coming back.
 */
function voice(name) {
  const a = ac();
  if (!a) return;
  const t = a.currentTime;
  switch (name) {
    case 'footstep':
      // A footfall somewhere in the building. Low, and not close.
      hiss(a, t, 0.30, 'lowpass', 1500, 1, 0.34);
      tone(a, t, 92, 74, 0.26, 'sine', 0.30);
      break;
    case 'step':
      // The same footfall, one room away. Louder and drier, so the distance
      // is audible rather than only readable.
      hiss(a, t, 0.24, 'lowpass', 2100, 1, 0.52);
      tone(a, t, 108, 84, 0.22, 'sine', 0.44);
      break;
    case 'knock':
      // Something arriving at the door. Heavier than a step and shorter.
      hiss(a, t, 0.42, 'bandpass', 2600, 1, 0.72, 900);
      tone(a, t, 118, 82, 0.36, 'sine', 0.56);
      break;
    case 'breath':
      // Something standing there. A soft swell, not a hit -- it has to be
      // recognisable while it is repeating every second and a half.
      hiss(a, t, 0.55, 'bandpass', 700, 0.8, 0.30, 480);
      break;
    case 'clank':
      // The lure: a metal thing struck in an empty room.
      hiss(a, t, 0.10, 'highpass', 4200, 1, 0.46);
      tone(a, t, 620, 300, 0.30, 'square', 0.20);
      tone(a, t + 0.02, 940, 520, 0.22, 'sine', 0.16);
      break;
    case 'static':
      // A feed, or a phantom. Short and bright.
      hiss(a, t, 0.34, 'highpass', 2400, 1, 0.40);
      break;
    case 'click':
      // A switch, a light, a panel.
      hiss(a, t, 0.05, 'highpass', 5200, 1, 0.44);
      tone(a, t + 0.005, 1150, 1150, 0.10, 'sine', 0.16);
      break;
    case 'chime':
      // Six AM.
      tone(a, t, 880, 880, 0.55, 'sine', 0.22);
      tone(a, t + 0.16, 1320, 1320, 0.60, 'sine', 0.18);
      break;
    case 'down':
      // A system failing. It falls.
      tone(a, t, 320, 52, 0.85, 'sawtooth', 0.30);
      hiss(a, t, 0.70, 'lowpass', 900, 1, 0.30);
      break;
    case 'up':
      // And coming back.
      tone(a, t, 180, 620, 0.42, 'sine', 0.24);
      break;
    case 'laugh':
      // Something laughing in the dark. Three short falling tones, which is
      // as close as a palette this small gets to a voice.
      tone(a, t, 520, 380, 0.16, 'triangle', 0.20);
      tone(a, t + 0.18, 470, 330, 0.16, 'triangle', 0.18);
      tone(a, t + 0.36, 430, 290, 0.20, 'triangle', 0.16);
      break;
    case 'scream':
      // The one cue nobody chose.
      tone(a, t, 2200, 90, 1.10, 'sawtooth', 0.34);
      hiss(a, t, 1.10, 'highpass', 900, 1, 0.30);
      break;
    default:
      break;
  }
}


/**
 * FNAF4's cue names, on the shared palette.
 *
 * This is the game where the sound *is* the countdown. The engine's
 * design note says it: "the countdown is audible -- a step when it is one move
 * out, a breath when it is standing there." The step cue names which of the
 * four is close, and that name is what the entire pre-empt half of the game
 * runs on: without it a player would know something was near and not what, and
 * "go and look" would be a guess rather than a decision.
 */
function sfx(cue) {

  // The cues this engine builds from a name at runtime.
  if (cue.startsWith("breath_")) { voice("breath"); return; }
  if (cue.startsWith("step_")) { voice("step"); return; }
  switch (cue) {
    case "chime_6am": voice("chime"); break;
    case "door_close": voice("knock"); break;
    case "footstep": voice("footstep"); break;
    case "fredbear_laugh": voice("laugh"); break;
    case "light_click": voice("click"); break;
    case "scare_sprint": voice("scream"); break;
    default: break;
  }
}

// --------------------------------------------------------------- the night
//
// A faithful port of aside.games.fnaf4.engine.Game. The room has four sides
// and you have one body: the bed is the hub, so the doors are one hop away
// and each other is two. Four things count down in moves toward four
// stations and the countdown is audible -- a step when one is a move out, a
// breath when it is standing there. The light reaches one move out as well
// as standing-here, and every flash is noise, and noise is what brings
// Fredbear, who does not walk and has to be found.
//
// java.util.Random is reproduced in BigInt so the same seed deals the same
// night in both builds. Note that this engine seeds Random directly rather
// than through the splitmix64 finalizer the later games use.

function RNG(seed) {
  this.s = (BigInt(seed) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
}
RNG.prototype.next = function (bits) {
  this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
  return Number(this.s >> BigInt(48 - bits));
};
RNG.prototype.nextDouble = function () {
  return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
};
RNG.prototype.nextInt = function (bound) {
  let r = this.next(31);
  const m = bound - 1;
  if ((bound & m) === 0) return Number((BigInt(bound) * BigInt(r)) >> 31n);
  let u = r;
  for (;;) {
    r = u % bound;
    // Java's rejection loop, including its 32-bit signed overflow.
    if (((u - r + m) | 0) >= 0) return r;
    u = this.next(31);
  }
};

const HOUR_SECONDS = C.hourSeconds, NIGHT_HOURS = C.nightHours;
const HOP_TIME = C.hopTime, FLASH_TIME = C.flashTime, LIT_TIME = C.litTime;
const DIST_MAX = C.distMax, PUSH_TO = C.pushTo, BREATH_EVERY = C.breathEvery;
const NOISE_MAX = C.noiseMax, NOISE_PER_FLASH = C.noisePerFlash;
const NOISE_DECAY = C.noiseDecay, NOISE_WEIGHT = C.noiseWeight;
const FREDBEAR_GRACE = C.fredbearGrace, FREDBEAR_COOLDOWN = C.fredbearCooldown;
const WHERE = ["BED", "LEFT", "RIGHT", "CLOSET"];

function hops(a, b) {
  if (a === b) return 0;
  if (a === "BED" || b === "BED") return 1;
  return 2;
}

function Threat(name, key, home, pace, startDistance) {
  this.name = name; this.key = key; this.home = home; this.pace = pace;
  this.distance = startDistance; this.timer = 0; this.hereFor = 0; this.sinceBreath = 0;
}
Threat.prototype.here = function () { return this.distance === 0; };
Threat.prototype.update = function (dt, g) {
  if (g.status !== "PLAYING") return;
  if (this.here()) {
    this.hereFor += dt; this.sinceBreath += dt;
    if (this.sinceBreath >= BREATH_EVERY) { this.sinceBreath = 0; g.cue("breath_" + this.key); }
    if (this.hereFor >= g.grace()) g.jumpscare(this.name);
    return;
  }
  this.timer += dt;
  if (this.timer < g.interval(this)) return;
  this.timer = 0;
  this.distance--;
  if (this.distance === 0) {
    this.hereFor = 0; this.sinceBreath = 0;
    g.cue("breath_" + this.key); g.arrived(this);
  } else if (this.distance === 1) {
    g.cue("step_" + this.key);
  } else {
    g.cue("footstep");
  }
};
Threat.prototype.repel = function () {
  this.distance = DIST_MAX; this.timer = 0; this.hereFor = 0; this.sinceBreath = 0;
};
Threat.prototype.push = function () {
  this.distance = PUSH_TO; this.timer = 0; this.hereFor = 0; this.sinceBreath = 0;
};

function Game(night, seed) {
  this.night = night;
  this.rng = new RNG(seed);
  this.time = 0; this.hour = 0;
  this.where = "BED"; this.heading = null; this.busy = 0; this.busyTotal = 0; this.lit = 0;
  this.noise = 0; this.flashes = 0; this.wastedFlashes = 0;
  this.fredbearAt = null; this.fredbearHere = 0; this.fredbearCooldown = 0;
  this.fredbearVisits = 0;
  this.status = "PLAYING"; this.killer = null;
  this.arrivals = 0; this.lastArrival = null;
  this.cues = [];
  const start = () => DIST_MAX - this.rng.nextInt(2);
  this.threats = [
    new Threat("Nightmare Bonnie", "bonnie", "LEFT", 0.95, start()),
    new Threat("Nightmare Chica", "chica", "RIGHT", 1.05, start()),
    new Threat("Nightmare Foxy", "foxy", "CLOSET", 0.90, start()),
    new Threat("Nightmare Freddy", "freddy", "BED", 1.00, start())
  ];
}
Game.prototype.baseInterval = function () { return C.baseInterval[Math.min(this.night - 1, 4)]; };
Game.prototype.interval = function (t) { return this.baseInterval() / t.pace; };
Game.prototype.grace = function () { return C.grace[Math.min(this.night - 1, 4)]; };
Game.prototype.fredbearRate = function () { return C.fredbearRate[Math.min(this.night - 1, 4)]; };
Game.prototype.fredbearChance = function () {
  return this.fredbearRate() * (0.1 + NOISE_WEIGHT * (this.noise / NOISE_MAX));
};
Game.prototype.clock = function () {
  const h = Math.min(this.hour, 6);
  return h === 0 ? "12 AM" : (h < 6 ? h + " AM" : "6 AM");
};
Game.prototype.cue = function (n) { this.cues.push(n); };
Game.prototype.drain = function () { const c = this.cues; this.cues = []; return c; };
Game.prototype.arrived = function (t) { this.lastArrival = t; this.arrivals++; };
Game.prototype.moving = function () { return this.heading !== null; };
Game.prototype.standingAt = function (w) {
  for (const t of this.threats) if (t.home === w && t.distance === 0) return t;
  return null;
};
Game.prototype.occupied = function () {
  if (this.fredbearAt === this.where) return true;
  return this.standingAt(this.where) !== null;
};
Game.prototype.approaching = function () {
  for (const t of this.threats) if (t.home === this.where && t.distance === 1) return true;
  return false;
};
Game.prototype.reachable = function () {
  if (this.fredbearAt === this.where) return true;
  for (const t of this.threats) if (t.home === this.where && t.distance <= 1) return true;
  return false;
};

Game.prototype.update = function (dt) {
  if (this.status !== "PLAYING") return;
  this.time += dt;
  this.hour = Math.floor(this.time / HOUR_SECONDS);
  if (this.hour >= NIGHT_HOURS) { this.status = "SURVIVED"; this.cue("chime_6am"); return; }

  this.noise = Math.max(0, this.noise - NOISE_DECAY * dt);

  if (this.busy > 0) {
    this.busy -= dt;
    if (this.busy <= 0) {
      this.busy = 0;
      if (this.heading !== null) { this.where = this.heading; this.heading = null; }
    }
  }
  if (this.lit > 0) this.lit = Math.max(0, this.lit - dt);

  for (const t of this.threats) {
    t.update(dt, this);
    if (this.status !== "PLAYING") return;
  }
  this.updateFredbear(dt);
};

Game.prototype.updateFredbear = function (dt) {
  if (this.fredbearAt !== null) {
    this.fredbearHere += dt;
    if (this.fredbearHere >= FREDBEAR_GRACE) this.jumpscare("Nightmare Fredbear");
    return;
  }
  if (this.fredbearCooldown > 0) { this.fredbearCooldown = Math.max(0, this.fredbearCooldown - dt); return; }
  const p = this.fredbearChance();
  if (p > 0 && this.rng.nextDouble() < p * dt) this.spawnFredbear();
};

Game.prototype.spawnFredbear = function () {
  const options = WHERE.filter((w) => w !== this.where);
  this.fredbearAt = options[this.rng.nextInt(options.length)];
  this.fredbearHere = 0;
  this.fredbearVisits++;
  this.cue("fredbear_laugh");
};

Game.prototype.jumpscare = function (who) {
  if (this.status !== "PLAYING") return;
  this.status = "JUMPSCARED"; this.killer = who; this.cue("scare_sprint");
};

Game.prototype.moveTo = function (dest) {
  if (this.status !== "PLAYING") return false;
  if (this.busy > 0) return false;
  if (dest === this.where) return false;
  const h = hops(this.where, dest);
  if (h === 0) return false;
  this.heading = dest; this.busy = h * HOP_TIME; this.busyTotal = this.busy;
  this.lit = 0;
  this.cue("footstep");
  return true;
};

Game.prototype.flash = function () {
  if (this.status !== "PLAYING") return false;
  if (this.busy > 0) return false;
  this.busy = FLASH_TIME; this.busyTotal = FLASH_TIME; this.lit = LIT_TIME;
  this.noise = Math.min(NOISE_MAX, this.noise + NOISE_PER_FLASH);
  this.flashes++;
  this.cue("light_click");
  let found = false;
  for (const t of this.threats) {
    if (t.home !== this.where) continue;
    if (t.distance === 0) { t.repel(); found = true; }
    else if (t.distance === 1) { t.push(); found = true; }
  }
  if (this.fredbearAt === this.where) {
    this.fredbearAt = null; this.fredbearHere = 0;
    this.fredbearCooldown = FREDBEAR_COOLDOWN; found = true;
  }
  if (!found) this.wastedFlashes++;
  return found;
};

// --------------------------------------------------------------- the room

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const BOX = {
  LEFT:  [40, 60, 190, 130],
  BED:   [265, 60, 190, 130],
  RIGHT: [490, 60, 190, 130],
  CLOSET:[265, 230, 190, 130]
};
const LABEL = { BED: "THE BED", LEFT: "LEFT DOOR", RIGHT: "RIGHT DOOR", CLOSET: "THE CLOSET" };

function drawRoom(g) {
  cx.fillStyle = "#02030A"; cx.fillRect(0, 0, W, H);

  // The spokes, so the shape of the room is legible: the bed is the hub.
  cx.strokeStyle = "#12141E"; cx.lineWidth = 2;
  for (const w of ["LEFT", "RIGHT", "CLOSET"]) {
    cx.beginPath();
    cx.moveTo(BOX.BED[0] + BOX.BED[2] / 2, BOX.BED[1] + BOX.BED[3] / 2);
    cx.lineTo(BOX[w][0] + BOX[w][2] / 2, BOX[w][1] + BOX[w][3] / 2);
    cx.stroke();
  }

  for (const w of WHERE) {
    const b = BOX[w];
    const here = g.where === w;
    const going = g.heading === w;
    cx.fillStyle = "#070910"; cx.fillRect(b[0], b[1], b[2], b[3]);
    cx.strokeStyle = here ? "#E94560" : (going ? "#6A5A3A" : "#1E2030");
    cx.lineWidth = here ? 3 : 2;
    cx.strokeRect(b[0], b[1], b[2], b[3]);

    // The light, if it is lit here.
    if (here && g.lit > 0) {
      cx.fillStyle = "rgba(255,220,150,0.16)";
      cx.fillRect(b[0] + 4, b[1] + 4, b[2] - 8, b[3] - 8);
    }

    // Something standing here: you can see it when it is in front of you.
    const t = g.standingAt(w);
    if (t) {
      const x = b[0] + b[2] / 2, y = b[1] + b[3] / 2 + 6;
      cx.fillStyle = "rgba(233,69,96,0.85)";
      cx.beginPath(); cx.ellipse(x, y, 22, 34, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = "#FFD700";
      cx.beginPath(); cx.arc(x - 8, y - 14, 4, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(x + 8, y - 14, 4, 0, Math.PI * 2); cx.fill();
    }

    // And how long it will wait, if it is here.
    if (t) {
      const left = Math.max(0, 1 - t.hereFor / g.grace());
      cx.fillStyle = "#141620"; cx.fillRect(b[0] + 12, b[1] + b[3] - 14, b[2] - 24, 5);
      cx.fillStyle = left < 0.35 ? "#E94560" : "#5A6A8A";
      cx.fillRect(b[0] + 12, b[1] + b[3] - 14, (b[2] - 24) * left, 5);
    }

    cx.fillStyle = here ? "#E94560" : "#556070";
    cx.font = "13px Arial"; cx.textAlign = "center";
    cx.fillText(LABEL[w], b[0] + b[2] / 2, b[1] - 10);
  }

  // You.
  const b = BOX[g.where];
  cx.fillStyle = "#D8D8E4";
  cx.beginPath(); cx.arc(b[0] + b[2] / 2, b[1] + 16, 6, 0, Math.PI * 2); cx.fill();

  // Fredbear, when he has been found -- and only then.
  if (g.fredbearAt === g.where && g.lit > 0) {
    const f = BOX[g.where];
    cx.fillStyle = "#FFD700";
    cx.beginPath(); cx.arc(f[0] + f[2] / 2, f[1] + f[3] - 26, 9, 0, Math.PI * 2); cx.fill();
  }
}

// --------------------------------------------------------------- the page

let g = null, raf = 0, last = 0, heard = "";

function say(text, quiet) {
  heard = text ? text + (quiet ? " <small>&mdash; " + quiet + "</small>" : "") : "";
}

function start(night) {
  g = new Game(night, Date.now() & 0xffff);
  heard = "";
  document.getElementById("select").hidden = true;
  document.getElementById("band").hidden = false;
  document.getElementById("stage").hidden = false;
  document.getElementById("heard").hidden = false;
  document.getElementById("strip").hidden = false;
  document.getElementById("over").hidden = true;
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (g) { g.update(dt); cues(); paint(); }
  raf = requestAnimationFrame(loop);
}

// The countdown is audible and nothing else is. A step names the one that is
// a move out; a breath means something is standing in front of you; a
// footstep is something moving that you cannot place.
function cues() {
  for (const c of g.drain()) {
    sfx(c);
    if (c.startsWith("step_")) {
      say("A STEP", "one move out, and it is " + nameOf(c.slice(5)));
    } else if (c.startsWith("breath_")) {
      say("A BREATH", nameOf(c.slice(7)) + " is standing there");
    } else if (c === "footstep") {
      say("FOOTSTEPS", "something is moving");
    } else if (c === "fredbear_laugh") {
      say("A LAUGH", "he is somewhere in the room");
    } else if (c === "scare_sprint") {
      say("", "");
    }
  }
}

function nameOf(key) {
  for (const t of g.threats) if (t.key === key) return t.name;
  return key;
}

function paint() {
  drawRoom(g);
  document.getElementById("night").textContent = "NIGHT " + g.night;
  document.getElementById("clock").textContent = g.clock();
  const nz = document.getElementById("nz");
  nz.firstElementChild.style.width = Math.round((g.noise / NOISE_MAX) * 100) + "%";
  nz.className = "meter" + (g.noise > NOISE_MAX * 0.6 ? " loud" : "");
  document.getElementById("heard").innerHTML = heard;

  const st = g.status;
  for (const id of ["mb", "ml", "mc", "mr", "fl"]) {
    document.getElementById(id).disabled = st !== "PLAYING" || g.busy > 0;
  }

  if (st !== "PLAYING" && document.getElementById("over").hidden) {
    document.getElementById("over").hidden = false;
    document.getElementById("overtitle").textContent =
      st === "SURVIVED" ? "6 AM" : "IT GOT YOU";
    document.getElementById("overtext").textContent =
      st === "SURVIVED" ? "Nothing was standing there at six. " + g.flashes + " flashes."
                        : g.killer + " was standing there and you were not.";
  }
}

document.getElementById("mb").onclick = () => g && g.moveTo("BED");
document.getElementById("ml").onclick = () => g && g.moveTo("LEFT");
document.getElementById("mc").onclick = () => g && g.moveTo("CLOSET");
document.getElementById("mr").onclick = () => g && g.moveTo("RIGHT");
document.getElementById("fl").onclick = () => g && g.flash();
document.getElementById("again").onclick = () => { const n = g.night; start(n); };

(function build() {
  const sel = document.getElementById("select");
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.className = "nightrow";
    b.innerHTML = '<span class="t">Night ' + n + "</span>"
      + '<span class="n">' + C.notes[n - 1] + "</span>";
    b.onclick = () => start(n);
    sel.appendChild(b);
  }
  document.getElementById("help").textContent = C.help;
})();
</script>
