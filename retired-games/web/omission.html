<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omission</title>
<style>
  :root {
    --bg: #0B0A08;
    --iron: #131210;
    --ink: #EDE9E0;
    --dim: #A29C8E;
    --faint: #6E6A60;
    --gold: #E8B44A;
    --bad: #D9534F;
    --good: #7FBF7F;
    --silent: #7FB2E5;
    --paper: #1A1813;
    --edge: #2E2B23;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) 0 0 0;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 150px; }
  h1 { font-family: Georgia, serif; font-size: 34px; color: var(--gold); margin: 18px 0 2px; font-weight: 400; }
  .sub { color: var(--faint); font-size: 12px; margin-bottom: 18px; }
  p { margin: 0 0 14px; }
  .scene { font-family: Georgia, serif; font-size: 17px; color: var(--ink); }
  .card { background: var(--paper); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .card h2 { font-size: 12px; letter-spacing: .08em; color: var(--faint); margin: 0 0 12px; font-weight: 600; }
  .rule { margin-bottom: 14px; }
  .rule .k { color: var(--gold); font-size: 14px; }
  .rule .t { color: var(--dim); font-size: 13px; }
  button {
    font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 13px 18px;
    background: var(--gold); color: #14110A; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--edge); font-weight: 400; }
  button[disabled] { opacity: .38; cursor: default; }
  .row {
    display: block; width: 100%; text-align: left; background: transparent; color: var(--ink);
    border: 0; border-bottom: 1px solid var(--edge); border-radius: 0; padding: 10px 8px;
    font-weight: 400; font-size: 15px;
  }
  .row .t { font-family: Georgia, serif; display: block; }
  .row .s { display: block; font-size: 12px; color: var(--silent); margin-top: 3px; }
  .row .s.spoken { color: var(--faint); }
  .row .w { display: block; font-size: 11px; color: var(--faint); margin-top: 3px; letter-spacing: .04em; }
  .row.in { background: var(--paper); border-radius: 10px; }
  .row.in .t { color: var(--gold); }
  .row.in .w { color: var(--gold); }
  .bag { font-size: 14px; color: var(--ink); padding: 6px 0; border-bottom: 1px solid var(--edge); }
  .bag .b { color: var(--gold); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(11,10,8,.96);
    border-top: 1px solid var(--edge); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  .bar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .bar .n { color: var(--dim); font-size: 13px; flex: 1; }
  .big { font-family: Georgia, serif; font-size: 23px; color: var(--ink); margin: 4px 0 14px; }
  .big.good { color: var(--good); }
  .big.bad { color: var(--bad); }
  .stat { font-size: 14px; color: var(--dim); margin-bottom: 6px; }
  .closing { font-family: Georgia, serif; font-size: 16px; color: var(--ink); margin: 18px 0; }
  .note { color: var(--faint); font-size: 12px; margin-top: 8px; }
  .warn { color: var(--bad); font-size: 13px; margin-bottom: 10px; }
  .read { padding: 8px 0; border-bottom: 1px solid var(--edge); }
  .read .t { font-family: Georgia, serif; font-size: 15px; }
  .read .m { font-size: 12px; margin-top: 3px; }
  .read .m.ok { color: var(--good); }
  .read .m.no { color: var(--bad); }
  .read .m.kept { color: var(--gold); }
  .read .m .as { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const C = {
"wordmark":"Omission",
"where":"the house",
"whereList":"what you know",
"whereReport":"what you kept",
"list":12,
"slots":5,
"pool":[
  {"id":"door-green","text":"The front door was green.","said":"You told the neighbours, and the man who fixed the gutter, and the woman at the estate agent's.","matters":2,"told":true,"assumed":"The front door was green."},
  {"id":"clock-fast","text":"The kitchen clock ran four minutes fast.","said":"You said it at the fence, twice, to two different people.","matters":3,"told":true,"assumed":"The kitchen clock ran four minutes fast."},
  {"id":"boiler-october","text":"The boiler was serviced every October.","said":"You put it in writing, to the people who bought the house.","matters":3,"told":true,"assumed":"The boiler was serviced every October."},
  {"id":"house-hill","text":"The house stood at the top of a hill.","said":"You said it every time you gave anybody directions, and you never once had to be asked.","matters":1,"told":true,"assumed":"The house stood at the top of a hill."},
  {"id":"cherry-tree","text":"There was a cherry tree at the end of the garden.","said":"You mentioned the tree to everyone who asked about the garden.","matters":2,"told":true,"assumed":"There was a cherry tree at the end of the garden."},
  {"id":"tap-drip","text":"The bathroom tap dripped all night.","said":"You complained about it at work for a year, and never got it fixed.","matters":2,"told":true,"assumed":"The bathroom tap dripped all night."},
  {"id":"stair-left","text":"The third stair creaked on the left.","said":"You never said this to anybody.","matters":1,"told":false,"assumed":"The third stair creaked on the right."},
  {"id":"drawer-stick","text":"The second drawer in the dresser stuck unless you lifted it.","said":"You never mentioned the drawer.","matters":1,"told":false,"assumed":"The second drawer slid out easily."},
  {"id":"back-key","text":"The back door key turned twice.","said":"Nobody else ever used the back door.","matters":2,"told":false,"assumed":"The back door key turned once."},
  {"id":"hall-light","text":"The hall light took four seconds to come on.","said":"You never said it out loud.","matters":2,"told":false,"assumed":"The hall light came on at once."},
  {"id":"small-window","text":"The window in the small room faced east.","said":"You never told anyone which way it faced.","matters":1,"told":false,"assumed":"The window in the small room faced west."},
  {"id":"cold-water","text":"The water in the morning ran cold for a long time.","said":"It did not come up.","matters":1,"told":false,"assumed":"The water in the morning ran hot in a moment."},
  {"id":"three-steps","text":"There were three steps down to the garden.","said":"You never counted them out loud.","matters":1,"told":false,"assumed":"There were two steps down to the garden."},
  {"id":"high-shelf","text":"The pantry shelf was too high to reach without the stool.","said":"You never said so.","matters":2,"told":false,"assumed":"The pantry shelf was at eye level."},
  {"id":"wall-phone","text":"The telephone was on the wall by the door.","said":"You never described it to anyone.","matters":1,"told":false,"assumed":"The telephone was on the table in the hall."},
  {"id":"sloped-floor","text":"The floor in the front room sloped toward the window.","said":"You were not sure it was true, so you said nothing.","matters":2,"told":false,"assumed":"The floor in the front room was level."},
  {"id":"gate-out","text":"The gate at the end of the path opened outward.","said":"You never mentioned the gate.","matters":1,"told":false,"assumed":"The gate at the end of the path opened inward."},
  {"id":"bedroom-door","text":"The bedroom door had to be lifted to close.","said":"You never told anyone about the door.","matters":3,"told":false,"assumed":"The bedroom door closed with a push."}
],
"worth":["","little","some","most"],
"scoreLine":["no of twelve things, worth %score% of the %total% that was there.","one of twelve things, worth %score% of the %total% that was there.","two of twelve things, worth %score% of the %total% that was there.","three of twelve things, worth %score% of the %total% that was there.","four of twelve things, worth %score% of the %total% that was there.","five of twelve things, worth %score% of the %total% that was there.","six of twelve things, worth %score% of the %total% that was there.","seven of twelve things, worth %score% of the %total% that was there.","eight of twelve things, worth %score% of the %total% that was there.","nine of twelve things, worth %score% of the %total% that was there.","ten of twelve things, worth %score% of the %total% that was there.","eleven of twelve things, worth %score% of the %total% that was there.","twelve of twelve things, worth %score% of the %total% that was there."],
"bestLine":"The most that was there to keep: %best%.",
"verdict":{
  "perfect":"Every slot went to something nobody else knew. There was nothing better to do with five.",
  "wasted":"You spent a slot on something you had already said out loud. It would have come back to you on its own.",
  "lost":"You left behind the heaviest thing nobody else knew, and you will remember it wrong.",
  "short":"You kept less than you could have."
},
"closing":{
  "perfect":["Five slots, and no things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and one things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and two things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and three things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and four things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and five things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and six things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and seven things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and eight things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and nine things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and ten things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and eleven things nobody else knew. You spent every one of them on the part of the house that would not have come back.","Five slots, and twelve things nobody else knew. You spent every one of them on the part of the house that would not have come back."],
  "wasted":["You spent the slots on the things nobody else knew and you still came out short, because there were more of them than there was room. That is not a mistake. That is the arithmetic.","one slot went to something you had said out loud, and the thing you had said out loud was never in danger. That is the whole of it: you kept what was already safe.","two slots went to something you had said out loud, and the thing you had said out loud was never in danger. That is the whole of it: you kept what was already safe.","three slots went to something you had said out loud, and the thing you had said out loud was never in danger. That is the whole of it: you kept what was already safe.","four slots went to something you had said out loud, and the thing you had said out loud was never in danger. That is the whole of it: you kept what was already safe.","five slots went to something you had said out loud, and the thing you had said out loud was never in danger. That is the whole of it: you kept what was already safe."],
  "short":"You spent the slots on the things nobody else knew and you still came out short, because there were more of them than there was room. That is not a mistake. That is the arithmetic."
},
"voice":{
  "opening":["You have lived in this house for nine years. You are leaving it tonight, and you are not coming back.","You cannot take the house. You can take five things you know about it. There are twelve on the list, and one bag.","What you leave behind is not gone. You will remember it. You will just remember it the way you would have guessed, and you will not be able to tell which ones those are."],
  "rulesHeading":"THE ONE THING THAT SAVES A MEMORY",
  "rules":[{"key":"SAID","text":"A thing you said out loud has been said back to you at least once, by somebody who was there. It has been checked against the world, and it comes back to you on its own."},{"key":"UNSAID","text":"A thing you never said has only ever been in your own head. Nothing has ever corrected it, and what you remember will be what you would have assumed."},{"key":"","text":"Five things fit in the bag. Spend them on what nobody else knows."}],
  "listHead":"WHAT YOU KNOW",
  "bagHead":"THE BAG",
  "keptTag":"in the bag",
  "cameBackTag":"left, and it came back",
  "youBelieve":"you remember it as",
  "readBackHead":"WHAT YOU REMEMBER",
  "scoreHead":"WHAT YOU KEPT, WEIGHTED",
  "nothingYet":"Nothing in the bag yet.",
  "slotsLeft":"left in the bag",
  "startButton":"Start filling the bag",
  "again":"Another house",
  "leaveShort":"The bag is full. Close it and go.",
  "leaveButton":"Close the bag and go",
  "take":"Put it in the bag",
  "full":"The bag is full."
}
}
;

//__MODEL_BEGIN__
// The deal, ported. Counter-based, not a stream: every number is a pure
// function of (seed, salt), so the phone and the desktop can deal the same
// list without either carrying an RNG position. The arithmetic is BigInt
// because a double loses the low bits of a 64-bit Java long and the two builds
// would diverge on the first draw.
const MASK = (1n << 64n) - 1n;
function mix(seed, salt) {
  let z = (BigInt(seed) + 0x9E3779B97F4A7C15n * BigInt(salt + 1)) & MASK;
  z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & MASK;
  z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & MASK;
  return (z ^ (z >> 31n)) & MASK;
}
function pick(seed, salt, n) {
  if (n <= 1) return 0;
  return Number(mix(seed, salt) % BigInt(n));
}
// n distinct indices out of poolSize, in a shuffled order -- the same partial
// Fisher-Yates the model runs, in the same order, or the list would differ.
function dealIdx(seed, salt, poolSize, n) {
  const idx = [];
  for (let i = 0; i < poolSize; i++) idx.push(i);
  for (let i = 0; i < n; i++) {
    const j = i + pick(seed, salt + i, poolSize - i);
    const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  return idx.slice(0, n);
}
function dealList(seed) {
  return dealIdx(seed, 100, C.pool.length, C.list).map(i => C.pool[i]);
}
// What you remember about a thing, after the bag is closed. A thing in the bag
// you remember as it was. A thing you left behind you remember as it was only
// if you had said it out loud -- otherwise you remember the assumption.
function believed(list, kept, i) {
  const d = list[i];
  if (kept.indexOf(i) >= 0 || d.told) return d.text;
  return d.assumed;
}
function right(list, kept, i) { return believed(list, kept, i) === list[i].text; }
function scoreOf(list, kept) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (right(list, kept, i)) n += list[i].matters;
  return n;
}
function totalOf(list) { let n = 0; for (const d of list) n += d.matters; return n; }
function rightCount(list, kept) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (right(list, kept, i)) n++;
  return n;
}
function silentCount(list) { let n = 0; for (const d of list) if (!d.told) n++; return n; }
// The most that was available to a player who knew the rule: everything you
// said comes back for free, so the slots go to the heaviest things nobody else
// knew. Derived, not declared -- a build that changed the rule would move it.
function bestOf(list) {
  let n = 0; const silent = [];
  for (const d of list) { if (d.told) n += d.matters; else silent.push(d.matters); }
  silent.sort((a, b) => b - a);
  for (let i = 0; i < Math.min(C.slots, silent.length); i++) n += silent[i];
  return n;
}
function heaviestLost(list, kept) {
  let best = null;
  for (let i = 0; i < list.length; i++) {
    const d = list[i];
    if (d.told || kept.indexOf(i) >= 0) continue;
    if (best === null || d.matters > best.matters) best = d;
  }
  return best;
}
function heaviestWasted(list, kept) {
  let best = null;
  for (const i of kept) {
    const d = list[i];
    if (!d.told) continue;
    if (best === null || d.matters > best.matters) best = d;
  }
  return best;
}
function wastedSlots(list, kept) {
  let n = 0;
  for (const i of kept) if (list[i].told) n++;
  return n;
}
//__MODEL_END__

const KEY = 'aside.omission.house';
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let seed = null, list = null, kept = [], left = false, cursor = 0, notice = '';

function newHouse() {
  seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  list = dealList(seed);
  kept = []; left = false; cursor = 0; notice = '';
  save();
}
function serialize() { return JSON.stringify({ seed: seed, kept: kept, left: left }); }
function save() {
  try { localStorage.setItem(KEY, serialize()); return true; } catch (e) { return false; }
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    seed = s.seed; list = dealList(seed); kept = s.kept || []; left = !!s.left;
    return true;
  } catch (e) { return false; }
}
function deserialize(raw) {
  const s = JSON.parse(raw);
  return { seed: s.seed, list: dealList(s.seed), kept: s.kept || [], left: !!s.left };
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild($('<h1>' + esc(C.wordmark) + '</h1>'));
  app.appendChild($('<div class="sub">' + esc(left ? C.whereReport : (kept.length ? C.whereList : C.where)) + '</div>'));
  if (left) renderReport(app); else if (kept.length || started) renderChoose(app); else renderOpen(app);
  renderBar(app);
}

let started = false;

function renderOpen(app) {
  for (const p of C.voice.opening) app.appendChild($('<p class="scene">' + esc(p) + '</p>'));
  const card = $('<div class="card"></div>');
  card.appendChild($('<h2>' + esc(C.voice.rulesHeading) + '</h2>'));
  for (const r of C.voice.rules) {
    const d = $('<div class="rule"></div>');
    if (r.key) d.appendChild($('<div class="k">' + esc(r.key) + '</div>'));
    d.appendChild($('<div class="t">' + esc(r.text) + '</div>'));
    card.appendChild(d);
  }
  app.appendChild(card);
}

function renderChoose(app) {
  const card = $('<div class="card"></div>');
  card.appendChild($('<h2>' + esc(C.voice.listHead) + '</h2>'));
  list.forEach((d, i) => {
    const inBag = kept.indexOf(i) >= 0;
    const b = $('<button class="row' + (inBag ? ' in' : '') + '"></button>');
    b.appendChild($('<span class="t">' + esc(d.text) + '</span>'));
    b.appendChild($('<span class="s' + (d.told ? ' spoken' : '') + '">' + esc(d.said) + '</span>'));
    b.appendChild($('<span class="w">' + esc(C.worth[d.matters]) + (inBag ? '  \u00b7  ' + esc(C.voice.keptTag) : '') + '</span>'));
    b.onclick = () => { toggle(i); };
    card.appendChild(b);
  });
  app.appendChild(card);

  const bag = $('<div class="card"></div>');
  bag.appendChild($('<h2>' + esc(C.voice.bagHead) + '</h2>'));
  if (!kept.length) bag.appendChild($('<div class="note">' + esc(C.voice.nothingYet) + '</div>'));
  for (const i of kept) bag.appendChild($('<div class="bag"><span class="b">\u2022</span> ' + esc(list[i].text) + '</div>'));
  bag.appendChild($('<div class="note">' + (C.slots - kept.length) + ' ' + esc(C.voice.slotsLeft) + '</div>'));
  app.appendChild(bag);
}

function renderReport(app) {
  const card = $('<div class="card"></div>');
  card.appendChild($('<h2>' + esc(C.voice.readBackHead) + '</h2>'));
  list.forEach((d, i) => {
    const ok = right(list, kept, i), inBag = kept.indexOf(i) >= 0;
    const row = $('<div class="read"></div>');
    row.appendChild($('<div class="t">' + esc(d.text) + '</div>'));
    if (!ok) row.appendChild($('<div class="m no">' + esc(C.voice.youBelieve) + ' <span class="as">' + esc(d.assumed) + '</span></div>'));
    else if (inBag) row.appendChild($('<div class="m kept">' + esc(C.voice.keptTag) + '</div>'));
    else row.appendChild($('<div class="m ok">' + esc(C.voice.cameBackTag) + '</div>'));
    card.appendChild(row);
  });
  app.appendChild(card);

  const score = scoreOf(list, kept), best = bestOf(list);
  const count = rightCount(list, kept), total = totalOf(list);
  const wasted = heaviestWasted(list, kept), lost = heaviestLost(list, kept);

  const card2 = $('<div class="card"></div>');
  card2.appendChild($('<h2>' + esc(C.voice.scoreHead) + '</h2>'));
  card2.appendChild($('<div class="big' + (score >= best ? ' good' : '') + '">' + score + ' / ' + total + '</div>'));
  card2.appendChild($('<div class="stat">' + esc(C.scoreLine[count].replace('%score%', score).replace('%total%', total)) + '</div>'));
  card2.appendChild($('<div class="note">' + esc(C.bestLine.replace('%best%', best)) + '</div>'));
  app.appendChild(card2);

  const card3 = $('<div class="card"></div>');
  let v;
  if (score >= best) v = C.verdict.perfect;
  else if (wasted !== null && (lost === null || wasted.matters >= lost.matters)) v = C.verdict.wasted;
  else if (lost !== null) v = C.verdict.lost;
  else v = C.verdict.short;
  card3.appendChild($('<div class="big' + (score >= best ? ' good' : ' bad') + '">' + esc(v) + '</div>'));
  let c;
  if (score >= best) c = C.closing.perfect[silentCount(list)];
  else if (wastedSlots(list, kept) > 0) c = C.closing.wasted[wastedSlots(list, kept)];
  else c = C.closing.short;
  card3.appendChild($('<div class="closing">' + esc(c) + '</div>'));
  app.appendChild(card3);
}

function renderBar(app) {
  const bar = $('<div class="bar"></div>');
  const inner = $('<div class="in"></div>');
  if (notice) inner.appendChild($('<div class="warn">' + esc(notice) + '</div>'));
  if (left) {
    const b = $('<button>' + esc(C.voice.again) + '</button>');
    b.onclick = () => { newHouse(); started = false; render(); };
    inner.appendChild(b);
  } else if (!started) {
    const b = $('<button>' + esc(C.voice.startButton) + '</button>');
    b.onclick = () => { started = true; render(); };
    inner.appendChild(b);
  } else if (kept.length >= C.slots) {
    inner.appendChild($('<div class="n">' + esc(C.voice.leaveShort) + '</div>'));
    const b = $('<button>' + esc(C.voice.leaveButton) + '</button>');
    b.onclick = () => { left = true; save(); render(); };
    inner.appendChild(b);
  } else {
    inner.appendChild($('<div class="n">' + (C.slots - kept.length) + ' ' + esc(C.voice.slotsLeft) + '</div>'));
    const b = $('<button class="ghost" disabled>' + esc(C.voice.take) + '</button>');
    inner.appendChild(b);
  }
  bar.appendChild(inner);
  app.appendChild(bar);
}

function toggle(i) {
  notice = '';
  const at = kept.indexOf(i);
  if (at >= 0) { kept.splice(at, 1); }
  else if (kept.length < C.slots) { kept.push(i); }
  else { notice = C.voice.full; }
  save();
  render();
}

// Boot: pick up a house in progress, or deal one.
if (!load()) newHouse();
render();

// Exposed for the trace and for a headless check of the real storage wiring.
window.omission = { dealList, believed, right, scoreOf, totalOf, rightCount, silentCount,
  bestOf, heaviestLost, heaviestWasted, wastedSlots, serialize, deserialize, save, load,
  state: () => ({ seed, list, kept, left }) };
</script>
</body>
</html>
